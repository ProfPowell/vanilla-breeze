<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Layout attributes on native elements</title>
</head>
<body>
  <main data-canvas="elevated" data-canvas-depth="1">
    <h1>Layout attributes</h1>
    <section data-layout="stack" data-layout-gap="m" data-layout-align="center">
      <p>Stack</p>
    </section>
    <section data-canvas data-layout="grid" data-layout-gap data-layout-subgrid data-layout-min="s">
      <p>Bare forms</p>
    </section>
    <nav aria-label="Example" data-layout="cluster" data-layout-nowrap data-layout-justify="between">
      <a href="minimal.html">Minimal page</a>
    </nav>
  </main>
</body>
</html>
