<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Social Embed (Static Fallback)</title>
  <style>
    /*
      Minimal baseline styling for the no-JS fallback.
      A production page would load the project stylesheet instead;
      these rules exist only so the file is self-contained.
    */
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: system-ui, sans-serif;
      line-height: 1.5;
      max-inline-size: 40rem;
      margin-inline: auto;
      padding: 2rem 1rem;
    }
  </style>
</head>
<body>

  <!--
    Upgrade relationship
    ====================
    This static HTML IS the baseline that <social-embed> enhances.

    When JavaScript loads and <social-embed> is defined, each fallback
    link gains a real "Load {platform} post" button and a note naming the
    host. Pressing it replaces the link with a sandboxed iframe built from
    the validated URL. URLs no provider accepts keep the plain link.

    Without JS the links remain accessible and functional.
  -->

  <h1>Social Embed</h1>

  <noscript>
    <p>This component works best with JavaScript enabled.</p>
  </noscript>

  <p>Without JavaScript each embed is its fallback link. With JavaScript a
  "Load … post" button appears beside the link; the post loads in a
  sandboxed frame only when it is pressed.</p>

  <figure>
    <social-embed url="https://bsky.app/profile/did:plc:z72i7hdynmk6r22z27h6tvur/post/3l6oveex3ii2l">
      <a href="https://bsky.app/profile/bsky.app/post/3l6oveex3ii2l">View the pinned @bsky.app post on Bluesky</a>
    </social-embed>
    <figcaption>Bluesky post</figcaption>
  </figure>

  <figure>
    <social-embed url="https://mastodon.social/@Mastodon/116765910384325070">
      <a href="https://mastodon.social/@Mastodon/116765910384325070">View the pinned @Mastodon post on mastodon.social</a>
    </social-embed>
    <figcaption>Mastodon post</figcaption>
  </figure>

  <figure>
    <social-embed url="https://www.youtube.com/watch?v=dQw4w9WgXcQ" data-title="Never Gonna Give You Up">
      <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">Watch "Never Gonna Give You Up" on YouTube</a>
    </social-embed>
    <figcaption>YouTube video</figcaption>
  </figure>

</body>
</html>
