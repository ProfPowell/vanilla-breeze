<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time Picker (Static Fallback)</title>
  <style>
    /*
      Minimal baseline styling for the no-JS fallback.
      A production page would load the project stylesheet instead;
      these rules exist only so the file is self-contained.
    */
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: system-ui, sans-serif;
      line-height: 1.5;
      max-inline-size: 40rem;
      margin-inline: auto;
      padding: 2rem 1rem;
    }
  </style>
</head>
<body>

  <!--
    Upgrade relationship
    ====================
    This static HTML IS the baseline that <time-picker> enhances.

    When JavaScript loads and the <time-picker> custom element is
    defined, the markup is progressively enhanced with additional
    interactivity, ARIA attributes, and keyboard navigation.

    Without JS the core content remains accessible and functional.
  -->

  <h1>Time Picker</h1>

  <!--
    Without JS (or before the element is defined) <time-picker> is
    display: contents and the native <input type="time"> is the whole
    control: the browser's own picker, min/max/step, required and form
    submission under the input's name all work. Put the name on the
    inner input; on upgrade it moves to the host so exactly one value
    is submitted.
  -->
  <form action="#" method="get">
    <p>
      <label for="slot">Appointment slot</label>
      <time-picker data-format="24h">
        <input type="time" id="slot" name="slot"
               min="09:00" max="17:00" step="900" required>
      </time-picker>
    </p>
    <p>
      <button type="submit">Submit</button>
    </p>
  </form>

</body>
</html>
