<!--
  score-card — static (zero-JS) form

  Shadow-DOM slots only assign DIRECT children of the host, so every slotted
  element sits directly under <score-card> (never inside a wrapping <figure>).
  Block-level children (<p>) keep the metric readable as a stacked list before
  upgrade or without JS; the component resets their margins once upgraded.
-->
<score-card trend="up">
  <p slot="title">Total Users</p>
  <p slot="value"><data value="24521">24,521</data></p>
  <p slot="change"><data value="0.125">+12.5%</data> vs last month</p>
  <p slot="description">Active in last 30 days</p>
</score-card>
