<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bread-crumb — Static Fallback</title>
</head>
<body>
  <!--
    Static fallback for <bread-crumb>.

    Upgrade relationship:
    - Without JS: the wrapping <nav aria-label="Breadcrumb"> provides the
      landmark and the <ol><li> structure renders as a styled trail. VB
      applies separators (decorative, empty CSS alt text), truncation and
      collapse via the bread-crumb element selector (no class needed).
      Mark the last crumb aria-current="page" in the markup.
    - With JS: <bread-crumb> keeps aria-current="page" on the last crumb,
      emits a BreadcrumbList JSON-LD <script> child for SEO, and with
      data-collapsed inserts a "Show full path" <button aria-expanded>.
      Only when it is NOT inside a <nav> does it add role="navigation" +
      aria-label="Breadcrumb" to itself as a fallback.
    - Auto mode (data-from-pathname): the component builds the trail
      from window.location.pathname; data-current-label wins for the last
      crumb, then the .labels property, then the decoded, Title-Cased slug.
  -->

  <nav aria-label="Breadcrumb">
    <bread-crumb>
      <ol>
        <li><a href="/docs/">Docs</a></li>
        <li><a href="/docs/elements/">Elements</a></li>
        <li><span aria-current="page">Bread Crumb</span></li>
      </ol>
    </bread-crumb>
  </nav>
</body>
</html>
