<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Info (Static Fallback)</title>
  <style>
    /*
      Minimal baseline styling for the no-JS fallback.
      A production page would load the project stylesheet instead;
      these rules exist only so the file is self-contained.
    */
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: system-ui, sans-serif;
      line-height: 1.5;
      max-inline-size: 40rem;
      margin-inline: auto;
      padding: 2rem 1rem;
    }
  </style>
</head>
<body>

  <!--
    Upgrade relationship
    ====================
    This static HTML IS the baseline that <page-info> enhances.

    When JavaScript loads, time[data-relative] gets a localized
    relative date (absolute date kept in title), [data-reading-time]
    is filled in, and the badge gains its visible trust-tier text.
    <details>/<summary> already expands and collapses without JS.

    Without JS the core content remains accessible and functional.
  -->

  <h1>Page Info</h1>

  <noscript>
    <p>This component works best with JavaScript enabled.</p>
  </noscript>

  <page-info>
    <details>
      <summary>
        <span class="page-info-author">Jane Doe</span>
        <span class="page-info-sep" aria-hidden="true">&middot;</span>
        <time datetime="2026-03-15" data-relative>15 March 2026</time>
        <span class="page-info-sep" aria-hidden="true">&middot;</span>
        <span class="page-info-badge" data-provenance="ai-assisted" data-trust="declared">Human-written, AI-assisted</span>
      </summary>
      <section class="page-info-panel">
        <section>
          <h2 class="page-info-section-heading">Author</h2>
          <p><a href="/team/jane" rel="author">Jane Doe</a></p>
        </section>
        <section>
          <h2 class="page-info-section-heading">History</h2>
          <dl>
            <dl-item><dt>Published</dt><dd><time datetime="2026-01-10">10 January 2026</time></dd></dl-item>
            <dl-item><dt>Last updated</dt><dd><time datetime="2026-03-15" data-relative>15 March 2026</time></dd></dl-item>
          </dl>
        </section>
      </section>
    </details>
  </page-info>

</body>
</html>
