<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Set (Static Fallback)</title>
</head>
<body>

  <!--
    Upgrade relationship
    ====================
    This static HTML IS the baseline that <change-set> enhances.

    Without JavaScript the native <ins> / <del> elements carry the change
    (styled by the native-element CSS), and the CSS-only `view` attribute
    still switches a set to its final or original text. The JavaScript adds
    a caption built from author / datetime and Tracking / Final / Original
    toggle buttons (a labelled button group with aria-pressed).

    Before upgrade the author / datetime attributes are metadata only (the
    per-edit datetime on <ins> / <del> is native). If the who / when must be
    visible without JavaScript, put it in surrounding text outside the set,
    since the upgraded caption would otherwise repeat it.
  -->

  <h1>Change Set</h1>

  <change-set datetime="2026-02-20" author="tpowell">
    <p>
      Send requests to
      <del datetime="2026-02-20">/api/v1/upload</del>
      <ins datetime="2026-02-20">/api/v2/ingest</ins>
      with a
      <del>Content-Type: application/xml</del>
      <ins>Content-Type: application/json</ins>
      header.
    </p>
  </change-set>

  <h2>Server-rendered final text</h2>
  <change-set view="final" controls="none">
    <p>Requests go to <del>/api/v1/upload</del><ins>/api/v2/ingest</ins>.</p>
  </change-set>

</body>
</html>
