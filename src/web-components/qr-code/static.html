<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Code — Static Fallback</title>
</head>
<body>
  <!--
    Static fallback for <qr-code>.

    Upgrade relationship:
    - Without JS: The URL or text value is displayed as a plain clickable
      link. Users can follow the link directly, which is the same action
      that scanning the QR code would accomplish.
    - With JS: <qr-code> reads `value` (or its text content) and draws a
      black-on-white QR code with a 4-module quiet zone on a canvas, using
      the vendored Nayuki qrcodegen encoder (versions 1-40). The children
      are NOT removed: they stay in the element as the caption (visually
      hidden unless data-caption="visible"), so this link remains available
      to screen readers and keyboard users, and is shown again if the value
      is too long to encode. Supports `size`, `color`, `background` and
      `error-correction` (L|M|Q|H or 0-3).

    The static form provides the same end-user action (visiting the URL)
    without requiring the visual QR encoding step.
  -->

  <main>
    <h1>QR Code</h1>

    <p>
      <a href="https://example.com">https://example.com</a>
    </p>
  </main>
</body>
</html>
