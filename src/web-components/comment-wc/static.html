<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Comment action (Static Fallback)</title></head>
<body>
  <!--
    comment-wc is one action button inside a <selection-menu> toolbar
    (experimental stub: it pins comments to a <review-surface>, which
    Vanilla Breeze does not ship). The menu itself only appears in response
    to a text selection, so there is no meaningful no-JS rendering of the
    action. The fallback is the content alone: readers can still read and
    select text, and a page that needs comments without JS should offer a
    plain form or link to its discussion.
  -->
  <article id="my-article">
    <h1>Article title</h1>
    <p>Readable, selectable content. Without JavaScript no selection menu or comment action is shown.</p>
    <p><a href="#discussion">Join the discussion</a></p>
  </article>
  <noscript>
    <p>comment-wc adds an "Add comment" action to selection-menu. It needs JavaScript to detect the selection; without it, link to a discussion page or form instead.</p>
  </noscript>
</body>
</html>
