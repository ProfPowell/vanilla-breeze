<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery — No-JS Baseline</title>
  <link rel="stylesheet" href="/src/main.css">
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <h1>Image Gallery — Progressive Enhancement</h1>
  <p>Without JavaScript, thumbnails are a responsive grid of links. Click any thumbnail to navigate directly to the full image.</p>

  <h2>Image-only mode</h2>
  <image-gallery>
    <a href="/src/assets/placeholders/photo-id-10-1200x800.svg">
      <img src="/src/assets/placeholders/photo-id-10-400x400.svg" alt="Misty forest" loading="lazy" />
    </a>
    <a href="/src/assets/placeholders/photo-id-20-1200x800.svg">
      <img src="/src/assets/placeholders/photo-id-20-400x400.svg" alt="Coast highway" loading="lazy" />
    </a>
    <a href="/src/assets/placeholders/photo-id-30-1200x800.svg">
      <img src="/src/assets/placeholders/photo-id-30-400x400.svg" alt="House on a hill" loading="lazy" />
    </a>
    <a href="/src/assets/placeholders/photo-id-40-1200x800.svg">
      <img src="/src/assets/placeholders/photo-id-40-400x400.svg" alt="Autumn trees" loading="lazy" />
    </a>
    <a href="/src/assets/placeholders/photo-id-50-1200x800.svg">
      <img src="/src/assets/placeholders/photo-id-50-400x400.svg" alt="Winding road" loading="lazy" />
    </a>
    <a href="/src/assets/placeholders/photo-id-60-1200x800.svg">
      <img src="/src/assets/placeholders/photo-id-60-400x400.svg" alt="Mountain peak" loading="lazy" />
    </a>
  </image-gallery>

  <h2>With captions</h2>
  <image-gallery columns="250px" ratio="4:3">
    <figure>
      <a href="/src/assets/placeholders/photo-id-100-1200x800.svg">
        <img src="/src/assets/placeholders/photo-id-100-400x300.svg" alt="Mountain lake" loading="lazy" />
      </a>
      <figcaption>
        <strong>Morning at the Lake</strong>
        <p>Taken at dawn, Banff National Park.</p>
      </figcaption>
    </figure>
    <figure>
      <a href="/src/assets/placeholders/photo-id-110-1200x800.svg">
        <img src="/src/assets/placeholders/photo-id-110-400x300.svg" alt="Desert road" loading="lazy" />
      </a>
      <figcaption>
        <strong>Desert Highway</strong>
        <p>Route 66, Arizona. <a href="#">View series</a></p>
      </figcaption>
    </figure>
    <figure>
      <a href="/src/assets/placeholders/photo-id-120-1200x800.svg">
        <img src="/src/assets/placeholders/photo-id-120-400x300.svg" alt="City at night" loading="lazy" />
      </a>
      <figcaption>
        <strong>Urban Glow</strong>
        <p>Downtown after midnight.</p>
      </figcaption>
    </figure>
  </image-gallery>

  <!-- No JS loaded — demonstrates baseline behavior -->
</body>
</html>
