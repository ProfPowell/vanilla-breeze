<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading Progress — Static Fallback</title>
</head>
<body>
  <!--
    Static fallback for <reading-progress>.

    Upgrade relationship:
    - Without JS, modern browsers: CSS scroll-timeline drives the bar
      via animation-timeline: scroll(root block) when there is no
      data-for. No script needed to track the whole document.
    - Without JS, older browsers or with data-for: the bar stays empty.
      Nothing is lost: the bar is decorative.
    - With JS: the component upgrades, creates the <progress> child if
      absent, and runs a passive scroll listener when scroll-timeline is
      unsupported or data-for binds progress to an element's bounds.

    The bar is decorative: the <progress> child is always aria-hidden
    (the scrollable document already exposes the reading position).
  -->

  <reading-progress data-for="article-content" data-position="top">
    <progress max="100" value="0" aria-hidden="true"></progress>
  </reading-progress>

  <main>
    <article id="article-content">
      <h1>Walking</h1>
      <p>
        Walking is one of the simplest forms of exercise available. It
        requires no equipment and can be done almost anywhere.
      </p>
    </article>
  </main>
</body>
</html>
