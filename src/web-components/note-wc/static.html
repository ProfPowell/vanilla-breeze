<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Note (Static Fallback)</title></head>
<body>
  <!--
    Upgrade relationship
    ====================
    <note-wc> is a pure enhancement: it renders a "private note" button
    inside <selection-menu> (or a page-level button with for="id") and a
    note panel that stores the reader's notes in localStorage. Without
    JavaScript there is no selection toolbar and nothing to annotate, so
    the element renders nothing and the article reads normally.
  -->
  <selection-menu for="article">
    <note-wc></note-wc>
  </selection-menu>

  <article id="article">
    <h1>Article title</h1>
    <p>The article reads normally without JavaScript. Private notes need scripting.</p>
  </article>
  <noscript>
    <p>Private notes need JavaScript: note-wc adds a note action to the text-selection toolbar and keeps your notes in this browser.</p>
  </noscript>
</body>
</html>
