<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown Editor (Static Fallback)</title>
  <style>
    /*
      Minimal baseline styling for the no-JS fallback.
      A production page would load the project stylesheet instead;
      these rules exist only so the file is self-contained.
    */
    *, *::before, *::after { box-sizing: border-box; }

    textarea { inline-size: 100%; font-family: monospace; }

    body {
      font-family: system-ui, sans-serif;
      line-height: 1.5;
      max-inline-size: 40rem;
      margin-inline: auto;
      padding: 2rem 1rem;
    }
  </style>
</head>
<body>

  <!--
    Upgrade relationship
    ====================
    This static HTML IS the baseline that <markdown-editor> enhances.

    Without JavaScript this is a plain, labelled, required <textarea> that
    submits as "body". When <markdown-editor> upgrades it ADOPTS this same
    textarea (id, name, required, maxlength, dir are all kept) and adds the
    live preview pane beside it. Form submission, validation and reset stay
    the textarea's own, so nothing changes for the form.
  -->

  <h1>Markdown Editor</h1>

  <form action="#" method="post">
    <p>
      <label for="body">Message (markdown)</label>
    </p>
    <markdown-editor>
      <textarea id="body" name="body" rows="10" required maxlength="5000">
# Release notes

- **Fixed** the login redirect
- Added `dark` theme support
</textarea>
    </markdown-editor>
    <p>
      <button type="submit">Post</button>
      <button type="reset">Reset</button>
    </p>
  </form>

</body>
</html>
