<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>watch-wc (static fallback)</title>
  <style>
    body { font-family: system-ui; max-inline-size: 32rem; margin-inline: auto; padding: 2rem; }
  </style>
</head>
<body>
  <h1>watch-wc</h1>
  <p>Watching needs JavaScript (state lives in the browser), so the fallback inside the component is something that works without it: here a link to the site feed. After upgrade the fallback is hidden and the component's own toggle button takes its place.</p>

  <p>
    <watch-wc variant="button">
      <a href="/feed.xml">Follow updates by feed</a>
    </watch-wc>
  </p>
</body>
</html>
