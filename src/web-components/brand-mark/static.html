<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Brand Mark (Static Fallback)</title>
  <style>
    .brand { font-weight: 700; font-size: 1.5rem; text-decoration: none; }
  </style>
</head>
<body>
  <a href="/" class="brand">Brand</a>
  <noscript>
    <p>Brand-mark renders a configurable logotype/wordmark. Without JS or VB, fall back to plain anchored text.</p>
  </noscript>
</body>
</html>
