<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Player (Static Fallback)</title>
  <style>
    /*
      Minimal baseline styling for the no-JS fallback.
      A production page would load the project stylesheet instead;
      these rules exist only so the file is self-contained.
    */
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: system-ui, sans-serif;
      line-height: 1.5;
      max-inline-size: 40rem;
      margin-inline: auto;
      padding: 2rem 1rem;
    }

    youtube-player {
      display: block;
      aspect-ratio: 16 / 9;
      background: #111;
    }

    youtube-player a {
      display: flex;
      align-items: center;
      justify-content: center;
      block-size: 100%;
      color: #fff;
    }
  </style>
</head>
<body>

  <!--
    Upgrade relationship
    ====================
    This static HTML IS the baseline that <youtube-player> enhances.

    Without JavaScript the authored link is the whole experience: it
    opens the video on YouTube. Nothing is requested from YouTube or
    Google until the reader follows it.

    When the <youtube-player> element is defined, the link is replaced by
    a facade: the poster image (or the i.ytimg.com thumbnail when there is
    no poster) and one <button> named "Play {title}". Pressing it inserts
    the youtube-nocookie.com iframe and moves focus into it.
  -->

  <h1>YouTube Player</h1>

  <noscript>
    <p>This component works best with JavaScript enabled.</p>
  </noscript>

  <figure>
    <youtube-player
      video-id="dQw4w9WgXcQ"
      title="Rick Astley — Never Gonna Give You Up"
      poster="/src/assets/placeholders/photo-kitchen-sink-13-640x360.svg">
      <a href="https://youtu.be/dQw4w9WgXcQ">Watch on YouTube: Rick Astley — Never Gonna Give You Up</a>
    </youtube-player>
    <figcaption>Never Gonna Give You Up — Rick Astley (1987)</figcaption>
  </figure>

</body>
</html>
