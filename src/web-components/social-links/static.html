<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Social Links (Static Fallback)</title>
  <style>
    body { font-family: system-ui, sans-serif; line-height: 1.5; max-inline-size: 36rem; margin-inline: auto; padding: 2rem 1rem; }
    ul { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 0.75rem; }
    a { color: inherit; }
    .social-icon { display: none; }
  </style>
</head>
<body>

  <!--
    Upgrade relationship
    ====================
    Cook writes this plain list at build time. Without the stylesheet it is
    an ordinary list of working links; the icon spans are hidden here.
    With Vanilla Breeze loaded, <social-links> adds CSS-drawn icons, the
    icon / label / icon-label variants and optional brand colours.
  -->

  <h1>Elsewhere</h1>

  <social-links>
    <ul>
      <li><a href="https://bsky.app/profile/example.bsky.social"><span class="social-icon" data-service="bluesky" aria-hidden="true"></span><span>Bluesky</span></a></li>
      <li><a href="https://github.com/example"><span class="social-icon" data-service="github" aria-hidden="true"></span><span>GitHub</span></a></li>
    </ul>
  </social-links>

</body>
</html>
