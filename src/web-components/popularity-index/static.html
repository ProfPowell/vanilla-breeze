<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>popularity-index</title>
  <link rel="stylesheet" href="/src/main.css">
</head>
<body>
  <main data-layout="center" data-layout-max="prose">
    <h1>popularity-index</h1>

    <section>
      <h2>Live endpoint</h2>
      <p>Reads <code>/api/analytics/popular</code>. Off the Cloudflare deployment it settles to <code>data-state="unavailable"</code>.</p>
      <popularity-index limit="5" window="7d" data-meta-src="/pages.json"></popularity-index>
    </section>

    <section>
      <h2>Sample payload, nested heading</h2>
      <popularity-index analytics-src="/docs/examples/demos/popularity-index.sample.json" data-heading-level="3"></popularity-index>
    </section>

    <section>
      <h2>No heading, localized labels</h2>
      <popularity-index lang="de" analytics-src="/docs/examples/demos/popularity-index.sample.json" data-heading-level="0" data-label-view="Aufruf" data-label-views="Aufrufe"></popularity-index>
    </section>

    <noscript>
      <p>The most-visited list needs JavaScript and the analytics endpoint.</p>
    </noscript>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
