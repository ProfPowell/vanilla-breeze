<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>interestfor with popover="hint"</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body {
      padding: var(--size-xl) var(--size-l);
      background: var(--color-surface);
      min-block-size: 16rem;
    }
  </style>
</head>
<body>
  <layout-stack data-layout-gap="l">
    <h1 class="visually-hidden">interestfor hints</h1>
    <p>Hover or focus a button. The hint opens after a short delay and closes when you move away or press <kbd>Escape</kbd>.</p>

    <layout-cluster data-layout-gap="m">
      <button type="button" interestfor="tip-save">Save</button>
      <span id="tip-save" popover="hint">Save your changes (Ctrl+S)</span>

      <button type="button" interestfor="tip-publish">Publish</button>
      <span id="tip-publish" popover="hint">Visible to everyone with the link</span>

      <button type="button" class="ghost" interestfor="tip-archive" aria-label="Archive">
        <icon-wc name="archive" aria-hidden="true"></icon-wc>
      </button>
      <span id="tip-archive" popover="hint">Moves the post out of your dashboard. You can restore it later.</span>
    </layout-cluster>
  </layout-stack>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
