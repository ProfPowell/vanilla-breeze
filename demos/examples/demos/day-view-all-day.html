<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Day View — All-Day Events</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body {
      padding: var(--size-m);
      background: var(--color-surface);
      max-inline-size: 50rem;
      margin-inline: auto;
    }
  </style>
</head>
<body>
  <h1>Day View — All-Day Events</h1>
  <p>Events without a <code>&lt;time datetime&gt;</code> go to the all-day strip above the hour grid.</p>

  <day-view data-date="2026-04-22" data-start-hour="auto">
    <calendar-event data-category="personal">
      <icon-wc name="globe" size="sm"></icon-wc>
      Earth Day
    </calendar-event>
    <calendar-event data-category="deadline">
      Quarterly report due
    </calendar-event>
    <calendar-event data-category="meeting">
      <time datetime="11:00">11:00</time>
      Volunteer briefing
    </calendar-event>
    <calendar-event data-category="focus">
      <time datetime="14:00">2:00</time>
      Park clean-up
    </calendar-event>
  </day-view>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
