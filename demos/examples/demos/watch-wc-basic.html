<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>watch-wc variants</title>
  <link rel="stylesheet" href="/src/main.css"/>
</head>
<body>
  <layout-center data-layout-max="narrow">
    <h1>watch-wc variants</h1>
    <p>Click any button to toggle the watch state for this page. All of them stay in sync.</p>

    <dl>
      <dt>Icon (default)</dt>
      <dd><watch-wc></watch-wc></dd>
      <dt>Compact</dt>
      <dd><watch-wc variant="compact"></watch-wc></dd>
      <dt>Button</dt>
      <dd><watch-wc variant="button"></watch-wc></dd>
      <dt>Constant label</dt>
      <dd><watch-wc variant="button" label="Save for later"></watch-wc></dd>
      <dt>Localised (<code>data-label-*</code>)</dt>
      <dd lang="fr"><watch-wc variant="compact" data-label-watch="Suivre les mises à jour" data-label-watching="Suivi"></watch-wc></dd>
    </dl>

    <layout-cluster data-layout-gap="s" data-layout-align="center">
      <notification-wc></notification-wc>
      <span>Open the bell &rarr; Watching tab to see the entry.</span>
    </layout-cluster>
  </layout-center>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
