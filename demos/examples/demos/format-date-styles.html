<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Date Styles Demo</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body {
      padding: var(--size-xl);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <layout-stack data-layout-gap="l">
    <h1>Date styles</h1>
    <section aria-labelledby="styles-heading">
      <h2 id="styles-heading">dateStyle</h2>
      <layout-stack data-layout-gap="s">
        <p>Default (medium): <time datetime="2026-02-09" data-format-date>Feb 9, 2026</time></p>
        <p>Short: <time datetime="2026-02-09" data-format-date="short">2/9/26</time></p>
        <p>Long: <time datetime="2026-02-09" data-format-date="long">February 9, 2026</time></p>
        <p>Full: <time datetime="2026-02-09" data-format-date="full">Monday, February 9, 2026</time></p>
      </layout-stack>
    </section>
    <section aria-labelledby="time-heading">
      <h2 id="time-heading">With time</h2>
      <p><time datetime="2026-02-09T14:30:00Z" data-format-date="long" data-format-time="short" data-time-zone="UTC">February 9, 2026 at 2:30 PM</time></p>
    </section>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
