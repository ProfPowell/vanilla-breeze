<!doctype html>
<html lang="en">
<!-- [html-validate-disable element-required-attributes: <img data-mock> gets a runtime src from the mock/wireframe scripts] -->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mock Presets Demo</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body {
      padding: var(--size-xl);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <layout-stack data-layout-gap="m">
    <h1>Mock presets</h1>
    <img data-mock="hero" alt="Hero banner" />
    <layout-grid data-layout-min="s" data-layout-gap="m">
      <img data-mock="card" alt="Featured article" />
      <img data-mock="product" alt="Product image" />
      <img data-mock="thumbnail" alt="Gallery thumb" />
      <img data-mock="logo" alt="Company logo" />
    </layout-grid>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
