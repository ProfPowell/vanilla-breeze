<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Swap Card Mode Demo</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body {
      padding: var(--size-l);
      background: var(--color-background);
    }
  </style>
</head>
<body>
  <h1>Card mode and composition</h1>
  <section>
    <layout-grid data-layout-min="m" data-layout-gap="l">
      <content-swap transition="flip" card>
        <section data-face="front">
          <p><strong>Product</strong></p>
          <p>Flip to see details.</p>
        </section>
        <section data-face="back">
          <p><strong>Details</strong></p>
          <p>Price, specs, and more.</p>
        </section>
      </content-swap>

      <content-swap transition="fade" card data-variant="outlined">
        <section data-face="front">
          <p><strong>Outlined</strong></p>
          <p>Card mode with outlined variant.</p>
        </section>
        <section data-face="back">
          <p><strong>Back</strong></p>
          <p>Still outlined.</p>
        </section>
      </content-swap>

      <content-swap transition="flip">
        <layout-card data-face="front">
          <header><h2>Front card</h2></header>
          <section><p>Full card structure with header, section, and footer.</p></section>
          <footer><button type="button" data-swap>See back</button></footer>
        </layout-card>
        <layout-card data-face="back">
          <header><h2>Back card</h2></header>
          <section><p>Each face is an independent layout-card.</p></section>
          <footer><button type="button" data-swap>See front</button></footer>
        </layout-card>
      </content-swap>
    </layout-grid>
  </section>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
