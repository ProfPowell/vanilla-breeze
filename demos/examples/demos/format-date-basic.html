<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Format Date Demo</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body {
      padding: var(--size-xl);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <layout-stack data-layout-gap="s">
    <p>Default: <time datetime="2026-02-09" data-format-date>Feb 9, 2026</time></p>
    <p>Full: <time datetime="2026-02-09" data-format-date="full">Monday, February 9, 2026</time></p>
    <p>Month only: <time datetime="2026-02" data-format-date="long">February 2026</time></p>
    <p>Year only: <time datetime="2026" data-format-date>2026</time></p>
    <p>With time: <time datetime="2026-02-09T14:30:00Z" data-format-date="long" data-format-time="short">February 9, 2026, 14:30 UTC</time></p>
    <p>Relative: <time datetime="2026-02-09T10:00:00Z" data-format-date="relative">February 9, 2026</time></p>
    <section lang="de">
      <p>Deutsch (nearest <code>lang</code>): <time datetime="2026-02-09" data-format-date="long">9. Februar 2026</time></p>
    </section>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
