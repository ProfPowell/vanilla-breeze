<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rel: noopener, opener and noreferrer</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body {
      padding: var(--size-l);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <layout-stack data-layout-gap="m">
    <p>Each link opens the same report page in a new tab. Compare <code>window.opener</code> and the referrer.</p>
    <ul>
      <li><a href="/docs/examples/demos/attr-target-report.html" target="_blank">No rel</a>: <code>noopener</code> is implied by <code>_blank</code></li>
      <li><a href="/docs/examples/demos/attr-target-report.html" target="_blank" rel="opener">rel="opener"</a>: opts back in to <code>window.opener</code></li>
      <li><a href="/docs/examples/demos/attr-target-report.html" target="_blank" rel="noreferrer">rel="noreferrer"</a>: no referrer, and implies <code>noopener</code></li>
    </ul>
  </layout-stack>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
