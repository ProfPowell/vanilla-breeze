<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Geo Map - Interactive Demo</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body { margin: 0; padding: var(--size-l); }
  </style>
</head>
<body>
  <main data-layout="stack" data-layout-gap="l">
    <geo-map lat="40.7484" lng="-73.9857" zoom="15">
      <address>Empire State Building, 20 W 34th St, New York</address>
    </geo-map>
    <geo-map lat="35.6762" lng="139.6503" zoom="13" static-only provider="carto-light">
      <address>Tokyo (static-only)</address>
    </geo-map>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
