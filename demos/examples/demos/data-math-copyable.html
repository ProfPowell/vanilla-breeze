<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Copyable Math Demo</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body {
      padding: var(--size-xl);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <h1>Copyable math</h1>
  <code data-math="copyable"
    data-mathml="<math display='block'><msubsup><mo>&int;</mo><mn>0</mn><mo>&infin;</mo></msubsup><msup><mi>e</mi><mrow><mo>-</mo><msup><mi>x</mi><mn>2</mn></msup></mrow></msup><mi>d</mi><mi>x</mi><mo>=</mo><mfrac><msqrt><mi>&pi;</mi></msqrt><mn>2</mn></mfrac></math>">
    \int_0^\infty e^{-x^2} dx = \frac{\sqrt{\pi}}{2}
  </code>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
