<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code Copy</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body {
      padding: var(--size-m);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <h1>Copy a QR Code</h1>
  <section data-layout="stack" data-layout-gap="s" data-layout-align="start">
    <qr-code id="qr-copy" value="https://vanilla-breeze.com" data-caption="visible">
      <a href="https://vanilla-breeze.com">vanilla-breeze.com</a>
    </qr-code>
    <button type="button" id="copy-btn">Copy QR code</button>
  </section>

  <script type="module">
    const qr = document.getElementById('qr-copy');
    const button = document.getElementById('copy-btn');
    button.addEventListener('click', () => qr.copy({ button }));
  </script>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
