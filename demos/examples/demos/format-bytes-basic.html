<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Format Bytes Demo</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body {
      padding: var(--size-xl);
      background: var(--color-surface);
      display: flex;
      justify-content: center;
      gap: var(--size-l);
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <data value="1048576" data-format-bytes>1 MB</data>
  <data value="1536000" data-format-bytes="1">1.5 MB</data>
  <data value="5368709120" data-format-bytes="2">5.00 GB</data>
  <data value="1536000" data-format-bytes="1" lang="fr">1,5 Mo</data>
  <data value="512" data-format-bytes>512 bytes</data>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
