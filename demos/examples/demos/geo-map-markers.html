<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Geo Map - Marker Demo</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body { margin: 0; padding: var(--size-l); }
    geo-map { --geo-map-height: 180px; }
    geo-map[data-brand] { --geo-map-marker-color: var(--color-primary); --geo-map-marker-size: 40px; }
  </style>
</head>
<body>
  <main data-layout="grid" data-layout-min="s" data-layout-gap="l">
    <figure>
      <geo-map lat="40.7484" lng="-73.9857" zoom="15" static-only label="Default marker"></geo-map>
      <figcaption>Default (theme error colour)</figcaption>
    </figure>
    <figure>
      <geo-map lat="40.7484" lng="-73.9857" zoom="15" static-only marker-color="#2563eb" label="Blue marker"></geo-map>
      <figcaption>marker-color="#2563eb"</figcaption>
    </figure>
    <figure>
      <geo-map lat="40.7484" lng="-73.9857" zoom="15" static-only data-brand label="Brand marker"></geo-map>
      <figcaption>--geo-map-marker-color</figcaption>
    </figure>
    <figure>
      <geo-map lat="40.7484" lng="-73.9857" zoom="15" static-only marker="false" label="No marker"></geo-map>
      <figcaption>marker="false"</figcaption>
    </figure>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
