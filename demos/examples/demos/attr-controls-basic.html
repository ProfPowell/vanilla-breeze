<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>controls attribute: native media controls</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-xl); background: var(--color-surface); }
    video, video-player { max-inline-size: 480px; }
  </style>
</head>
<body data-layout="stack" data-layout-gap="xl">
  <h1>controls</h1>

  <section data-layout="stack" data-layout-gap="s">
    <h2>Native controls</h2>
    <p>The browser draws these controls. Their look and keys depend on the browser.</p>
    <video controls preload="metadata" width="960" height="540" poster="assets/poster.jpg">
      <source src="assets/sample.mp4" type="video/mp4" />
      <p><a href="assets/sample.mp4" download>Download the video</a></p>
    </video>
    <audio controls preload="metadata">
      <source src="assets/track.mp3" type="audio/mpeg" />
      <p><a href="assets/track.mp3" download>Download the track</a></p>
    </audio>
  </section>

  <section data-layout="stack" data-layout-gap="s">
    <h2>Same markup inside &lt;video-player&gt;</h2>
    <p>The component removes <code>controls</code> when it upgrades and draws themed controls with a fixed keyboard map. Without JavaScript the native controls stay.</p>
    <video-player>
      <video controls preload="metadata" width="960" height="540" poster="assets/poster.jpg">
        <source src="assets/sample.mp4" type="video/mp4" />
        <p><a href="assets/sample.mp4" download>Download the video</a></p>
      </video>
    </video-player>
  </section>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
