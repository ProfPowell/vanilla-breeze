<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARIA States Demo</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body {
      padding: var(--size-m);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <main data-layout="stack" data-layout-gap="l">
    <nav class="horizontal pills" aria-label="Account sections">
      <ul>
        <li><a href="#profile" aria-current="page">Profile</a></li>
        <li><a href="#billing">Billing</a></li>
        <li><a href="#security">Security</a></li>
      </ul>
    </nav>

    <form method="dialog" data-layout="cluster" data-layout-gap="s">
      <button type="button" data-toggle="aria-pressed" aria-pressed="true">Mute alerts</button>
      <button type="button" class="secondary" data-toggle="aria-pressed" aria-pressed="false">Show archived</button>
      <button type="submit" data-loading="Saving…" data-loading-timeout="2000">Save changes</button>
      <button type="button" aria-disabled="true" aria-describedby="publish-why">Publish</button>
      <output id="publish-why" class="hint">Publishing unlocks once a reviewer approves.</output>
    </form>

    <form-field data-invalid>
      <label for="aria-email">Work email</label>
      <input type="email" id="aria-email" name="email" value="priya@" />
      <output class="error" for="aria-email">Enter a full address, like priya@example.com.</output>
    </form-field>

    <table data-sortable data-sortable-default="name">
      <caption>Team members</caption>
      <thead>
        <tr>
          <th scope="col" data-sort="name">Name</th>
          <th scope="col" data-sort="joined" data-sort-type="date">Joined</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>Priya Raman</td><td><time datetime="2024-03-11">11 Mar 2024</time></td></tr>
        <tr><td>Marcus Lee</td><td><time datetime="2025-08-02">2 Aug 2025</time></td></tr>
        <tr><td>Ana Souza</td><td><time datetime="2023-01-19">19 Jan 2023</time></td></tr>
      </tbody>
    </table>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
