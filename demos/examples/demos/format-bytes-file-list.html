<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>File List Demo</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body {
      padding: var(--size-xl);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <h1>Attachments</h1>
  <table>
    <thead>
      <tr><th scope="col">File</th><th scope="col">Size</th></tr>
    </thead>
    <tbody>
      <tr>
        <td>photo.jpg</td>
        <td><data value="3145728" data-format-bytes="1">3.0 MB</data></td>
      </tr>
      <tr>
        <td>document.pdf</td>
        <td><data value="524288" data-format-bytes="1">512.0 kB</data></td>
      </tr>
      <tr>
        <td>video.mp4</td>
        <td><data value="1073741824" data-format-bytes="1">1.0 GB</data></td>
      </tr>
    </tbody>
  </table>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
