<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Geo Map - Consent Demo</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body { margin: 0; padding: var(--size-l); }
  </style>
</head>
<body>
  <main>
    <geo-map lat="48.8584" lng="2.2945" zoom="16" loading="consent">
      <address>
        <a href="https://www.openstreetmap.org/?mlat=48.8584&amp;mlon=2.2945#map=16/48.8584/2.2945">Eiffel Tower, Champ de Mars, 75007 Paris</a>
      </address>
    </geo-map>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
