<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>poster attribute: placeholder frame before playback</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-xl); background: var(--color-surface); }
    video { max-inline-size: 420px; }
  </style>
</head>
<body data-layout="stack" data-layout-gap="xl">
  <h1>poster</h1>

  <section data-layout="stack" data-layout-gap="s">
    <h2>poster + preload="none"</h2>
    <p>Only the poster image downloads. No video data loads until you press play.</p>
    <video controls preload="none" width="960" height="540" poster="assets/poster.jpg">
      <source src="assets/sample.mp4" type="video/mp4" />
      <p><a href="assets/sample.mp4" download>Download the video</a></p>
    </video>
  </section>

  <section data-layout="stack" data-layout-gap="s">
    <h2>No poster, preload="none"</h2>
    <p>Nothing to show yet: the box stays empty until playback starts.</p>
    <video controls preload="none" width="960" height="540">
      <source src="assets/sample.mp4" type="video/mp4" />
      <p><a href="assets/sample.mp4" download>Download the video</a></p>
    </video>
  </section>

  <section data-layout="stack" data-layout-gap="s">
    <h2>Prototype poster with data-mock</h2>
    <p><code>data-mock</code> writes a placeholder <code>poster</code> labelled from <code>title</code>.</p>
    <video data-mock width="960" height="540" title="Product tour"></video>
  </section>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
