<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Nav Bar - Basic Demo</title>
  <link rel="stylesheet" href="/src/main.css"/>
</head>
<body>
  <main data-layout="stack" data-layout-gap="l">
    <h1>Nav Bar - Basic Demo</h1>

    <section data-layout="stack" data-layout-gap="s" aria-labelledby="h-html-first">
      <h2 id="h-html-first">HTML-first</h2>
      <nav-bar id="nav-html-first" aria-label="Main">
        <a href="/">Home</a>
        <a href="/docs/">Docs</a>
        <a href="/docs/elements/">Elements</a>
        <a href="/changelog/">Changelog</a>
      </nav-bar>
    </section>

    <section data-layout="stack" data-layout-gap="s" aria-labelledby="h-js-first">
      <h2 id="h-js-first">JS-first (driven by .items)</h2>
      <nav-bar id="nav-js-first" aria-label="Demo"></nav-bar>
    </section>

    <section data-layout="stack" data-layout-gap="s" aria-labelledby="h-exact">
      <h2 id="h-exact">Exact match only</h2>
      <nav-bar id="nav-exact" aria-label="Exact" data-match="exact">
        <a href="/">Home</a>
        <a href="/docs/">Docs</a>
        <a href="/docs/elements/">Elements</a>
      </nav-bar>
    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
  <script type="module">
    // main.js (above) runs first per module source order, so by here
    // <nav-bar> is registered and #nav-js-first is upgraded. Set items
    // directly; if upgrade hasn't happened yet (e.g. test races),
    // fall back to the upgraded event.
    const nav = document.getElementById('nav-js-first');
    const items = [
      { href: '/',           label: 'Home' },
      { href: '/dashboard/', label: 'Dashboard', icon: 'gauge' },
      { href: '/settings/',  label: 'Settings', badge: '3' },
    ];
    if (nav.hasAttribute('data-upgraded')) {
      nav.items = items;
    } else {
      nav.addEventListener('nav-bar:upgraded', () => { nav.items = items; }, { once: true });
    }
  </script>
</body>
</html>
