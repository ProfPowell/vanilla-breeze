<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code Demo</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body {
      padding: var(--size-m);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <h1>QR Code</h1>
  <section data-layout="cluster" data-layout-gap="xl" data-layout-align="start">
    <qr-code value="https://vanilla-breeze.com" data-caption="visible">
      <a href="https://vanilla-breeze.com">vanilla-breeze.com</a>
    </qr-code>
    <qr-code data-caption="visible">Hello, World!</qr-code>
  </section>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
