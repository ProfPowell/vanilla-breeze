<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading Button</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-xl); background: var(--color-surface); }
  </style>
</head>
<body>
  <main data-layout="stack" data-layout-gap="l">
    <p>Press a button to see its loading state. These forms use <code>method="dialog"</code> so nothing is sent; each button reverts after two seconds via <code>data-loading-timeout</code>.</p>

    <form method="dialog" data-layout="cluster" data-layout-gap="s">
      <button type="submit" data-loading="Saving..." data-loading-timeout="2000">Save Changes</button>
      <button type="submit" data-loading data-loading-timeout="2000" class="secondary">Spinner only</button>
    </form>

    <form method="dialog" data-layout="cluster" data-layout-gap="s">
      <button type="submit" data-loading data-loading-timeout="2000">Primary</button>
      <button type="submit" data-loading data-loading-timeout="2000" class="secondary">Secondary</button>
      <button type="submit" data-loading data-loading-timeout="2000" class="ghost">Ghost</button>
    </form>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
