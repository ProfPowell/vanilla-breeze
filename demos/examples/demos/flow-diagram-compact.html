<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flow Diagram — Compact</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <flow-diagram data-title="Checkout (compact)" compact>
    <ol>
      <li data-type="start">Open cart</li>
      <li data-type="action">Review items</li>
      <li data-type="decision">Signed in?
        <ol>
          <li data-branch="Yes">
            <ol>
              <li data-type="action">Use saved address</li>
              <li data-type="end">Pay</li>
            </ol>
          </li>
          <li data-branch="No">
            <ol>
              <li data-type="action">Enter address</li>
              <li data-type="end">Pay as guest</li>
            </ol>
          </li>
        </ol>
      </li>
    </ol>
  </flow-diagram>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
