<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>autocapitalize Demo</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body {
      padding: var(--size-m);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <form class="stacked" method="dialog" autocapitalize="sentences">
    <p><small>Open this page on a phone or tablet to see the keyboard's Shift state change between fields. Physical keyboards are not affected.</small></p>

    <form-field>
      <label for="cap-name">Full name</label>
      <input type="text" id="cap-name" name="name" autocapitalize="words" autocomplete="name" />
      <output class="hint" for="cap-name">autocapitalize="words"</output>
    </form-field>

    <form-field>
      <label for="cap-handle">Username</label>
      <input type="text" id="cap-handle" name="username" autocapitalize="none" autocomplete="username" spellcheck="false" />
      <output class="hint" for="cap-handle">autocapitalize="none"</output>
    </form-field>

    <form-field>
      <label for="cap-booking">Booking reference</label>
      <input type="text" id="cap-booking" name="booking" autocapitalize="characters" maxlength="6" pattern="[A-Za-z0-9]{6}" placeholder="XK49BT" />
      <output class="hint" for="cap-booking">autocapitalize="characters" (still accepts lowercase)</output>
    </form-field>

    <form-field>
      <label for="cap-notes">Notes for the driver</label>
      <textarea id="cap-notes" name="notes" rows="3"></textarea>
      <output class="hint" for="cap-notes">No attribute: inherits "sentences" from the form</output>
    </form-field>

    <footer class="actions">
      <button type="submit">Save details</button>
    </footer>
  </form>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
