<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Select All Scoping</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-xl); background: var(--color-surface); }
  </style>
</head>
<body>
  <main data-layout="grid" data-layout-gap="l" data-layout-min="s">
    <fieldset data-layout="stack" data-layout-gap="xs">
      <legend>Fruit</legend>
      <label><input type="checkbox" data-select-all=".pick" /> All fruit</label>
      <label><input type="checkbox" class="pick" /> Apple</label>
      <label><input type="checkbox" class="pick" /> Pear</label>
      <label><input type="checkbox" class="pick" /> Plum</label>
      <p>Selected: <output data-selected-count>0</output></p>
    </fieldset>
    <fieldset data-layout="stack" data-layout-gap="xs">
      <legend>Vegetables</legend>
      <label><input type="checkbox" data-select-all=".pick" /> All vegetables</label>
      <label><input type="checkbox" class="pick" /> Carrot</label>
      <label><input type="checkbox" class="pick" /> Leek</label>
      <p>Selected: <output data-selected-count>0</output></p>
    </fieldset>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
