<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spoiler effects</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <h1>Spoiler effects</h1>
  <layout-grid data-layout-min="xs" data-layout-gap="m">
    <layout-card>
      <h2>Blur</h2>
      <p data-spoiler="blur">Visible but unreadable behind a blur.</p>
    </layout-card>
    <layout-card>
      <h2>Solid</h2>
      <p data-spoiler="solid">Fully hidden behind a solid bar.</p>
    </layout-card>
    <layout-card>
      <h2>Noise</h2>
      <p data-spoiler="noise">Faintly visible through a noise pattern.</p>
    </layout-card>
  </layout-grid>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
