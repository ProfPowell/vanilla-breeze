<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Print Page — Variants Demo</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <section data-layout="stack" data-layout-gap="l">
    <p>Each control opens the browser print dialog. None of them appear on the printed page.</p>
    <ul data-layout="cluster" data-layout-gap="m" class="unstyled">
      <li><print-page>Print this page</print-page></li>
      <li><print-page variant="icon-label">Print this page</print-page></li>
      <li><print-page variant="label">Print</print-page></li>
      <li><print-page raw-toggle variant="icon-label">Print with options</print-page></li>
    </ul>
  </section>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
