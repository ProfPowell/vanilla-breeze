<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Byte Locale Demo</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body {
      padding: var(--size-xl);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <layout-stack data-layout-gap="s">
    <h1>Locale override</h1>
    <p>German: <data value="1536000" data-format-bytes="1" data-locale="de-DE">1,5 MB</data></p>
    <p>French: <data value="1536000" data-format-bytes="1" data-locale="fr">1,5 Mo</data></p>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
