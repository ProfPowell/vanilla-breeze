<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ajustes traducidos</title>
  <link rel="stylesheet" href="/src/main.css" />
</head>
<body>
  <main>
    <h1>Ajustes traducidos</h1>
    <p>Cada texto del panel se puede sustituir con un atributo <code>data-label-*</code>. Abre el engranaje del pie de página.</p>
  </main>

  <footer data-layout="cluster" data-layout-justify="between">
    <span>Pie de página</span>
    <settings-panel
      data-label-trigger="Ajustes del sitio"
      data-label-dialog="Ajustes del sitio"
      data-label-title="Ajustes"
      data-label-close="Cerrar ajustes"
      data-label-appearance="Apariencia"
      data-label-color-mode="Modo de color"
      data-label-mode-auto="Auto"
      data-label-mode-light="Claro"
      data-label-mode-dark="Oscuro"
      data-label-theme="Tema"
      data-label-accessibility="Accesibilidad"
      data-label-high-contrast="Alto contraste"
      data-label-large-text="Texto grande"
      data-label-dyslexia="Apto para dislexia"
      data-label-layout="Diseño"
      data-label-effects="Efectos"
      data-label-environment="Entorno"
      data-label-system="Sistema"
      data-label-reset="Restablecer valores"
      data-label-reset-confirm="¿Restablecer todos los ajustes?"
      data-label-reset-yes="Restablecer"
      data-label-reset-cancel="Cancelar"
      data-label-reset-done="Ajustes restablecidos"></settings-panel>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
