<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Revenue Table Demo</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body {
      padding: var(--size-xl);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <h1>Revenue by product</h1>
  <table>
    <thead>
      <tr><th scope="col">Product</th><th scope="col">Revenue</th></tr>
    </thead>
    <tbody>
      <tr>
        <td>Widget A</td>
        <td><data value="142500" data-format-number="currency" data-currency="USD">$142,500.00</data></td>
      </tr>
      <tr>
        <td>Widget B</td>
        <td><data value="89300" data-format-number="currency" data-currency="USD">$89,300.00</data></td>
      </tr>
    </tbody>
  </table>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
