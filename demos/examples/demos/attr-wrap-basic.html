<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>wrap attribute: soft and hard wrapping in the submitted value</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-xl); background: var(--color-surface); }
  </style>
</head>
<body>
  <layout-center data-layout-max="narrow">
    <form class="stacked" id="wr-form">
      <form-field>
        <label for="wr-soft">wrap="soft" (default)</label>
        <textarea id="wr-soft" name="soft" rows="3">The parcel arrived two days early, well packed, and the colour matches the photos exactly.</textarea>
      </form-field>

      <form-field>
        <label for="wr-hard">wrap="hard"</label>
        <textarea id="wr-hard" name="hard" rows="3" cols="40" wrap="hard">The parcel arrived two days early, well packed, and the colour matches the photos exactly.</textarea>
        <output class="hint" for="wr-hard">Line breaks are added where the text wraps on screen. Resize the window and submit again.</output>
      </form-field>

      <button type="submit">Show submitted values</button>
      <pre><output id="wr-result">Submitted data appears here. \n marks a line break.</output></pre>
    </form>
  </layout-center>

  <script type="module">
    const form = document.querySelector('#wr-form');
    const result = document.querySelector('#wr-result');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      result.textContent = [...new FormData(form)]
        .map(([name, value]) => `${name} = ${JSON.stringify(value)}`)
        .join('\n\n');
    });
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
