<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotkey Display Patterns</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-xl); background: var(--color-surface); }
  </style>
</head>
<body>
  <main data-layout="stack" data-layout-gap="l">
    <h1 class="visually-hidden">Hotkey display patterns</h1>
    <section data-layout="stack" data-layout-gap="s">
      <h2>Inline</h2>
      <p>Press <kbd data-hotkey="meta+k">Ctrl+K</kbd> to open the search palette.</p>
      <p>Use <kbd data-hotkey="meta+shift+p">Ctrl+Shift+P</kbd> for the command palette.</p>
    </section>
    <section data-layout="stack" data-layout-gap="s">
      <h2>Reference table (display only)</h2>
      <table>
        <thead>
          <tr><th scope="col">Action</th><th scope="col">Shortcut</th></tr>
        </thead>
        <tbody>
          <tr><td>Search</td><td><kbd data-hotkey="meta+k">Ctrl+K</kbd></td></tr>
          <tr><td>Save</td><td><kbd data-hotkey="meta+s">Ctrl+S</kbd></td></tr>
          <tr><td>Undo</td><td><kbd data-hotkey="meta+z">Ctrl+Z</kbd></td></tr>
          <tr><td>Redo</td><td><kbd data-hotkey="meta+shift+z">Ctrl+Shift+Z</kbd></td></tr>
        </tbody>
      </table>
    </section>
    <section data-layout="stack" data-layout-gap="s">
      <h2>In a tooltip</h2>
      <layout-cluster data-layout-gap="l">
        <tool-tip>
          <button type="button">
            <icon-wc name="search" size="sm"></icon-wc>
            Search
          </button>
          <template data-tooltip>
            Search <kbd data-hotkey="meta+k">Ctrl+K</kbd>
          </template>
        </tool-tip>
        <tool-tip>
          <button type="button" class="secondary">
            <icon-wc name="save" size="sm"></icon-wc>
            Save
          </button>
          <template data-tooltip>
            Save <kbd data-hotkey="meta+s">Ctrl+S</kbd>
          </template>
        </tool-tip>
      </layout-cluster>
    </section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
