<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Date Picker Demo</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body {
      padding: var(--size-l);
      background: var(--color-surface);
    }

    layout-card > h2 {
      margin: 0 0 var(--size-m);
    }

    #form-output {
      display: block;
      margin-block-start: var(--size-m);
      padding: var(--size-m);
      background: var(--color-surface-alt);
      border-radius: var(--radius-m);
      font-family: var(--font-mono);
      font-size: var(--font-size-s);
      white-space: pre-wrap;
      min-block-size: 2em;
    }
  </style>
</head>
<body>
  <h1>Date Picker Demo</h1>
  <layout-center data-layout-max="narrow">
    <layout-card>
      <h2>Book an appointment</h2>
      <form id="demo-form">
        <layout-stack data-layout-gap="l">
          <form-field>
            <label for="event">Event date</label>
            <date-picker>
              <input type="date" id="event" name="event" value="2026-04-15"/>
            </date-picker>
          </form-field>

          <form-field>
            <label for="appointment">Appointment (April, weekdays only)</label>
            <date-picker data-disabled-dates="2026-04-04,2026-04-05,2026-04-11,2026-04-12,2026-04-18,2026-04-19,2026-04-25,2026-04-26"
                         data-highlight-dates="2026-04-15:deadline" required>
              <input type="date" id="appointment" name="appointment" min="2026-04-01" max="2026-04-30"/>
            </date-picker>
            <output class="error" for="appointment" aria-live="polite"></output>
          </form-field>

          <layout-cluster data-layout-gap="s">
            <button type="submit">Submit</button>
            <button type="reset" data-variant="outline">Reset</button>
          </layout-cluster>
        </layout-stack>
      </form>

      <output id="form-output">Submit the form to see data here</output>
    </layout-card>
  </layout-center>

  <script type="module" src="/src/main.js"></script>
  <script type="module">
    document.getElementById('demo-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const data = new FormData(e.target);
      const entries = [...data.entries()].map(([k, v]) => `${k}: ${v}`).join('\n');
      document.getElementById('form-output').textContent = entries || '(no data)';
    });
  </script>
</body>
</html>
