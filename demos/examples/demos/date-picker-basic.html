<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Date Picker Demo</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    .demo-heading { margin: 0 0 var(--size-m); }
    .form-output {
      display: block;
      margin-block-start: var(--size-m);
      padding: var(--size-m);
      background: var(--color-surface-alt);
      border-radius: var(--radius-m);
      font-family: var(--font-mono);
      font-size: var(--font-size-s);
      white-space: pre-wrap;
      min-height: 2em;
    }
  </style>
</head>
<body>
  <layout-center data-layout-max="narrow">
    <layout-stack data-layout-gap="2xl">

      <layout-card>
        <h1 class="demo-heading">Date Picker</h1>
        <form id="demo-form">
          <layout-stack data-layout-gap="l">
            <form-field>
              <label for="event">Event date</label>
              <date-picker name="event">
                <input type="date" id="event" value="2026-04-15"/>
              </date-picker>
            </form-field>

            <form-field>
              <label for="hotel">Hotel night (booked and unavailable dates)</label>
              <date-picker name="hotel"
                data-disabled-dates="2026-04-07:booked,2026-04-08:booked,2026-04-14:unavailable,2026-04-21:holiday">
                <input type="date" id="hotel" min="2026-04-01" max="2026-04-30"/>
              </date-picker>
            </form-field>

            <form-field>
              <label for="schedule">Schedule (highlighted key dates)</label>
              <date-picker name="schedule"
                data-highlight-dates="2026-04-10:event,2026-04-15:deadline,2026-04-21:holiday">
                <input type="date" id="schedule" min="2026-04-01" max="2026-04-30"/>
              </date-picker>
            </form-field>

            <form-field>
              <label for="dob">Date of birth (required)</label>
              <date-picker name="dob" required>
                <input type="date" id="dob" min="1920-01-01" max="2025-12-31"/>
              </date-picker>
              <output class="error" for="dob" aria-live="polite"></output>
            </form-field>

            <layout-cluster data-layout-gap="s">
              <button type="submit">Submit</button>
              <button type="reset" data-variant="outline">Reset</button>
            </layout-cluster>
          </layout-stack>
        </form>
        <output id="form-output" class="form-output">Submit the form to see data here</output>
      </layout-card>

    </layout-stack>
  </layout-center>

  <script type="module" src="/src/main.js"></script>
  <script type="module">
    document.getElementById('demo-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const data = new FormData(e.target);
      const entries = [...data.entries()].map(([k, v]) => `${k}: ${v}`).join('\n');
      document.getElementById('form-output').textContent = entries || '(no data)';
    });
  </script>
</body>
</html>
