<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>accept attribute: file type hints for the picker and drop zone</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-xl); background: var(--color-surface); }
  </style>
</head>
<body>
  <layout-center data-layout-max="narrow">
    <form class="stacked">
      <form-field>
        <label for="acc-cv">CV</label>
        <input id="acc-cv" type="file" name="cv" accept=".pdf,.docx,application/pdf" />
        <output class="hint" for="acc-cv">PDF or Word. The picker filters by default; the user can still switch to all files.</output>
      </form-field>

      <form-field>
        <label for="acc-photos">Project photos</label>
        <input id="acc-photos" type="file" name="photos" accept="image/*" multiple data-upload />
        <output class="hint" for="acc-photos">Drop images here. Files that do not match accept are named and left out.</output>
      </form-field>

      <form-field>
        <label for="acc-receipt">Receipt photo</label>
        <input id="acc-receipt" type="file" name="receipt" accept="image/*" capture="environment" />
        <output class="hint" for="acc-receipt">On a phone, capture opens the rear camera. Desktop browsers ignore it.</output>
      </form-field>

      <button type="submit">Upload</button>
    </form>
  </layout-center>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
