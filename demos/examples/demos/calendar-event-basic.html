<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calendar Event — Categories and Spans</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body {
      padding: var(--size-m);
      background: var(--color-surface);
      max-inline-size: 40rem;
      margin-inline: auto;
    }
  </style>
</head>
<body>
  <h1>Calendar Event — Categories and Spans</h1>

  <h2>Friday, April 10, 2026</h2>

  <day-view data-date="2026-04-10" data-start-hour="auto">
    <calendar-event data-category="personal">
      <icon-wc name="globe" size="sm"></icon-wc>
      Earth Day (no time: moved to the all-day list)
    </calendar-event>
    <calendar-event data-category="meeting">
      <time datetime="09:00">9:00</time>
      <icon-wc name="users" size="sm"></icon-wc>
      Sprint standup
    </calendar-event>
    <calendar-event data-category="meeting" data-duration="2h">
      <time datetime="10:00">10:00</time>
      <time datetime="PT2H">2 hours</time>
      <icon-wc name="palette" size="sm"></icon-wc>
      <a href="#design-review">Design review — Q3 mockups</a>
    </calendar-event>
    <calendar-event data-category="focus" data-duration="1h30m">
      <time datetime="13:30">1:30</time>
      <icon-wc name="code" size="sm"></icon-wc>
      Focus block with a long title that ellipsizes when the column is narrow
    </calendar-event>
    <calendar-event data-category="deadline">
      <time datetime="16:00">4:00</time>
      <icon-wc name="alert-triangle" size="sm"></icon-wc>
      Submit quarterly report
    </calendar-event>
  </day-view>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
