<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Copy Button Patterns</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-xl); background: var(--color-surface); }
  </style>
</head>
<body>
  <main data-layout="stack" data-layout-gap="l">
    <h1 class="visually-hidden">Copy button patterns</h1>
    <section data-layout="stack" data-layout-gap="s">
      <h2>With an icon</h2>
      <p data-layout="cluster" data-layout-gap="s">
        <button type="button" data-copy="https://vanilla-breeze.com">
          <icon-wc name="copy" size="sm"></icon-wc>
          Copy link
        </button>
        <button type="button" data-copy="https://vanilla-breeze.com/docs" class="secondary">
          <icon-wc name="link" size="sm"></icon-wc>
          Share link
        </button>
      </p>
    </section>
    <section data-layout="stack" data-layout-gap="s">
      <h2>Snippet with a copy button</h2>
      <figure data-layout="cluster" data-layout-gap="s" data-layout-align="center">
        <pre><code id="snippet-demo">npm install vanilla-breeze</code></pre>
        <button type="button" data-copy-target="#snippet-demo" class="ghost small" aria-label="Copy install command">
          <icon-wc name="copy" size="sm"></icon-wc>
        </button>
      </figure>
    </section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
