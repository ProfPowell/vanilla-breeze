<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Swap Triggers Demo</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body {
      padding: var(--size-l);
      background: var(--color-background);
    }

    .face {
      padding: var(--size-l);
      border: var(--border-width-thin) solid var(--color-border);
      border-radius: var(--radius-m);
      background: var(--color-surface);
    }

    [data-face="back"].face {
      background: var(--color-surface-raised);
    }
  </style>
</head>
<body>
  <layout-grid data-layout-min="l" data-layout-gap="l">
    <content-swap transition="fade">
      <section data-face="front" class="face">
        <p><strong>Question:</strong> What does <code>inert</code> do?</p>
        <button type="button" data-swap>Show answer</button>
      </section>
      <section data-face="back" class="face">
        <p><strong>Answer:</strong> It makes an element and its descendants non-interactive and hidden from assistive technology.</p>
        <button type="button" data-swap>Back to question</button>
      </section>
    </content-swap>

    <article data-swap data-transition="fade">
      <section data-face="front" class="face">
        <p><strong>Native article</strong></p>
        <p>A regular <code>&lt;article&gt;</code> with <code>data-swap</code>. Click it, or Tab to its toggle.</p>
      </section>
      <section data-face="back" class="face">
        <p><strong>Still an article</strong></p>
        <p>Same swap behavior, no custom element wrapper needed.</p>
      </section>
    </article>
  </layout-grid>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
