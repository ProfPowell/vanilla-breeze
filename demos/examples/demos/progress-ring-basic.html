<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Progress Ring Demo</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body {
      padding: var(--size-m);
      background: var(--color-surface);
    }
    .demo-row {
      display: flex;
      align-items: center;
      gap: var(--size-xl);
      margin-block-end: var(--size-l);
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <h1>Progress Ring Demo</h1>
  <h2>Basic Progress</h2>
  <section class="demo-row">
    <progress data-type="ring" aria-label="Task A" value="25" max="100">25%</progress>
    <progress data-type="ring" aria-label="Task B" value="50" max="100">50%</progress>
    <progress data-type="ring" aria-label="Task C" value="75" max="100">75%</progress>
    <progress data-type="ring" aria-label="Task D" value="100" max="100">100%</progress>
  </section>

  <h2>Sizes</h2>
  <section class="demo-row">
    <progress data-type="ring" data-size="xs" data-label="none" aria-label="Extra small ring" value="60" max="100">60%</progress>
    <progress data-type="ring" data-size="s" data-label="none" aria-label="Small ring" value="60" max="100">60%</progress>
    <progress data-type="ring" data-size="m" aria-label="Medium ring" value="60" max="100">60%</progress>
    <progress data-type="ring" data-size="l" aria-label="Large ring" value="60" max="100">60%</progress>
    <progress data-type="ring" data-size="xl" aria-label="Extra large ring" value="60" max="100">60%</progress>
  </section>

  <h2>Color Variants</h2>
  <section class="demo-row">
    <progress data-type="ring" data-size="l" aria-label="Default colour" value="80" max="100">80%</progress>
    <progress data-type="ring" data-size="l" class="success" aria-label="Upload complete" value="100" max="100">Done</progress>
    <progress data-type="ring" data-size="l" class="warning" aria-label="Disk quota used" value="45" max="100">45%</progress>
    <progress data-type="ring" data-size="l" class="error" aria-label="Battery remaining" value="15" max="100">15%</progress>
  </section>

  <h2>Indeterminate</h2>
  <section class="demo-row">
    <progress data-type="ring" data-size="l" aria-label="Loading">Loading...</progress>
  </section>

  <h2>Interactive Demo</h2>
  <section class="demo-row">
    <progress data-type="ring" data-size="xl" id="interactive-ring" aria-label="Interactive progress" value="0" max="100">0%</progress>
    <form>
      <label for="ring-slider">Progress:</label>
      <input type="range" id="ring-slider" min="0" max="100" value="0"/>
    <button type="submit" hidden>Submit</button>
</form>
  </section>

  <script type="module" src="/src/main.js"></script>
  <script>
    const slider = document.getElementById('ring-slider');
    const ring = document.getElementById('interactive-ring');
    slider.style.setProperty('--_pct', '0%');
    slider.addEventListener('input', () => {
      ring.value = Number(slider.value);
      slider.style.setProperty('--_pct', slider.value + '%');
    });
  </script>
</body>
</html>
