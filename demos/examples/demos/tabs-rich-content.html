<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tabs Rich Content Demo</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body {
      padding: var(--size-m);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <tab-set aria-label="Content types">
    <details name="content-types" open>
      <summary>Text Content</summary>
      <section>
        <layout-text>
          <p>Tabs can contain rich text content with proper typography.</p>
          <blockquote>Including blockquotes, lists, and other typographic elements.</blockquote>
        </layout-text>
      </section>
    </details>
    <details name="content-types">
      <summary>Form Content</summary>
      <section>
        <form data-layout="stack" data-layout-gap="m">
          <form-field>
            <label for="tab-name">Name</label>
            <input type="text" id="tab-name" name="name" autocomplete="name" />
          </form-field>
          <form-field>
            <label for="tab-email">Email</label>
            <input type="email" id="tab-email" name="email" autocomplete="email" />
          </form-field>
          <footer>
            <button type="submit">Submit</button>
          </footer>
        </form>
      </section>
    </details>
    <details name="content-types">
      <summary>Card Grid</summary>
      <section>
        <layout-grid data-layout-min="s" data-layout-gap="m">
          <layout-card data-variant="outlined" data-padding="s">
            <strong>Card 1</strong>
          </layout-card>
          <layout-card data-variant="outlined" data-padding="s">
            <strong>Card 2</strong>
          </layout-card>
          <layout-card data-variant="outlined" data-padding="s">
            <strong>Card 3</strong>
          </layout-card>
        </layout-grid>
      </section>
    </details>
  </tab-set>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
