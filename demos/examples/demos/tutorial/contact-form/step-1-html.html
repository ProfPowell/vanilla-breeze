<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Contact form — Tutorial step 1 (semantic HTML)</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>body { padding: var(--size-l); }</style>
  <!--
    Step 1: a native form and the stylesheet, nothing else. Deliberately NO
    script: required, type="email", minlength and the browser's own error
    bubbles do the validation. The form has no action or method on purpose,
    so submitting the demo only reloads this frame with the values in the
    query string; nothing is posted anywhere.
  -->
</head>
<body>
<main>
  <form aria-labelledby="contact-title">
    <header>
      <h1 id="contact-title">Get in touch</h1>
      <p>Questions about an order, a return or anything else.</p>
    </header>

    <p>
      <label for="contact-name">Full name</label>
      <input id="contact-name" name="name" type="text" autocomplete="name" required/>
    </p>

    <p>
      <label for="contact-email">Email</label>
      <input id="contact-email" name="email" type="email" autocomplete="email" required/>
    </p>

    <p>
      <label for="contact-topic">Topic</label>
      <select id="contact-topic" name="topic" required>
        <option value="">Choose a topic…</option>
        <option value="order">An order</option>
        <option value="return">A return</option>
        <option value="other">Something else</option>
      </select>
    </p>

    <p>
      <label for="contact-message">Message</label>
      <textarea id="contact-message" name="message" rows="5" minlength="20" required></textarea>
    </p>

    <p>
      <label>
        <input type="checkbox" name="consent" required/>
        I agree to my details being stored so you can reply
      </label>
    </p>

    <footer>
      <button type="submit">Send message</button>
      <p><small>We reply within one business day.</small></p>
    </footer>
  </form>
</main>
</body>
</html>
