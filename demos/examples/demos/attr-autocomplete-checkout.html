<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>autocomplete attribute: contact and shipping fields</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-xl); background: var(--color-surface); }
  </style>
</head>
<body>
  <layout-center data-layout-max="narrow">
    <form class="stacked">
      <p>Focus a field: a browser with saved addresses offers to fill the whole group in one step.</p>

      <fieldset data-layout="stack" data-layout-gap="s">
        <legend>Contact</legend>
        <form-field>
          <label for="ac-name">Full name</label>
          <input type="text" id="ac-name" name="name" autocomplete="shipping name" />
        </form-field>
        <form-field>
          <label for="ac-email">Email</label>
          <input id="ac-email" type="email" name="email" autocomplete="email" />
        </form-field>
        <form-field>
          <label for="ac-tel">Phone</label>
          <input id="ac-tel" type="tel" name="tel" autocomplete="shipping tel" />
        </form-field>
      </fieldset>

      <fieldset data-layout="stack" data-layout-gap="s">
        <legend>Shipping address</legend>
        <form-field>
          <label for="ac-street">Street address</label>
          <textarea id="ac-street" name="street" rows="2" autocomplete="shipping street-address"></textarea>
        </form-field>
        <form-field>
          <label for="ac-city">City</label>
          <input type="text" id="ac-city" name="city" autocomplete="shipping address-level2" />
        </form-field>
        <form-field>
          <label for="ac-zip">Postal code</label>
          <input type="text" id="ac-zip" name="postal" autocomplete="shipping postal-code" />
        </form-field>
        <form-field>
          <label for="ac-country">Country</label>
          <select id="ac-country" name="country" autocomplete="shipping country">
            <option value="">Choose a country</option>
            <option value="CA">Canada</option>
            <option value="DE">Germany</option>
            <option value="GB">United Kingdom</option>
            <option value="US">United States</option>
          </select>
        </form-field>
      </fieldset>

      <button type="submit">Continue to payment</button>
    </form>
  </layout-center>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
