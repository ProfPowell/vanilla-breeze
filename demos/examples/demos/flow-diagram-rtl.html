<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مخطط التدفق — من اليمين إلى اليسار</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <flow-diagram data-title="الدفع" data-direction="horizontal"
    data-label="مخطط التدفق"
    data-label-selected="تم التحديد: {text}"
    data-label-steps-zero="{count} خطوة" data-label-steps-one="خطوة واحدة"
    data-label-steps-two="خطوتان" data-label-steps-few="{count} خطوات"
    data-label-steps-many="{count} خطوة" data-label-steps-other="{count} خطوة"
    data-label-type-start="بداية" data-label-type-action="إجراء"
    data-label-type-decision="قرار" data-label-type-end="نهاية">
    <ol>
      <li data-type="start">فتح السلة</li>
      <li data-type="action">مراجعة المنتجات</li>
      <li data-type="decision">هل سجلت الدخول؟
        <ol>
          <li data-branch="نعم">
            <ol>
              <li data-type="end">الدفع</li>
            </ol>
          </li>
          <li data-branch="لا">
            <ol>
              <li data-type="action">إدخال العنوان</li>
              <li data-type="end">الدفع كضيف</li>
            </ol>
          </li>
        </ol>
      </li>
    </ol>
  </flow-diagram>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
