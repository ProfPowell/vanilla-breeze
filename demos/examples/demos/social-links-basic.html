<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social Links Demo</title>
  <meta name="description" content="A demo page for the social-links profile links element" />
  <link rel="stylesheet" href="/src/main.css" />
  <script type="module" src="/src/main.js"></script>
  <style>
    body {
      padding: var(--size-xl);
      background: var(--color-surface);
    }
    section + section {
      margin-block-start: var(--size-xl);
      padding-block-start: var(--size-xl);
      border-block-start: var(--border-width-thin, 1px) solid var(--color-border);
    }
    h2 { margin-block-end: var(--size-s); }
  </style>
</head>
<body>
  <h1>Social Links</h1>

  <section>
    <h2>Icon and label (default)</h2>
    <social-links>
      <ul>
        <li><a href="https://bsky.app/profile/example.bsky.social"><span class="social-icon" data-service="bluesky" aria-hidden="true"></span><span>Bluesky</span></a></li>
        <li><a href="https://mastodon.social/@example" rel="me"><span class="social-icon" data-service="mastodon" aria-hidden="true"></span><span>Mastodon</span></a></li>
        <li><a href="https://github.com/example"><span class="social-icon" data-service="github" aria-hidden="true"></span><span>GitHub</span></a></li>
        <li><a href="https://www.linkedin.com/in/example"><span class="social-icon" data-service="linkedin" aria-hidden="true"></span><span>LinkedIn</span></a></li>
        <li><a href="https://www.youtube.com/@example"><span class="social-icon" data-service="youtube" aria-hidden="true"></span><span>YouTube</span></a></li>
        <li><a href="https://example.com/"><span class="social-icon" data-service="link" aria-hidden="true"></span><span>My site</span></a></li>
      </ul>
    </social-links>
  </section>

  <section>
    <h2>Icon only, brand colours</h2>
    <social-links variant="icon" color>
      <ul>
        <li><a href="https://bsky.app/profile/example.bsky.social"><span class="social-icon" data-service="bluesky" aria-hidden="true"></span><span>Bluesky</span></a></li>
        <li><a href="https://github.com/example"><span class="social-icon" data-service="github" aria-hidden="true"></span><span>GitHub</span></a></li>
        <li><a href="https://www.youtube.com/@example"><span class="social-icon" data-service="youtube" aria-hidden="true"></span><span>YouTube</span></a></li>
      </ul>
    </social-links>
  </section>

  <section>
    <h2>Label only</h2>
    <social-links variant="label">
      <ul>
        <li><a href="https://bsky.app/profile/example.bsky.social"><span class="social-icon" data-service="bluesky" aria-hidden="true"></span><span>Bluesky</span></a></li>
        <li><a href="https://github.com/example"><span class="social-icon" data-service="github" aria-hidden="true"></span><span>GitHub</span></a></li>
      </ul>
    </social-links>
  </section>
</body>
</html>
