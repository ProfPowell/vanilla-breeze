<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Date Locale Demo</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body {
      padding: var(--size-xl);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <layout-stack data-layout-gap="s">
    <h1>Locale override</h1>
    <p>German: <time datetime="2026-02-09" data-format-date="long" data-locale="de-DE">9. Februar 2026</time></p>
    <p>Japanese: <time datetime="2026-02-09" data-format-date="long" data-locale="ja-JP">2026年2月9日</time></p>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
