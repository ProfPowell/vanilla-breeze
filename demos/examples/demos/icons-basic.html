<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Icons Demo</title>
  <link rel="stylesheet" href="/src/main.css" />
</head>
<body>
  <main>
    <ul class="unstyled" data-layout="grid" data-layout-min="xs" data-layout-gap="m">
      <li data-layout="stack" data-layout-gap="xs" data-layout-align="center">
        <icon-wc name="home" size="lg"></icon-wc>
        <small>home</small>
      </li>
      <li data-layout="stack" data-layout-gap="xs" data-layout-align="center">
        <icon-wc name="settings" size="lg"></icon-wc>
        <small>settings</small>
      </li>
      <li data-layout="stack" data-layout-gap="xs" data-layout-align="center">
        <icon-wc name="user" size="lg"></icon-wc>
        <small>user</small>
      </li>
      <li data-layout="stack" data-layout-gap="xs" data-layout-align="center">
        <icon-wc name="search" size="lg"></icon-wc>
        <small>search</small>
      </li>
      <li data-layout="stack" data-layout-gap="xs" data-layout-align="center">
        <icon-wc name="mail" size="lg"></icon-wc>
        <small>mail</small>
      </li>
      <li data-layout="stack" data-layout-gap="xs" data-layout-align="center">
        <icon-wc name="heart" size="lg"></icon-wc>
        <small>heart</small>
      </li>
      <li data-layout="stack" data-layout-gap="xs" data-layout-align="center">
        <icon-wc name="star" size="lg"></icon-wc>
        <small>star</small>
      </li>
      <li data-layout="stack" data-layout-gap="xs" data-layout-align="center">
        <icon-wc name="check" size="lg"></icon-wc>
        <small>check</small>
      </li>
    </ul>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
