<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Sign-up form starter — Vanilla Breeze</title>
  <!--
    Starter template, linked from docs/quick-start/#next. Copy the file and
    point the stylesheet and script at the CDN files from the Quick Start
    install step. <form-field> is a CSS-only custom element: hints and errors are
    native <output> elements driven by HTML validation, no JS required.
  -->
  <link rel="stylesheet" href="/src/main.css"/>
  <style>body { padding: var(--size-l); }</style>
</head>
<body>
<main data-layout="center" data-layout-max="narrow">
  <form data-layout="stack" data-layout-gap="m" aria-labelledby="form-title">
    <header data-layout="stack" data-layout-gap="xs">
      <h1 id="form-title">Create your account</h1>
      <p>Takes about a minute. Cancel anytime.</p>
    </header>

    <form-field>
      <label for="qs-form-name">Full name</label>
      <input id="qs-form-name" name="name" type="text" autocomplete="name" required
             aria-describedby="qs-form-name-error"/>
      <output id="qs-form-name-error" class="error" for="qs-form-name" aria-live="polite">Please enter your name.</output>
    </form-field>

    <form-field>
      <label for="qs-form-email">Email</label>
      <input id="qs-form-email" name="email" type="email" autocomplete="email" required
             aria-describedby="qs-form-email-hint qs-form-email-error"/>
      <output id="qs-form-email-hint" class="hint" for="qs-form-email">We'll send a confirmation link.</output>
      <output id="qs-form-email-error" class="error" for="qs-form-email" aria-live="polite">Please enter a valid email address.</output>
    </form-field>

    <form-field>
      <label for="qs-form-role">Role</label>
      <select id="qs-form-role" name="role">
        <option>Developer</option>
        <option>Designer</option>
        <option>Product</option>
      </select>
    </form-field>

    <form-field>
      <label>
        <input type="checkbox" name="newsletter" checked/>
        Send me product updates
      </label>
    </form-field>

    <footer data-layout="cluster" data-layout-gap="s">
      <button type="submit">Create account</button>
      <button type="reset" class="ghost">Cancel</button>
    </footer>
  </form>
</main>

<script type="module" src="/src/main.js"></script>
</body>
</html>
