<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>autofocus Demo</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body {
      padding: var(--size-m);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <main data-layout="stack" data-layout-gap="l">
    <h1 class="visually-hidden">Project settings</h1>
    <p>Each dialog moves focus when it opens, not when the page loads.</p>

    <p data-layout="cluster" data-layout-gap="s">
      <button type="button" commandfor="delete-dialog" command="show-modal">Delete project…</button>
      <button type="button" class="secondary" commandfor="rename-dialog" command="show-modal">Rename project…</button>
    </p>

    <dialog id="delete-dialog" aria-labelledby="delete-title">
      <form method="dialog">
        <h2 id="delete-title">Delete "Spring launch"?</h2>
        <p>The project and its 14 files are removed for everyone. This cannot be undone.</p>
        <footer class="actions end">
          <button type="submit" value="cancel" autofocus>Cancel</button>
          <button type="submit" value="delete" class="secondary">Delete project</button>
        </footer>
      </form>
    </dialog>

    <dialog id="rename-dialog" aria-labelledby="rename-title">
      <form method="dialog">
        <h2 id="rename-title">Rename project</h2>
        <form-field>
          <label for="project-name">Project name</label>
          <input type="text" id="project-name" name="name" value="Spring launch" autofocus />
        </form-field>
        <footer class="actions end">
          <button type="submit" value="cancel" class="secondary">Cancel</button>
          <button type="submit" value="save">Save name</button>
        </footer>
      </form>
    </dialog>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
