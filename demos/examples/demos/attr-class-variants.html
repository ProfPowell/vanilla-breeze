<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>class Demo</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body {
      padding: var(--size-m);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <main data-layout="stack" data-layout-gap="l">
    <header class="page compact">
      <h1>Order history</h1>
    </header>

    <nav class="horizontal pills" aria-label="Order filters">
      <ul>
        <li><a href="#all" aria-current="page">All</a></li>
        <li><a href="#open">Open</a></li>
        <li><a href="#shipped">Shipped</a></li>
      </ul>
    </nav>

    <p class="lead">Classes name a variant of one element. The same word can mean something different on another element.</p>

    <ul class="inline">
      <li>Order #1042</li>
      <li>3 items</li>
      <li>Shipped 4 November</li>
    </ul>

    <p data-layout="cluster" data-layout-gap="s">
      <button type="button">Track parcel</button>
      <button type="button" class="secondary">Download invoice</button>
      <button type="button" class="ghost small">Report a problem</button>
    </p>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
