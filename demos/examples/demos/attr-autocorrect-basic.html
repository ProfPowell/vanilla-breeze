<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>autocorrect Demo</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body {
      padding: var(--size-m);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <form class="stacked" method="dialog">
    <p><small>Type a deliberate typo such as "teh" in each field. Where the browser and operating system offer autocorrection, only the bio is corrected.</small></p>

    <form-field>
      <label for="ac-bio">Short bio</label>
      <textarea id="ac-bio" name="bio" rows="3"></textarea>
      <output class="hint" for="ac-bio">No attribute: autocorrect is on</output>
    </form-field>

    <form-field>
      <label for="ac-handle">Username</label>
      <input type="text" id="ac-handle" name="username" autocorrect="off" autocapitalize="none" spellcheck="false" autocomplete="username" />
      <output class="hint" for="ac-handle">autocorrect="off"</output>
    </form-field>

    <form-field>
      <label for="ac-sku">Product code</label>
      <input type="text" id="ac-sku" name="sku" autocorrect="off" spellcheck="false" placeholder="WX-4829-BLK" />
      <output class="hint" for="ac-sku">autocorrect="off"</output>
    </form-field>

    <form-field>
      <label for="ac-site">Website</label>
      <input type="url" id="ac-site" name="site" placeholder="https://example.com" />
      <output class="hint" for="ac-site">type="url" never autocorrects, so no attribute is needed</output>
    </form-field>

    <footer class="actions">
      <button type="submit">Save profile</button>
    </footer>
  </form>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
