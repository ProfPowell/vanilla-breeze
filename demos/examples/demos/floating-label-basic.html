<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floating Labels</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-xl); background: var(--color-surface); }
  </style>
</head>
<body>
  <main data-layout="center" data-layout-max="narrow">
    <form method="dialog" data-layout="stack" data-layout-gap="m">
      <form-field data-floating-label>
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" autocomplete="email" />
      </form-field>

      <form-field data-floating-label>
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" autocomplete="name" value="Alexandra Chen" required />
      </form-field>

      <form-field data-floating-label>
        <label for="msg">Message</label>
        <textarea id="msg" name="msg" rows="3"></textarea>
      </form-field>

      <form-field data-floating-label>
        <label for="country">Country</label>
        <select id="country" name="country">
          <option value="us">United States</option>
          <option value="uk">United Kingdom</option>
          <option value="ca">Canada</option>
        </select>
      </form-field>

      <button type="submit">Send</button>
    </form>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
