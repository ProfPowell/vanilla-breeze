<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tabs Keyboard Demo</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body {
      padding: var(--size-m);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <tab-set aria-label="Keyboard demo tabs">
    <details name="keyboard-demo" open>
      <summary>First</summary>
      <section>
        <p>Press <kbd>ArrowRight</kbd> to move to the next tab.</p>
      </section>
    </details>
    <details name="keyboard-demo">
      <summary>Second</summary>
      <section>
        <p>Press <kbd>ArrowLeft</kbd> to move to the previous tab, or <kbd>End</kbd> to jump to the last.</p>
      </section>
    </details>
    <details name="keyboard-demo">
      <summary>Third</summary>
      <section>
        <p>Press <kbd>Home</kbd> to jump back to the first tab.</p>
      </section>
    </details>
  </tab-set>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
