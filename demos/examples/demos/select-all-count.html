<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Select All with Count</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-xl); background: var(--color-surface); }
  </style>
</head>
<body>
  <form data-layout="stack" data-layout-gap="s" action="#">
    <fieldset data-layout="stack" data-layout-gap="xs">
      <legend>Notifications</legend>
      <label><input type="checkbox" data-select-all='[name="notify"]' /> All notifications</label>
      <label><input type="checkbox" name="notify" value="mentions" /> Mentions</label>
      <label><input type="checkbox" name="notify" value="replies" /> Replies</label>
      <label><input type="checkbox" name="notify" value="follows" /> New followers</label>
      <label><input type="checkbox" name="notify" value="billing" checked disabled /> Billing (required)</label>
      <p><output data-selected-count>0</output> of 3 optional notifications on</p>
    </fieldset>
    <p data-layout="cluster" data-layout-gap="s">
      <button type="submit">Save</button>
      <button type="reset" class="secondary">Reset</button>
    </p>
  </form>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
