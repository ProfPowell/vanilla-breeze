<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Number Format Styles Demo</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body {
      padding: var(--size-xl);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <layout-stack data-layout-gap="l">
    <h1>Number format styles</h1>
    <section aria-labelledby="decimal-heading">
      <h2 id="decimal-heading">Decimal (default)</h2>
      <p><data value="1234567" data-format-number>1,234,567</data></p>
    </section>
    <section aria-labelledby="currency-heading">
      <h2 id="currency-heading">Currency</h2>
      <layout-stack data-layout-gap="s">
        <p>USD: <data value="48200" data-format-number="currency" data-currency="USD">$48,200.00</data></p>
        <p>EUR: <data value="48200" data-format-number="currency" data-currency="EUR">€48,200.00</data></p>
        <p>GBP: <data value="48200" data-format-number="currency" data-currency="GBP">£48,200.00</data></p>
      </layout-stack>
    </section>
    <section aria-labelledby="percent-heading">
      <h2 id="percent-heading">Percent</h2>
      <layout-cluster data-layout-gap="l">
        <data value="0.85" data-format-number="percent">85%</data>
        <data value="0.024" data-format-number="percent" data-fraction-digits="1">2.4%</data>
      </layout-cluster>
    </section>
    <section aria-labelledby="compact-heading">
      <h2 id="compact-heading">Compact</h2>
      <layout-cluster data-layout-gap="l">
        <data value="1500000" data-format-number="compact">1.5M</data>
        <data value="45600" data-format-number="compact">46K</data>
        <data value="45600" data-format-number="compact" data-fraction-digits="1">45.6K</data>
      </layout-cluster>
    </section>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
