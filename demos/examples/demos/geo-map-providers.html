<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Geo Map - Providers Demo</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body { margin: 0; padding: var(--size-l); }
    geo-map { --geo-map-height: 200px; }
  </style>
</head>
<body>
  <main data-layout="grid" data-layout-min="m" data-layout-gap="l">
    <figure>
      <geo-map lat="51.5007" lng="-0.1246" zoom="15" provider="osm" label="Westminster, OpenStreetMap style"></geo-map>
      <figcaption>osm (default)</figcaption>
    </figure>
    <figure>
      <geo-map lat="51.5007" lng="-0.1246" zoom="15" provider="carto-light" label="Westminster, CARTO light style"></geo-map>
      <figcaption>carto-light</figcaption>
    </figure>
    <figure>
      <geo-map lat="51.5007" lng="-0.1246" zoom="15" provider="carto-dark" label="Westminster, CARTO dark style"></geo-map>
      <figcaption>carto-dark</figcaption>
    </figure>
    <figure>
      <geo-map lat="51.5007" lng="-0.1246" zoom="15" provider="carto-auto" label="Westminster, follows the colour mode"></geo-map>
      <figcaption>carto-auto (follows light / dark mode)</figcaption>
    </figure>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
