<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard Layout</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body { margin: 0; }
    header {
      padding: var(--size-xs) var(--size-s);
      background: var(--color-gray-200);
      font-size: var(--font-size-s);
    }
    nav {
      padding: var(--size-xs);
      background: var(--color-gray-100);
      font-size: var(--font-size-s);
    }
    main {
      padding: var(--size-s);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-muted);
      font-size: var(--font-size-s);
    }
  </style>
</head>
<body data-page-layout="dashboard" data-layout-gap="none">
  <header data-layout="cluster" data-layout-justify="between">
    <span>Dashboard Header</span>
    <button type="button" class="small" popovertarget="dashboard-nav" data-nav-toggle>Menu</button>
  </header>
  <nav id="dashboard-nav" popover aria-label="Dashboard">
    <ul>
      <li><a href="#">Overview</a></li>
      <li><a href="#">Reports</a></li>
      <li><a href="#">Settings</a></li>
    </ul>
  </nav>
  <main>Dashboard Content</main>
</body>
</html>
