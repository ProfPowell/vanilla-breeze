<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Animate Image Demo</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body {
      padding: var(--size-l);
      background: var(--color-surface);
    }
    .demo-img {
      max-inline-size: 100%;
      block-size: auto;
      border-radius: var(--radius-m);
    }
  </style>
</head>
<body>
  <h1>Animate Image Demo</h1>
  <layout-center data-layout-max="narrow">
    <layout-stack data-layout-gap="l">

      <section>
        <h2>Play/Pause Control</h2>
        <p>The button pauses the animation on a still of its first frame. It starts paused when you prefer reduced motion.</p>
        <img src="/docs/examples/demos/assets/robot-arm.gif"
             data-effect="animate-image"
             alt="A robot arm picks up a block and sets it down again"
             class="demo-img"/>
      </section>

      <section>
        <h2>Start Paused</h2>
        <p>This image starts paused. Press play to start it.</p>
        <img src="/docs/examples/demos/assets/robot-arm.gif"
             data-effect="animate-image"
             data-animate-image-paused
             alt="A robot arm picks up a block and sets it down again"
             class="demo-img"/>
      </section>

      <section>
        <h2>Inside &lt;picture&gt;</h2>
        <p>The whole <code>&lt;picture&gt;</code> is wrapped, so its sources keep working.</p>
        <picture>
          <source srcset="/docs/examples/demos/assets/bounce.gif" media="(min-width: 40rem)"/>
          <img src="/docs/examples/demos/assets/robot-arm.gif"
               data-effect="animate-image"
               alt="A ball bounces across the frame (wide screens) or a robot arm moves a block"
               class="demo-img"/>
        </picture>
      </section>

    </layout-stack>
  </layout-center>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
