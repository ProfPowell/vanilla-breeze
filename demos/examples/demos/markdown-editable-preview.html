<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>data-markdown-editable — Textarea with a preview target</title>
  <link rel="stylesheet" href="/src/main.css" />
  <script type="module" src="/src/main.js"></script>
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <layout-center data-layout-max="narrow">
    <article data-layout="stack" data-layout-gap="m">
      <h1>Release note</h1>
      <form-field>
        <label for="summary">Summary</label>
        <textarea id="summary" name="summary" rows="3" data-markdown-editable data-preview="summary-preview" aria-describedby="summary-hint">Adds **inline markdown** to `form-field` hints and fixes the [focus ring](https://vanilla-breeze.com/docs/accessibility/) in dark mode.</textarea>
        <output id="summary-hint" class="hint" for="summary">Markdown: **bold**, *italic*, `code` and [links](url). The preview updates when you leave the field.</output>
      </form-field>
      <section aria-labelledby="preview-heading">
        <h2 id="preview-heading">Preview</h2>
        <p id="summary-preview"></p>
      </section>
    </article>
  </layout-center>
</body>
</html>
