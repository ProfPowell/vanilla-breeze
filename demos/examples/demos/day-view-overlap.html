<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Day View — Overlapping Events</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body {
      padding: var(--size-m);
      background: var(--color-surface);
      max-inline-size: 50rem;
      margin-inline: auto;
    }
  </style>
</head>
<body>
  <h1>Day View — Overlapping Events</h1>
  <p>Spanning events that overlap share the column side by side. The evening workshop runs past the last visible hour, so it is clipped with a dashed end edge.</p>

  <day-view data-date="2026-04-10" data-start-hour="9" data-end-hour="17">
    <calendar-event data-category="meeting" data-duration="2h">
      <time datetime="10:00">10:00</time>
      Design workshop
    </calendar-event>
    <calendar-event data-category="personal" data-duration="1h">
      <time datetime="10:30">10:30</time>
      Candidate interview
    </calendar-event>
    <calendar-event data-category="focus" data-duration="90m">
      <time datetime="11:30">11:30</time>
      Pairing session
    </calendar-event>
    <calendar-event data-category="deadline" data-duration="3h">
      <time datetime="16:00">4:00</time>
      Launch rehearsal
    </calendar-event>
  </day-view>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
