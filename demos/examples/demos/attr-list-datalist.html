<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>list attribute: datalist suggestions on text, search and range inputs</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-xl); background: var(--color-surface); }
  </style>
</head>
<body>
  <layout-center data-layout-max="narrow">
    <form class="stacked">
      <form-field>
        <label for="ls-city">Office city</label>
        <input type="text" id="ls-city" name="city" list="ls-cities" autocomplete="off" />
        <output class="hint" for="ls-city">Pick a suggestion or type any city. VB draws the arrow.</output>
        <datalist id="ls-cities">
          <option value="Amsterdam"></option>
          <option value="Berlin"></option>
          <option value="Lisbon"></option>
          <option value="Nairobi"></option>
          <option value="Osaka"></option>
          <option value="Toronto"></option>
        </datalist>
      </form-field>

      <form-field>
        <label for="ls-topic">Search topics</label>
        <input id="ls-topic" type="search" name="topic" list="ls-topics" class="search" />
        <output class="hint" for="ls-topic">The .search variant swaps the arrow for a magnifier.</output>
        <datalist id="ls-topics">
          <option value="Billing"></option>
          <option value="Data export"></option>
          <option value="Single sign-on"></option>
          <option value="Two-factor authentication"></option>
        </datalist>
      </form-field>

      <form-field>
        <label for="ls-budget">Monthly budget</label>
        <input id="ls-budget" type="range" name="budget" min="0" max="1000" step="50" value="500"
               list="ls-budget-ticks" data-range data-bubble data-prefix="$" />
        <datalist id="ls-budget-ticks">
          <option value="0" label="$0"></option>
          <option value="250" label="$250"></option>
          <option value="500" label="$500"></option>
          <option value="750" label="$750"></option>
          <option value="1000" label="$1,000"></option>
        </datalist>
        <output class="hint" for="ls-budget">data-range renders the option labels under the track.</output>
      </form-field>

      <button type="submit">Save</button>
    </form>
  </layout-center>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
