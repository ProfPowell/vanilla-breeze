<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code Colors</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body {
      padding: var(--size-m);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <h1>QR Code Colors</h1>
  <section data-layout="cluster" data-layout-gap="l" data-layout-align="start">
    <qr-code value="https://example.com" data-caption="visible">Default: black on white</qr-code>
    <qr-code value="https://example.com" color="#1a5276" background="#f0f0f0" data-caption="visible">Brand: dark blue on light grey</qr-code>
  </section>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
