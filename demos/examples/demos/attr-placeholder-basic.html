<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>placeholder attribute: format hints and lasting hints</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-xl); background: var(--color-surface); }
  </style>
</head>
<body>
  <layout-center data-layout-max="narrow">
    <form class="stacked">
      <form-field>
        <label for="ph-email">Work email</label>
        <input id="ph-email" type="email" name="email" autocomplete="email" placeholder="jane@example.com" />
        <output class="hint" for="ph-email">We send the invoice here.</output>
      </form-field>

      <form-field>
        <label for="ph-code">Authenticator code</label>
        <input type="text" id="ph-code" name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="123 456" />
        <output class="hint" for="ph-code">Open your authenticator app and enter the 6-digit code it shows.</output>
      </form-field>

      <form-field>
        <label for="ph-address">Delivery notes</label>
        <textarea id="ph-address" name="notes" rows="3" placeholder="Gate code: 4821&#10;Leave parcels with reception"></textarea>
        <output class="hint" for="ph-address">A line feed in a textarea placeholder renders as a line break.</output>
      </form-field>

      <form-field data-floating-label>
        <label for="ph-city">City</label>
        <input type="text" id="ph-city" name="city" autocomplete="address-level2" />
      </form-field>

      <button type="submit">Save</button>
    </form>
  </layout-center>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
