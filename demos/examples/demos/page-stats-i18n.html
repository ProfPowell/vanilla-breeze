<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Stats — 日本語のデモ</title>
  <meta name="last-modified" content="2026-03-15" />
  <link rel="stylesheet" href="/src/main.css" />
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <main>
    <header>
      <page-stats data-for="article-ja"
                  data-show="reading-time,word-count,last-modified"
                  data-label-reading-time="読了時間"
                  data-label-word-count="語数"
                  data-label-last-modified="最終更新"
                  data-label-words="{n} 語"></page-stats>
    </header>

    <article id="article-ja">
      <h1>散歩のすすめ</h1>
      <p>散歩は、特別な道具も費用も必要としない、最も手軽な運動のひとつです。毎日三十分ほど歩くだけで、心臓の健康を保ち、血圧を下げ、気分を明るくする効果があると言われています。</p>
      <p>自然の中を歩くと、ストレスが和らぎ、考えがまとまりやすくなります。友人や家族と一緒に歩けば、会話を楽しむ時間にもなります。年齢を問わず、今日から始められる習慣です。</p>
    </article>
  </main>
</body>
</html>
