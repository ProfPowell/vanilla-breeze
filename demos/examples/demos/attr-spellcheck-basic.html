<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>spellcheck Demo</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body {
      padding: var(--size-m);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <form class="stacked" method="dialog">
    <p><small>Click into each field. Most browsers only mark misspellings in a field that has been focused or edited.</small></p>

    <form-field>
      <label for="sc-review">Your review</label>
      <textarea id="sc-review" name="review" rows="3" spellcheck="true">The delivary was quick and the packageing was recyclable.</textarea>
      <output class="hint" for="sc-review">spellcheck="true"</output>
    </form-field>

    <form-field>
      <label for="sc-css">Custom CSS</label>
      <textarea id="sc-css" name="css" rows="3" spellcheck="false">.btn-primry { colr: rebeccapurple; }</textarea>
      <output class="hint" for="sc-css">spellcheck="false": code is not prose</output>
    </form-field>

    <form-field>
      <label for="sc-sku">Product code</label>
      <input type="text" id="sc-sku" name="sku" spellcheck="false" value="WX-4829-BLK" />
      <output class="hint" for="sc-sku">spellcheck="false"</output>
    </form-field>

    <footer class="actions">
      <button type="submit">Post review</button>
    </footer>
  </form>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
