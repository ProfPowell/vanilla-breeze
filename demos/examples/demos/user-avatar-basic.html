<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Avatar Demo</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body {
      padding: var(--size-l);
      background: var(--color-surface);
    }
    .avatar-label {
      margin-block-end: var(--size-s);
      color: var(--color-text-muted);
    }
  </style>
</head>
<body>
  <layout-stack data-layout-gap="l">
    <section>
      <p class="avatar-label">Size variants</p>
      <layout-cluster data-layout-gap="m" data-layout-align="center">
        <user-avatar data-size="xs">
          <span data-fallback>XS</span>
        </user-avatar>
        <user-avatar data-size="sm">
          <span data-fallback>SM</span>
        </user-avatar>
        <user-avatar data-size="md">
          <span data-fallback>MD</span>
        </user-avatar>
        <user-avatar data-size="lg">
          <span data-fallback>LG</span>
        </user-avatar>
        <user-avatar data-size="xl">
          <span data-fallback>XL</span>
        </user-avatar>
      </layout-cluster>
    </section>

    <section>
      <p class="avatar-label">With images</p>
      <layout-cluster data-layout-gap="m" data-layout-align="center">
        <user-avatar data-size="lg">
          <img src="/src/assets/placeholders/photo-reel-team-members-1-100x100.svg" alt="Jane Doe" />
        </user-avatar>
        <user-avatar data-size="lg">
          <img src="/src/assets/placeholders/photo-reel-team-members-2-100x100.svg" alt="John Smith" />
        </user-avatar>
        <user-avatar data-size="lg">
          <img src="/src/assets/placeholders/photo-reel-team-members-3-100x100.svg" alt="Alex Johnson" />
        </user-avatar>
      </layout-cluster>
    </section>

    <section>
      <p class="avatar-label" id="team-label">Avatar group with overlap</p>
      <ul class="unstyled" data-layout="cluster" data-layout-overlap="s" aria-labelledby="team-label">
        <li>
          <user-avatar data-size="md" data-ring>
            <img src="/src/assets/placeholders/photo-reel-team-members-4-100x100.svg" alt="Priya Patel" />
          </user-avatar>
        </li>
        <li>
          <user-avatar data-size="md" data-ring>
            <img src="/src/assets/placeholders/photo-reel-team-members-1-100x100.svg" alt="Marcus Lee" />
          </user-avatar>
        </li>
        <li>
          <user-avatar data-size="md" data-ring>
            <img src="/src/assets/placeholders/photo-reel-team-members-2-100x100.svg" alt="Sofia Rossi" />
          </user-avatar>
        </li>
        <li>
          <user-avatar data-size="md" data-ring role="img" aria-label="3 more people">
            <span data-fallback aria-hidden="true">+3</span>
          </user-avatar>
        </li>
      </ul>
    </section>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
