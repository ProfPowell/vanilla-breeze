<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lorem Languages Demo</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body {
      padding: var(--size-xl);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <layout-stack data-layout-gap="l">
    <h1>Placeholder text by language</h1>
    <section aria-labelledby="auto-heading">
      <h2 id="auto-heading">Detected from <code>lang</code></h2>
      <layout-stack data-layout-gap="m">
        <p lang="ja" data-lorem></p>
        <p lang="ar" data-lorem dir="rtl"></p>
        <p lang="ru" data-lorem></p>
      </layout-stack>
    </section>
    <section aria-labelledby="explicit-heading">
      <h2 id="explicit-heading">Explicit corpus</h2>
      <layout-stack data-layout-gap="m">
        <p data-lorem="cjk"></p>
        <p data-lorem="arabic"></p>
        <p data-lorem="cyrillic"></p>
      </layout-stack>
    </section>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
