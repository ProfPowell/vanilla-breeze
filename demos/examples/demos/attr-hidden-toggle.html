<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hidden attribute</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body {
      padding: var(--size-l);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <layout-stack data-layout-gap="m">
    <h1 class="visually-hidden">hidden attribute</h1>
    <h2>Order #4821</h2>
    <p>Shipped 3 November. Arriving Friday.</p>
    <button type="button" data-toggle="hidden" data-toggle-target="#tracking">Show tracking history</button>
    <section id="tracking" hidden>
      <h3>Tracking history</h3>
      <ol>
        <li>3 Nov, 09:14: Left the warehouse in Leeds</li>
        <li>4 Nov, 06:02: Arrived at the regional hub</li>
        <li>5 Nov, 07:45: Out for delivery</li>
      </ol>
    </section>
  </layout-stack>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
