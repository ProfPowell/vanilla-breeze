<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code Sizes</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body {
      padding: var(--size-m);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <h1>QR Code Sizes</h1>
  <section data-layout="cluster" data-layout-gap="l" data-layout-align="end">
    <qr-code value="https://example.com" size="100" data-caption="visible">100px</qr-code>
    <qr-code value="https://example.com" data-caption="visible">200px (default)</qr-code>
    <qr-code value="https://example.com" size="300" data-caption="visible">300px</qr-code>
  </section>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
