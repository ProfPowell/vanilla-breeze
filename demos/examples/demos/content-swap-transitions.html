<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Swap Transitions Demo</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body {
      padding: var(--size-l);
      background: var(--color-background);
    }

    .face {
      padding: var(--size-m);
      border: var(--border-width-thin) solid var(--color-border);
      border-radius: var(--radius-m);
      background: var(--color-surface);
    }

    [data-face="back"].face {
      background: var(--color-surface-raised);
    }
  </style>
</head>
<body>
  <layout-grid data-layout-min="xs" data-layout-gap="m">
    <content-swap transition="fade">
      <section data-face="front" class="face">
        <p><strong>Fade</strong></p>
        <small>Click to swap</small>
      </section>
      <section data-face="back" class="face">
        <p>Faded in</p>
      </section>
    </content-swap>

    <content-swap transition="slide-left">
      <section data-face="front" class="face">
        <p><strong>Slide Left</strong></p>
        <small>Click to swap</small>
      </section>
      <section data-face="back" class="face">
        <p>Slid in</p>
      </section>
    </content-swap>

    <content-swap transition="scale">
      <section data-face="front" class="face">
        <p><strong>Scale</strong></p>
        <small>Click to swap</small>
      </section>
      <section data-face="back" class="face">
        <p>Scaled in</p>
      </section>
    </content-swap>
  </layout-grid>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
