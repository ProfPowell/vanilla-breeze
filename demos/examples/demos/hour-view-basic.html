<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hour View — Slots</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body {
      padding: var(--size-m);
      background: var(--color-surface);
      max-inline-size: 40rem;
      margin-inline: auto;
    }
  </style>
</head>
<body>
  <h1>Hour View — Slots</h1>

<day-view data-date="2026-04-10">
  <ol>
    <li>
      <time datetime="09:00">9 AM</time>
      <hour-view>
        <calendar-event data-category="meeting">
          <time datetime="09:00">9:00</time>
          Sprint standup
        </calendar-event>
      </hour-view>
    </li>
    <li>
      <time datetime="10:00">10 AM</time>
      <hour-view>
        <calendar-event data-category="focus">
          <time datetime="10:00">10:00</time>
          Write release notes
        </calendar-event>
        <calendar-event data-category="personal" data-start="30">
          <time datetime="10:30">10:30</time>
          Coffee with Priya
        </calendar-event>
      </hour-view>
    </li>
    <li>
      <time datetime="11:00">11 AM</time>
      <hour-view data-overlap>
        <calendar-event data-category="focus">
          <time datetime="11:00">11:00</time>
          Code review
        </calendar-event>
        <calendar-event data-category="meeting">
          <time datetime="11:00">11:00</time>
          1:1 with Sarah
        </calendar-event>
      </hour-view>
    </li>
    <li>
      <time datetime="12:00">12 PM</time>
      <hour-view data-overlap>
        <calendar-event data-category="meeting">
          <time datetime="12:00">12:00</time>
          Vendor call
        </calendar-event>
        <calendar-event data-category="deadline">
          <time datetime="12:00">12:00</time>
          Ship the quarterly business review deck to the leadership team
        </calendar-event>
        <calendar-event data-category="personal">
          <time datetime="12:00">12:00</time>
          Lunch
        </calendar-event>
      </hour-view>
    </li>
    <li>
      <time datetime="13:00">1 PM</time>
      <hour-view></hour-view>
    </li>
  </ol>
</day-view>

<script type="module" src="/src/main.js"></script>
</body>
</html>
