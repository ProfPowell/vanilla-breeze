<!doctype html>
<html lang="en">

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mock Figure Demo</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body {
      padding: var(--size-xl);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <h1>Mock image in a figure</h1>
  <figure>
    <img data-mock="card" alt="Team photo" />
    <figcaption>Our engineering team</figcaption>
  </figure>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
