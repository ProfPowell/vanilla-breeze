<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Copy from a Target Element</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-xl); background: var(--color-surface); }
  </style>
</head>
<body>
  <main data-layout="stack" data-layout-gap="m">
    <pre><code id="code-example">const greeting = "Hello, world!";</code></pre>
    <p data-layout="cluster" data-layout-gap="s">
      <button type="button" data-copy-target="#code-example" class="secondary">Copy code</button>
    </p>
    <form-field>
      <label for="token">API token</label>
      <input id="token" type="text" value="vb_live_3f9a2c" readonly />
    </form-field>
    <p data-layout="cluster" data-layout-gap="s">
      <button type="button" data-copy-target="#token" class="secondary">Copy token</button>
      <small>Inputs and textareas copy their current value.</small>
    </p>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
