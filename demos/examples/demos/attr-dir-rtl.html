<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dir Demo</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body {
      padding: var(--size-m);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <main data-layout="stack" data-layout-gap="l">
    <h1 class="visually-hidden">Text direction</h1>
    <section data-layout="stack" data-layout-gap="s" aria-labelledby="bidi-heading">
      <h2 id="bidi-heading">Text of unknown direction</h2>
      <p>User <bdi>إيمان</bdi> left 3 comments.</p>
      <p>User <bdi>Alice</bdi> left 3 comments.</p>
      <form-field>
        <label for="dir-message">Message (<code>dir="auto"</code>)</label>
        <input type="text" id="dir-message" name="message" dir="auto" value="مرحبا، كيف حالك؟" />
      </form-field>
    </section>

    <section lang="ar" dir="rtl" data-layout="stack" data-layout-gap="s" aria-labelledby="rtl-heading">
      <h2 id="rtl-heading">واجهة من اليمين إلى اليسار</h2>
      <nav class="breadcrumb" data-separator="chevron" aria-label="مسار التنقل">
        <ol>
          <li><a href="#home">الرئيسية</a></li>
          <li><a href="#docs">المستندات</a></li>
          <li><span aria-current="page">السمات</span></li>
        </ol>
      </nav>
      <details>
        <summary>تفاصيل الطلب</summary>
        <p>تم شحن الطلب رقم <bdi>1042</bdi> يوم الثلاثاء.</p>
      </details>
      <label><input type="checkbox" data-switch checked /> الإشعارات</label>
      <label for="dir-volume">مستوى الصوت</label>
      <input type="range" id="dir-volume" name="volume" min="0" max="100" value="30" />
      <p><button type="button">التالي <icon-wc name="arrow-right" data-flip-rtl></icon-wc></button></p>
      <pre><code>npm install vanilla-breeze</code></pre>
    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
