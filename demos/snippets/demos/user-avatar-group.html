<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>User Avatar Group</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <ul class="unstyled" data-layout="cluster" data-layout-overlap>
    <li>
      <user-avatar>
        <img src="/src/assets/placeholders/photo-reel-team-members-1-100x100.svg" alt="Jane Doe" />
      </user-avatar>
    </li>
    <li>
      <user-avatar>
        <img src="/src/assets/placeholders/photo-reel-team-members-2-100x100.svg" alt="John Smith" />
      </user-avatar>
    </li>
    <li>
      <user-avatar>
        <img src="/src/assets/placeholders/photo-reel-team-members-3-100x100.svg" alt="Alex Johnson" />
      </user-avatar>
    </li>
    <li>
      <user-avatar role="img" aria-label="5 more members">
        <span data-fallback aria-hidden="true">+5</span>
      </user-avatar>
    </li>
  </ul>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
