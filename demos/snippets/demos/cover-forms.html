<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cover: Element and Attribute Forms</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    .demo-host { outline: var(--border-width-thin) dashed var(--color-border); outline-offset: var(--size-3xs); }
    .demo-host { background: var(--color-surface-raised); }
  </style>
</head>
<body>
  <h1>Cover: Element and Attribute Forms</h1>
  <layout-grid data-layout-min="l" data-layout-gap="l">
    <section aria-labelledby="cover-el-heading">
      <h2 id="cover-el-heading">Element form</h2>
      <!-- [html-validate-disable-next no-inline-style: --layout-min is the documented one-off height] -->
      <layout-cover id="cover-element" class="demo-host" data-layout-centered style="--layout-min: 14rem">
        <header><small>Header</small></header>
        <hgroup data-layout-principal>
          <h3>Launching soon</h3>
          <p>The principal is centred vertically.</p>
        </hgroup>
        <footer><small>Footer</small></footer>
      </layout-cover>
    </section>

    <section aria-labelledby="cover-attr-heading">
      <h2 id="cover-attr-heading">Attribute form</h2>
      <!-- [html-validate-disable-next no-inline-style: --layout-min is the documented one-off height] -->
      <section id="cover-attribute" class="demo-host" data-layout="cover" data-layout-centered aria-label="Attribute form example" style="--layout-min: 14rem">
        <header><small>Header</small></header>
        <hgroup data-layout-principal>
          <h3>Launching soon</h3>
          <p>The principal is centred vertically.</p>
        </hgroup>
        <footer><small>Footer</small></footer>
      </section>
    </section>
  </layout-grid>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
