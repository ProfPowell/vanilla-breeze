<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Section Padded</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: 0; background: var(--color-surface); } section.padded { background: var(--color-surface-raised); }
  </style>
</head>
<body>
  <h1>Section Padded</h1>
  <section class="padded">
    <h2>Padded Section</h2>
    <p>Extra vertical padding creates visual separation between sections. The raised background shows where the padding sits.</p>
  </section>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
