<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BDO Examples</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <h1>BDO Examples</h1>
  <layout-stack data-layout-gap="l">
    <section>
      <h2>Reversed text</h2>
      <p>Normal: Hello World</p>
      <p>Reversed: <bdo dir="rtl">Hello World</bdo></p>
    </section>
    <section>
      <h2>Hebrew shown in storage order</h2>
      <p>Displayed normally: <span lang="he" dir="rtl">שלום</span></p>
      <p>Characters in storage order: <bdo dir="ltr" lang="he">שלום</bdo></p>
    </section>
    <section>
      <h2>No bdo needed</h2>
      <p>The Hebrew word for "peace" is <span lang="he" dir="rtl">שלום</span>.</p>
    </section>
    <section>
      <h2>Nested overrides</h2>
      <p><bdo dir="rtl">Outer RTL <bdo dir="ltr">Inner LTR</bdo> Back to RTL</bdo></p>
    </section>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
