<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Article Highlights — Custom Colors</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    .custom-colors {
      --highlight-red: light-dark(oklch(89% 0.06 22), oklch(42% 0.10 25));
      --highlight-orange: light-dark(oklch(91% 0.07 62), oklch(44% 0.09 55));
      --highlight-teal: light-dark(oklch(91% 0.08 180), oklch(42% 0.07 180));
    }
  </style>
</head>
<body>
  <article id="colors-demo" data-highlights="custom-colors-demo" data-highlights-colors="red,orange,teal" class="custom-colors">
    <p>This article uses a custom set of highlight colors: red, orange, and teal. The colors are defined via CSS custom properties and listed in the data-highlights-colors attribute.</p>
    <p>You can define any colors you like by setting --highlight-{name} custom properties and listing the names in the attribute.</p>
  </article>

  <selection-menu for="colors-demo">
    <highlight-wc colors="red,orange,teal"></highlight-wc>
    <note-wc></note-wc>
  </selection-menu>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
