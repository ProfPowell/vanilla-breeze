<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>data-hide-when: hide a field</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body {
      padding: var(--size-l);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <form data-layout="stack" data-layout-gap="m">
    <label>
      <input type="checkbox" name="gift" value="yes"/>
      This is a gift
    </label>
    <form-field data-hide-when="gift=yes">
      <label for="receipt">Send receipt to</label>
      <input type="email" id="receipt" name="receipt"/>
    </form-field>
    <button type="submit">Save</button>
  </form>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
