<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>star-rating — web component</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <layout-stack data-layout-gap="m">
    <star-rating name="demo-wc" label="Rate this product"></star-rating>
    <star-rating name="demo-wc-half" value="3.5" allow-half label="Your rating"></star-rating>
    <star-rating value="4.2" readonly label="Average rating"></star-rating>
    <star-rating name="demo-wc-icon" icon="heart" max="3" label="How much?"></star-rating>
  </layout-stack>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
