<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Analytics Panel — Compact</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <main data-layout="sidebar" data-layout-gap="l" data-layout-side="end" data-layout-sidebar-width="wide" data-layout-content-min="m">
    <article>
      <h1>Account settings</h1>
      <p>Compact mode shrinks the heading, text, buttons and spacing so the panel sits beside other settings without dominating them.</p>
      <p>The panel reads the live runtime, so the status and the field list match what this page actually sends.</p>
    </article>
    <aside>
      <analytics-panel heading="Your analytics data" compact></analytics-panel>
    </aside>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
