<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Canvas Drawing Examples</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    .demo-responsive-frame {
      max-inline-size: 500px;
      border: var(--border-width-thin) solid var(--color-border);
      border-radius: var(--radius-m);
      overflow: hidden;
    }
  </style>
</head>
<body>
  <h1>Canvas Drawing Examples</h1>
  <layout-stack data-layout-gap="xl">
    <section>
      <h2>Basic shapes and text</h2>
      <!-- Simple informative graphic: role="img" + aria-label names it. -->
      <canvas id="shapes" class="bordered" width="400" height="180" role="img" aria-label="Three shapes labelled fillRect, strokeRect and arc"></canvas>
    </section>
    <section>
      <h2>Bar chart</h2>
      <figure>
        <!-- Data graphic: fallback content carries the data (no role="img",
             which would make these children presentational). -->
        <canvas id="chart" class="bordered" width="450" height="220">
          <ul>
            <li>Q1: $45k</li>
            <li>Q2: $52k</li>
            <li>Q3: $48k</li>
            <li>Q4: $61k</li>
          </ul>
        </canvas>
        <figcaption>Quarterly sales &mdash; 2025</figcaption>
      </figure>
    </section>
    <section>
      <h2>Responsive canvas (resize browser)</h2>
      <section class="canvas-responsive demo-responsive-frame" aria-label="Responsive canvas">
        <canvas id="responsive" role="img" aria-label="Gradient that reports its own size"></canvas>
      </section>
    </section>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
  <script>
    // Resolve theme tokens to concrete colours. A probe element lets the
    // browser compute var()/relative-colour tokens; canvas only takes
    // finished colour strings.
    const probe = document.createElement('span');
    probe.hidden = true;
    document.body.append(probe);
    function token(name) {
      probe.style.color = `var(${name})`;
      return getComputedStyle(probe).color;
    }

    function drawShapes() {
      const s = document.getElementById('shapes');
      const sc = s.getContext('2d');
      sc.clearRect(0, 0, s.width, s.height);
      sc.fillStyle = token('--color-primary');
      sc.fillRect(20, 30, 120, 80);
      sc.strokeStyle = token('--color-secondary');
      sc.lineWidth = 3;
      sc.strokeRect(170, 30, 120, 80);
      sc.beginPath();
      sc.arc(350, 70, 40, 0, Math.PI * 2);
      sc.fillStyle = token('--color-success');
      sc.fill();
      sc.fillStyle = token('--color-text');
      sc.font = '14px system-ui';
      sc.fillText('fillRect', 40, 140);
      sc.fillText('strokeRect', 185, 140);
      sc.fillText('arc', 337, 140);
    }

    function drawChart() {
      const ch = document.getElementById('chart');
      const cc = ch.getContext('2d');
      cc.clearRect(0, 0, ch.width, ch.height);
      const data = [
        { label: 'Q1', value: 45, color: token('--color-primary') },
        { label: 'Q2', value: 52, color: token('--color-secondary') },
        { label: 'Q3', value: 48, color: token('--color-accent') },
        { label: 'Q4', value: 61, color: token('--color-success') },
      ];
      const text = token('--color-text');
      const muted = token('--color-text-muted');
      const grid = token('--color-border');
      const maxVal = 65;
      const barW = 60;
      const gap = 30;
      const startX = 60;
      const chartH = 160;
      const baseY = 190;

      // Y-axis labels and grid lines
      cc.font = '11px system-ui';
      cc.textAlign = 'right';
      for (let i = 0; i <= 3; i++) {
        const y = baseY - (chartH / 3) * i;
        const val = Math.round((maxVal / 3) * i);
        cc.fillStyle = muted;
        cc.fillText(`$${val}k`, 45, y + 4);
        cc.beginPath();
        cc.moveTo(52, y);
        cc.lineTo(450, y);
        cc.strokeStyle = grid;
        cc.lineWidth = 1;
        cc.stroke();
      }

      // Bars
      cc.textAlign = 'center';
      data.forEach((d, i) => {
        const x = startX + i * (barW + gap);
        const barH = (d.value / maxVal) * chartH;
        const y = baseY - barH;
        cc.fillStyle = d.color;
        cc.beginPath();
        cc.roundRect(x, y, barW, barH, [4, 4, 0, 0]);
        cc.fill();
        cc.fillStyle = muted;
        cc.font = '12px system-ui';
        cc.fillText(d.label, x + barW / 2, baseY + 16);
        cc.fillStyle = text;
        cc.font = 'bold 12px system-ui';
        cc.fillText(`$${d.value}k`, x + barW / 2, y - 8);
      });
    }

    // Responsive canvas: keep the drawing buffer in sync with the CSS box
    // (times devicePixelRatio) so the bitmap is never stretched.
    const rc = document.getElementById('responsive');
    const rctx = rc.getContext('2d');
    function drawResponsive() {
      const dpr = window.devicePixelRatio || 1;
      const w = rc.clientWidth;
      const h = rc.clientHeight;
      rc.width = Math.round(w * dpr);
      rc.height = Math.round(h * dpr);
      rctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const g = rctx.createLinearGradient(0, 0, w, h);
      g.addColorStop(0, token('--color-primary'));
      g.addColorStop(1, token('--color-secondary'));
      rctx.fillStyle = g;
      rctx.fillRect(0, 0, w, h);
      rctx.fillStyle = token('--color-text-on-primary');
      rctx.font = '16px system-ui';
      rctx.textAlign = 'center';
      rctx.fillText(`${w} × ${h}px`, w / 2, h / 2 + 6);
    }

    function drawAll() {
      drawShapes();
      drawChart();
      drawResponsive();
    }
    drawAll();
    new ResizeObserver(drawResponsive).observe(rc);

    // Canvas pixels don't restyle themselves: redraw when the colour
    // scheme, mode or theme changes.
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', drawAll);
    new MutationObserver(drawAll).observe(document.documentElement, {
      attributes: true,
      attributeFilter: ['data-mode', 'data-theme', 'class', 'style'],
    });
  </script>
</body>
</html>
