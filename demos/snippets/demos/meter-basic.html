<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meter Basic</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <layout-center data-layout-max="narrow">
  <layout-stack data-layout-gap="m">
    <form-field>
      <label for="meter-storage">Storage used</label>
      <meter id="meter-storage" value="0.7" min="0" max="1">70%</meter>
    </form-field>
    <form-field>
      <label for="meter-battery">Battery level</label>
      <meter id="meter-battery" value="85" min="0" max="100">85%</meter>
    </form-field>
  </layout-stack>
  </layout-center>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
