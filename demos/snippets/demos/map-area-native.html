<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Native Image Map</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    /* Native <area> coords are CSS pixels on the rendered image and never
       scale, so keep the image at its 800x500 size and scroll instead of
       letting the reset's max-inline-size: 100% shrink it. */
    figure { overflow-x: auto; }
    img[usemap] { inline-size: 800px; block-size: 500px; max-inline-size: none; }
    figcaption {
      padding: var(--size-xs) var(--size-s);
      font-size: var(--font-size-s);
      color: var(--color-text-muted);
    }
    output {
      display: block;
      min-block-size: var(--size-xl);
      padding: var(--size-xs) var(--size-s);
      font-size: var(--font-size-s);
      background: var(--color-surface-raised);
      border-radius: var(--radius-s);
    }
  </style>
</head>
<body>
  <figure>
    <img src="assets/map-sample.svg" alt="Office floor plan" usemap="#office-plan" width="800" height="500" />
    <map name="office-plan">
      <area shape="rect" coords="40,40,320,220" href="#conference" alt="Conference Hall" title="Conference Hall — seats 120" />
      <area shape="circle" coords="500,160,80" href="#server" alt="Server Room" title="Server Room — 24 racks" />
      <area shape="rect" coords="40,280,340,460" href="#cafeteria" alt="Cafeteria" title="Cafeteria — open 7am to 7pm" />
      <area shape="rect" coords="620,40,760,160" href="#reception" alt="Reception" title="Reception — visitor check-in" />
      <area shape="poly" coords="480,280,760,280,760,460,560,460,480,380" href="#office" alt="Open Office" title="Open Office — 80 desks" />
    </map>
    <figcaption>Hover over a room to see its <code>title</code> tooltip. Click to navigate.</figcaption>
  </figure>
  <output aria-live="polite">Click a room&hellip;</output>
  <script>
    const status = document.querySelector('output');
    document.querySelectorAll('area').forEach((area) => {
      area.addEventListener('click', (e) => {
        e.preventDefault();
        status.replaceChildren('Clicked: ', Object.assign(document.createElement('strong'), { textContent: area.alt }), ' — ' + area.title);
      });
    });
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
