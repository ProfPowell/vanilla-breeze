<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>data-accept presets</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <form>
    <layout-grid data-layout-min="m" data-layout-gap="l">
      <form-field>
        <label for="acc-phone">Phone</label>
        <input type="text" id="acc-phone" name="phone" data-accept="phone" autocomplete="tel" aria-describedby="acc-phone-hint" />
        <output id="acc-phone-hint" class="hint" for="acc-phone">Digits, +, parentheses, hyphens and spaces.</output>
      </form-field>
      <form-field>
        <label for="acc-date">Date</label>
        <input type="text" id="acc-date" name="date" data-accept="date" aria-describedby="acc-date-hint" />
        <output id="acc-date-hint" class="hint" for="acc-date">Digits with / - or . between them.</output>
      </form-field>
      <form-field>
        <label for="acc-digits">Verification code</label>
        <input type="text" id="acc-digits" name="code" data-accept="digits" maxlength="6" autocomplete="one-time-code" aria-describedby="acc-digits-hint" />
        <output id="acc-digits-hint" class="hint" for="acc-digits">Digits only. Pasted letters are dropped.</output>
      </form-field>
      <form-field>
        <label for="acc-letters">Given name</label>
        <input type="text" id="acc-letters" name="given" data-accept="letters" autocomplete="given-name" aria-describedby="acc-letters-hint" />
        <output id="acc-letters-hint" class="hint" for="acc-letters">Letters in any script (Zoë, Жанна, 美咲).</output>
      </form-field>
    </layout-grid>
    <button type="submit">Save</button>
  </form>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
