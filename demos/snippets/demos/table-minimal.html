<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Table Minimal Variant</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <table data-variant="minimal">
    <caption>Monthly signups by plan</caption>
    <thead>
      <tr><th scope="col">Plan</th><th scope="col" data-align="center">Tier</th><th scope="col" data-numeric>January</th><th scope="col" data-numeric>February</th></tr>
    </thead>
    <tbody>
      <tr><th scope="row">Starter</th><td data-align="center">1</td><td data-numeric>1,204</td><td data-numeric>1,388</td></tr>
      <tr><th scope="row">Team</th><td data-align="center">2</td><td data-numeric>412</td><td data-numeric>455</td></tr>
      <tr><th scope="row">Enterprise</th><td data-align="center">3</td><td data-numeric>37</td><td data-numeric>41</td></tr>
    </tbody>
    <tfoot>
      <tr><th scope="row">Total</th><td></td><td data-numeric>1,653</td><td data-numeric>1,884</td></tr>
    </tfoot>
  </table>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
