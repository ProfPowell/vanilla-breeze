<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Main Narrow</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: 0; background: var(--color-surface-raised); }
  </style>

<body>
  <main class="narrow">
    <h1>Narrow Layout</h1>

  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
