<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Data Ticker Effect</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    .hero-stat { font-size: var(--font-size-2xl); }
    .stat { font-size: var(--font-size-xl); }
    #customers { --vb-ticker-duration: 2000; }
    .stat data { --vb-ticker-duration: 1500; }
    #themes { --vb-ticker-duration: 1000; }
    #uptime { --vb-ticker-decimals: 1; }
  </style>
</head>
<body>
  <h1>Data Ticker Effect</h1>
  <layout-stack data-layout-gap="l">
    <section>
      <h2>Animated counter (ticker effect)</h2>
      <p class="hero-stat">
        <data id="customers" value="50000" data-effect="ticker" data-trigger="scroll">50,000</data> customers served
      </p>
    </section>
    <section>
      <h2>Multiple counters</h2>
      <layout-grid data-layout-gap="m" data-layout-min="s">
        <article>
          <p class="stat"><data id="uptime" value="99.9" data-effect="ticker" data-trigger="scroll">99.9</data>%</p>
          <p>Uptime</p>
        </article>
        <article>
          <p class="stat"><data value="2400" data-effect="ticker" data-trigger="scroll">2,400</data>+</p>
          <p>Components</p>
        </article>
        <article>
          <p class="stat"><data id="themes" value="15" data-effect="ticker" data-trigger="scroll">15</data></p>
          <p>Themes</p>
        </article>
      </layout-grid>
    </section>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
