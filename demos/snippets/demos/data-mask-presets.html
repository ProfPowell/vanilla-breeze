<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mask presets</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    body > * { max-inline-size: 30rem; }
  </style>
</head>
<body>
  <layout-stack data-layout-gap="m">
    <form-field>
      <label for="phone">Phone (US)</label>
      <input type="tel" id="phone" name="phone" data-mask="phone" placeholder="(555) 123-4567" autocomplete="tel" />
    </form-field>
    <form-field>
      <label for="card">Card number</label>
      <input type="text" id="card" name="card" data-mask="credit-card" placeholder="1234 5678 9012 3456" autocomplete="cc-number" />
    </form-field>
    <form-field>
      <label for="date">Date (MM/DD/YYYY)</label>
      <input type="text" id="date" name="date" data-mask="date" placeholder="MM/DD/YYYY" />
    </form-field>
    <form-field>
      <label for="ssn">SSN</label>
      <input type="text" id="ssn" name="ssn" data-mask="ssn" placeholder="123-45-6789" />
    </form-field>
    <form-field>
      <label for="zip">ZIP code</label>
      <input type="text" id="zip" name="zip" data-mask="zip" placeholder="12345" autocomplete="postal-code" />
    </form-field>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
