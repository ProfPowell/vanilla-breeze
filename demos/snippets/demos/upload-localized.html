<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>data-upload localized</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <form lang="de">
    <form-field>
      <label for="up-de">Lebenslauf</label>
      <input type="file" id="up-de" name="lebenslauf" data-upload accept=".pdf"
        data-label-prompt="Datei hierher ziehen oder"
        data-label-browse="durchsuchen"
        data-label-files="Ausgewählte Dateien"
        data-label-rejected="Nicht akzeptiert: {files}"
        data-label-single="Nur eine Datei erlaubt. Behalten: {file}." />
    </form-field>
    <button type="submit">Hochladen</button>
  </form>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
