<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>layout-card Multiple Content Children</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); max-inline-size: 25rem; }
  </style>
</head>
<body>
  <h1>layout-card Multiple Content Children</h1>
  <layout-stack data-layout-gap="l">
    <layout-card>
      <header><h2>Release notes</h2></header>
      <p>Version 2.4 ships offline drafts and faster search.</p>
      <section>
        <h3>Fixed</h3>
        <p>Attachments no longer duplicate after a sync conflict.</p>
      </section>
      <footer><button type="button">Read more</button></footer>
    </layout-card>

    <layout-card data-variant="outlined">
      <h2 slot="header">Slot-only card</h2>
      <p slot="content">No header, section or footer element: the slots alone switch the card to structured mode.</p>
    </layout-card>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
