<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Switch states</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    body > * { max-inline-size: 30rem; }
  </style>
</head>
<body>
  <layout-stack data-layout-gap="m">
    <label><input type="checkbox" data-switch name="on" checked /> On by default</label>
    <label><input type="checkbox" data-switch name="locked-off" disabled /> Disabled, off</label>
    <label><input type="checkbox" data-switch name="locked-on" disabled checked /> Disabled, on</label>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
