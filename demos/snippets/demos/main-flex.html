<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Main Flex</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: 0; background: var(--color-surface-raised); display: flex; flex-direction: column; min-block-size: 100dvh; }
    main { background: var(--color-surface); }
  </style>
</head>
<body>
  <header class="site">
    <strong>Site</strong>
  </header>
  <main class="flex padded contained">
    <h1>Flex Main</h1>
    <p>The body is a flex column, so <code>main.flex</code> grows to fill the space between header and footer. The footer stays at the bottom even when the content is short.</p>
  </main>
  <footer class="minimal">
    <p>Site Footer</p>
  </footer>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
