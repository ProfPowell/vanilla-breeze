<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Section hero bleed</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: 0; background: var(--color-surface); } section.hero[data-bleed] { background: var(--color-surface-raised); } body > header { padding: var(--size-m) var(--size-l); }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Site">
      <layout-cluster data-layout-gap="m">
        <strong>Acme</strong>
        <a href="#features">Features</a>
        <a href="#pricing">Pricing</a>
      </layout-cluster>
    </nav>
  </header>
  <main>
    <section class="hero" data-bleed>
      <h1>Hero behind the header</h1>
      <p>The hero background extends up behind the site header, and the header turns transparent.</p>
    </section>
    <section data-padding>
      <h2>Next section</h2>
      <p>Set <code>data-scrolled</code> on the root element from your own script to give the header its surface back once the hero leaves the viewport.</p>
    </section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
