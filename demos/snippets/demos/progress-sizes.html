<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Progress Sizes</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <layout-center data-layout-max="narrow">
  <layout-stack data-layout-gap="m">
    <form-field>
      <label for="progress-xs">.xs (extra small)</label>
      <progress id="progress-xs" class="xs" value="60" max="100">60%</progress>
    </form-field>
    <form-field>
      <label for="progress-s">.s (small)</label>
      <progress id="progress-s" class="s" value="60" max="100">60%</progress>
    </form-field>
    <form-field>
      <label for="progress-m">Default</label>
      <progress id="progress-m" value="60" max="100">60%</progress>
    </form-field>
    <form-field>
      <label for="progress-l">.l (large)</label>
      <progress id="progress-l" class="l" value="60" max="100">60%</progress>
    </form-field>
  </layout-stack>
  </layout-center>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
