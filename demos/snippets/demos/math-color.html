<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MathML colour</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <p>Math inherits the surrounding text colour, and <code>mathcolor</code> still works on individual tokens:</p>
  <math display="block">
    <mi mathcolor="#c0392b">a</mi><mo>+</mo><mi mathcolor="#1f6feb">b</mi><mo>=</mo><mi>c</mi>
  </math>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
