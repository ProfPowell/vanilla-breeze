<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grid: Element and Attribute Forms</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    .demo-host { outline: var(--border-width-thin) dashed var(--color-border); outline-offset: var(--size-3xs); }

  </style>
</head>
<body>
  <h1>Grid: Element and Attribute Forms</h1>
  <layout-stack data-layout-gap="l">
    <section aria-labelledby="grid-el-heading">
      <h2 id="grid-el-heading">Element form</h2>
      <layout-grid id="grid-element" class="demo-host" data-layout-min="s" data-layout-gap="s">
        <layout-card data-variant="outlined" data-padding="s"><p>Alpha</p></layout-card>
        <layout-card data-variant="outlined" data-padding="s"><p>Beta</p></layout-card>
        <layout-card data-variant="outlined" data-padding="s"><p>Gamma</p></layout-card>
        <layout-card data-variant="outlined" data-padding="s"><p>Delta</p></layout-card>
      </layout-grid>
    </section>

    <section aria-labelledby="grid-attr-heading">
      <h2 id="grid-attr-heading">Attribute form</h2>
      <ul id="grid-attribute" class="unstyled demo-host" data-layout="grid" data-layout-min="s" data-layout-gap="s">
        <li><layout-card data-variant="outlined" data-padding="s"><p>Alpha</p></layout-card></li>
        <li><layout-card data-variant="outlined" data-padding="s"><p>Beta</p></layout-card></li>
        <li><layout-card data-variant="outlined" data-padding="s"><p>Gamma</p></layout-card></li>
        <li><layout-card data-variant="outlined" data-padding="s"><p>Delta</p></layout-card></li>
      </ul>
    </section>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
