<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nav — Right to left</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <h1>Nav — Right to left</h1>
  <layout-stack data-layout-gap="xl" dir="rtl" lang="ar">
    <nav class="breadcrumb" aria-label="مسار التنقل">
      <ol>
        <li><a href="#">الرئيسية</a></li>
        <li><a href="#">المستندات</a></li>
        <li><span aria-current="page">التنقل</span></li>
      </ol>
    </nav>
    <nav class="breadcrumb" data-separator="arrow" aria-label="مسار التنقل بالأسهم">
      <ol>
        <li><a href="#">الرئيسية</a></li>
        <li><a href="#">المستندات</a></li>
        <li><span aria-current="page">التنقل</span></li>
      </ol>
    </nav>
    <nav class="steps" data-labels="below" aria-label="تقدم الإعداد">
      <ol>
        <li data-completed>الحساب</li>
        <li aria-current="step">التفاصيل</li>
        <li>التفضيلات</li>
        <li>المراجعة</li>
      </ol>
    </nav>
    <nav class="steps" data-direction="vertical" aria-label="تقدم البدء">
      <ol>
        <li data-completed>إنشاء مساحة العمل</li>
        <li aria-current="step">دعوة الفريق</li>
        <li>ربط الأدوات</li>
      </ol>
    </nav>
    <nav class="pagination" data-variant="compact" aria-label="ترقيم الصفحات">
      <ul>
        <li><a href="#" data-prev>السابق</a></li>
        <li><a href="#">1</a></li>
        <li><a href="#" aria-current="page">2</a></li>
        <li><a href="#">3</a></li>
        <li><a href="#" data-next>التالي</a></li>
      </ul>
    </nav>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
