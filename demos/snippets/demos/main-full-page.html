<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Main Full Page</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: 0; background: var(--color-surface); }
  </style>
</head>
<body data-page-layout="stack" data-layout-gap="none">
  <header class="site">
    <strong>Site</strong>
    <nav class="horizontal pills" aria-label="Main">
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
      </ul>
    </nav>
  </header>
  <main class="contained padded">
    <h1>Page Title</h1>
    <p>Page content with proper semantic structure. <code>data-page-layout="stack"</code> puts each landmark in its grid row and gives the main row the leftover height, so the footer sits at the bottom.</p>
  </main>
  <footer class="minimal">
    <p>Footer content</p>
  </footer>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
