<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>data-upload multiple</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <form>
    <form-field>
      <label for="up-gallery">Upload images</label>
      <input type="file" id="up-gallery" name="gallery" data-upload accept="image/*" multiple />
    </form-field>
    <p><button type="submit">Save</button> <button type="reset">Reset</button></p>
  </form>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
