<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Layout Badge - Shapes</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <layout-stack data-layout-gap="m">
    <section aria-labelledby="shapes-ltr">
      <p id="shapes-ltr"><strong>Shapes</strong></p>
      <layout-cluster data-layout-gap="s">
        <layout-badge data-shape="ribbon" data-color="brand">Ribbon</layout-badge>
        <layout-badge data-shape="notch" data-color="brand">Notch</layout-badge>
        <layout-badge data-shape="flag" data-color="brand">Flag</layout-badge>
        <layout-badge data-shape="double-arrow" data-color="brand">Double arrow</layout-badge>
        <layout-badge data-shape="stamp" data-color="brand">Stamp</layout-badge>
      </layout-cluster>
    </section>
    <section aria-labelledby="shapes-colors">
      <p id="shapes-colors"><strong>Colours, sizes and variants combine</strong></p>
      <layout-cluster data-layout-gap="s">
        <layout-badge data-shape="ribbon" data-color="error" data-size="l">Sale</layout-badge>
        <layout-badge data-shape="flag" data-color="success">In stock</layout-badge>
        <layout-badge data-shape="stamp" data-color="accent" data-size="l">Certified</layout-badge>
        <layout-badge data-shape="notch" data-variant="subtle" data-color="info">Beta</layout-badge>
        <layout-badge data-shape="double-arrow" data-color="secondary" data-size="s">Step 2</layout-badge>
      </layout-cluster>
    </section>
    <section aria-labelledby="shapes-long">
      <p id="shapes-long"><strong>Long labels keep clear of the notch</strong></p>
      <layout-cluster data-layout-gap="s">
        <layout-badge data-shape="ribbon" data-color="brand">A considerably longer ribbon label</layout-badge>
        <layout-badge data-shape="flag" data-color="brand">Shipping to every region this week</layout-badge>
      </layout-cluster>
    </section>
    <section dir="rtl" lang="he" aria-labelledby="shapes-rtl">
      <p id="shapes-rtl"><strong>מימין לשמאל</strong></p>
      <layout-cluster data-layout-gap="s">
        <layout-badge data-shape="ribbon" data-color="brand">מבצע מיוחד</layout-badge>
        <layout-badge data-shape="notch" data-color="brand">חדש</layout-badge>
        <layout-badge data-shape="flag" data-color="brand">מומלץ</layout-badge>
      </layout-cluster>
    </section>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
