<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>data-count: word count</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body {
      padding: var(--size-l);

  <script type="module" src="/src/main.js"></script>
</body>
</html>
