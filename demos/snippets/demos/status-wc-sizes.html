<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>status-wc sizes</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <layout-cluster data-layout-gap="m" data-layout-align="center">
    <status-wc data-variant="online" data-size="xs">xs</status-wc>
    <status-wc data-variant="online" data-size="sm">sm</status-wc>
    <status-wc data-variant="online" data-size="md">md (default)</status-wc>
    <status-wc data-variant="online" data-size="lg">lg</status-wc>
  </layout-cluster>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
