<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Range in a right-to-left page</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    body > * { max-inline-size: 30rem; }
  </style>
</head>
<body>
  <form-field lang="ar" dir="rtl">
    <label for="volume-ar">مستوى الصوت</label>
    <input type="range" id="volume-ar" name="volume" data-range data-bubble data-suffix="٪" min="0" max="100" value="30" list="volume-ar-ticks" />
    <datalist id="volume-ar-ticks">
      <option value="0" label="صامت"></option>
      <option value="100" label="أقصى"></option>
    </datalist>
  </form-field>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
