<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stepper with decimal steps</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    body > * { max-inline-size: 30rem; }
  </style>
</head>
<body>
  <form-field>
    <label for="weight">Weight (kg)</label>
    <input type="number" id="weight" name="weight" min="0" max="10" step="0.5" value="1.5" data-stepper />
  </form-field>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
