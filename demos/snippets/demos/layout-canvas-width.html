<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Layout Canvas: width constraints</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    .demo-label { color: var(--color-text-muted); font-size: var(--font-size-s); }
  </style>
</head>
<body>
  <h1>Layout Canvas: width constraints</h1>
  <layout-stack data-layout-gap="xl">
    <section>
      <p class="demo-label"><strong>data-max="narrow"</strong> (<code>--content-narrow</code>, 40rem)</p>
      <article data-canvas data-max="narrow">
        <h2>Narrow canvas</h2>
        <p>Constrained to --content-narrow, centered on the page.</p>
      </article>
    </section>

    <section>
      <p class="demo-label"><strong>data-max="normal"</strong> (<code>--content-normal</code>, 60rem)</p>
      <article data-canvas data-max="normal">
        <h2>Content width</h2>
        <p>Constrained to --content-normal (fluid under data-fluid).</p>
      </article>
    </section>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
