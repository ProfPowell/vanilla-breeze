<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Custom mask patterns</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    body > * { max-inline-size: 30rem; }
  </style>
</head>
<body>
  <layout-stack data-layout-gap="m">
    <form-field>
      <label for="plate">License plate</label>
      <input type="text" id="plate" name="plate" data-mask="custom" data-pattern="AAA-####" placeholder="ABC-1234" />
    </form-field>
    <form-field>
      <label for="product-key">Product key</label>
      <input type="text" id="product-key" name="key" data-mask="custom" data-pattern="****-****-****" placeholder="A1B2-C3D4-E5F6" />
    </form-field>
    <form-field>
      <label for="intl">Phone with country code</label>
      <input type="tel" id="intl" name="intl" data-mask="custom" data-pattern="+1 ###-###-####" placeholder="+1 555-123-4567" />
    </form-field>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
