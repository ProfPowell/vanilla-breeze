<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dl-item Multiple Values</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); max-inline-size: 65ch; }
  </style>
</head>
<body>
  <dl data-variant="horizontal" data-bordered>
    <dl-item>
      <dt>Phone Numbers</dt>
      <dd>+1 (555) 123-4567</dd>
      <dd>+1 (555) 987-6543</dd>
    </dl-item>
    <dl-item>
      <dt>Email</dt>
      <dt>Contact</dt>
      <dd>alexandra.chen@example.com</dd>
    </dl-item>
    <dl-item>
      <dt>Languages</dt>
      <dd>English</dd>
      <dd>Mandarin</dd>
      <dd>Spanish</dd>
    </dl-item>
  </dl>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
