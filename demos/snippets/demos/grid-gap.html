<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grid Gap Variants</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <layout-grid data-layout-min="l" data-layout-gap="l">
    <section>
      <p><strong>data-layout-gap="xs"</strong></p>
      <layout-grid data-layout-min="xs" data-layout-gap="xs">
        <layout-card data-padding="s">1</layout-card>
        <layout-card data-padding="s">2</layout-card>
        <layout-card data-padding="s">3</layout-card>
        <layout-card data-padding="s">4</layout-card>
      </layout-grid>
    </section>

    <section>
      <p><strong>data-layout-gap="l"</strong></p>
      <layout-grid data-layout-min="xs" data-layout-gap="l">
        <layout-card data-padding="s">1</layout-card>
        <layout-card data-padding="s">2</layout-card>
        <layout-card data-padding="s">3</layout-card>
        <layout-card data-padding="s">4</layout-card>
      </layout-grid>
    </section>
  </layout-grid>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
