<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Layout Text - Full-width Breakout</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    main { border: var(--border-width-thin) dashed var(--color-border); padding: var(--size-m); }
  </style>
</head>
<body>
  <main>
    <layout-text data-layout-centered data-layout-measure="narrow">
      <h1>Full-width Breakout</h1>
      <p>The text keeps a narrow, centred measure. The dashed line is the <code>&lt;main&gt;</code> element, the nearest query container.</p>
      <figure data-bleed>
        <img src="/src/assets/placeholders/photo-gear-care-hero-1200x600.svg" alt="Placeholder landscape" />
        <figcaption>A direct child with <code>data-bleed</code> spans the full width of <code>&lt;main&gt;</code>.</figcaption>
      </figure>
      <p>The flow returns to the measure afterwards. Bleed never causes horizontal scrolling because it measures the container, not the viewport.</p>
    </layout-text>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
