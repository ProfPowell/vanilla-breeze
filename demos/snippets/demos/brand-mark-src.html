<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brand Mark Image Logo</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <h1>Image logo via src</h1>
  <layout-stack data-layout-gap="l">
    <section>
      <h2>Image only</h2>
      <p>The authored name stays in the page as the accessible name; only the logo shows.</p>
      <a href="/">
        <brand-mark src="/docs/snippets/demos/assets/brand-mark-logo-light.svg">Acme Inc</brand-mark>
      </a>
    </section>
    <section>
      <h2>Custom height</h2>
      <brand-mark src="/docs/snippets/demos/assets/brand-mark-logo-light.svg" height="56">Acme Inc</brand-mark>
    </section>
    <section>
      <h2>Compact logo on narrow screens</h2>
      <p>Below 48rem the icon replaces the full logo.</p>
      <brand-mark src="/docs/snippets/demos/assets/brand-mark-logo-light.svg" src-compact="/docs/snippets/demos/assets/brand-mark-icon.svg">Acme Inc</brand-mark>
    </section>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
