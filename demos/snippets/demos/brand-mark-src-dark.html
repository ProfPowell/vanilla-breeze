<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brand Mark Dark Logo</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); color: var(--color-text); }
  </style>
</head>
<body>
  <h1>Dark-mode logo via src-dark</h1>
  <layout-stack data-layout-gap="l">
    <fieldset data-segmented>
      <legend class="visually-hidden">Color mode</legend>
      <label><input type="radio" name="mode" value="auto" checked />Auto</label>
      <label><input type="radio" name="mode" value="light" />Light</label>
      <label><input type="radio" name="mode" value="dark" />Dark</label>
    </fieldset>
    <brand-mark
      src="/docs/snippets/demos/assets/brand-mark-logo-light.svg"
      src-dark="/docs/snippets/demos/assets/brand-mark-logo-dark.svg">Acme Inc</brand-mark>
  </layout-stack>
  <script type="module">
    for (const radio of document.querySelectorAll('input[name="mode"]')) {
      radio.addEventListener('change', () => {
        if (radio.value === 'auto') document.documentElement.removeAttribute('data-mode');
        else document.documentElement.setAttribute('data-mode', radio.value);
      });
    }
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
