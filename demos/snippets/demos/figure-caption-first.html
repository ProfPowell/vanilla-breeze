<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Caption-first Figures</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <section data-layout="grid" data-layout-min="m" data-layout-gap="l">
    <figure>
      <figcaption>Caption before the image.</figcaption>
      <img src="/src/assets/placeholders/photo-figcaption-2-500x301.svg" alt="Ocean view" />
    </figure>
    <figure class="bordered">
      <figcaption>Bordered: the divider moves below the caption.</figcaption>
      <img src="/src/assets/placeholders/photo-figcaption-3-500x280.svg" alt="Coastal cliffs" />
    </figure>
    <figure class="code">
      <figcaption>utils/math.js</figcaption>
      <pre><code>const sum = (a, b) =&gt; a + b;</code></pre>
    </figure>
  </section>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
