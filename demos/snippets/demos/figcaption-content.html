<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Figcaption Content</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <section data-layout="grid" data-layout-min="m" data-layout-gap="l">
    <figure>
      <img src="/src/assets/placeholders/photo-figcaption-8-500x301.svg" alt="Mountain landscape at sunset" />
      <figcaption><strong>Figure 1:</strong> Mountain landscape at sunset.</figcaption>
    </figure>
    <figure>
      <img src="/src/assets/placeholders/photo-figcaption-9-500x302.svg" alt="Lighthouse on a rocky point" />
      <figcaption>Photo by <a href="https://example.com/photographers/jane-doe">Jane Doe</a>.</figcaption>
    </figure>
    <figure>
      <img src="/src/assets/placeholders/photo-figcaption-10-500x303.svg" alt="Woodblock print of a large wave" />
      <figcaption><cite>The Great Wave off Kanagawa</cite> by Hokusai, c. 1831. <small>Source: Metropolitan Museum of Art</small></figcaption>
    </figure>
    <figure class="bordered">
      <img src="/src/assets/placeholders/photo-figcaption-12-500x305.svg" alt="Team standing on a lakeside dock" />
      <figcaption>
        <p><strong>Team photo at annual retreat</strong></p>
        <p>Left to right: Alice (Engineering), Bob (Design), Carol (Product).</p>
      </figcaption>
    </figure>
  </section>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
