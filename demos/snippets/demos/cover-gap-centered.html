<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cover Gap and Centered</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    .demo-cover { background: var(--color-surface-raised); }
  </style>
</head>
<body>
  <h1>Cover Gap and Centered</h1>
  <layout-grid data-layout-min="m" data-layout-gap="m">
    <section aria-labelledby="cover-plain">
      <h2 id="cover-plain">No modifiers</h2>
      <!-- [html-validate-disable-next no-inline-style: --layout-min is the documented one-off height] -->
      <layout-cover class="demo-cover" style="--layout-min: 14rem">
        <header><small>Header</small></header>
        <p data-layout-principal>Principal, start-aligned</p>
        <footer><small>Footer</small></footer>
      </layout-cover>
    </section>

    <section aria-labelledby="cover-centered">
      <h2 id="cover-centered">data-layout-centered</h2>
      <!-- [html-validate-disable-next no-inline-style: --layout-min is the documented one-off height] -->
      <layout-cover class="demo-cover" data-layout-centered style="--layout-min: 14rem">
        <header><small>Header (full width)</small></header>
        <p data-layout-principal>Principal, centred</p>
        <footer><small>Footer (full width)</small></footer>
      </layout-cover>
    </section>

    <section aria-labelledby="cover-gap">
      <h2 id="cover-gap">data-layout-gap="l" with min="auto"</h2>
      <layout-cover class="demo-cover" data-layout-min="auto" data-layout-gap="l">
        <header><small>Header</small></header>
        <p data-layout-principal>Principal</p>
        <footer><small>Footer</small></footer>
      </layout-cover>
    </section>
  </layout-grid>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
