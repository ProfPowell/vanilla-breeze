<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>data-wizard: localised labels</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body {
      padding: var(--size-l);
      background: var(--color-surface);
    }
    /* The CSS step counter is localised with custom properties */
    form[data-wizard]:lang(fr) {
      --wizard-label-step: "Étape ";
      --wizard-label-of: " sur ";
    }
  </style>
</head>
<body>
  <!-- The wizard injects Back / Next / Submit (named by data-label-*) -->
  <!-- [html-validate-disable-next wcag/h32] -->
  <form data-wizard
        data-label-back="Retour"
        data-label-next="Suivant"
        data-label-submit="Envoyer"
        data-label-step="Étape {n}"
        data-label-status="Étape {current} sur {total} : {name}"
        data-label-completed="Revenir à {name} (terminée)">
    <progress data-wizard-progress></progress>
    <fieldset data-wizard-step>
      <legend>Compte</legend>
      <form-field>
        <label for="fr-email">Courriel</label>
        <input type="email" id="fr-email" name="email" autocomplete="email" required/>
      </form-field>
    </fieldset>
    <fieldset data-wizard-step>
      <legend>Profil</legend>
      <form-field>
        <label for="fr-name">Nom complet</label>
        <input type="text" id="fr-name" name="fullname" autocomplete="name"/>
      </form-field>
    </fieldset>
  </form>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
