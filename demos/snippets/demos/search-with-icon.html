<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Search With Icon</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <search class="with-icon rounded">
    <!-- [html-validate-disable-next wcag/h32 -- single-field search form: Enter submits it (implicit submission), and a visible button would defeat the compact layout] -->
    <form method="get">
      <icon-wc name="search" size="sm"></icon-wc>
      <input type="search" name="q" placeholder="Search..." aria-label="Search" />
    </form>
  </search>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
