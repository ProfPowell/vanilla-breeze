<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stack: Element and Attribute Forms</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    .demo-host { outline: var(--border-width-thin) dashed var(--color-border); outline-offset: var(--size-3xs); }

  </style>
</head>
<body>
  <h1>Stack: Element and Attribute Forms</h1>
  <layout-grid data-layout-min="l" data-layout-gap="l">
    <section aria-labelledby="stack-el-heading">
      <h2 id="stack-el-heading">Element form</h2>
      <form action="#" method="get">
        <layout-stack id="stack-element" class="demo-host" data-layout-gap="s">
          <label for="stack-el-q">Search</label>
          <input type="search" id="stack-el-q" name="q" />
          <button type="submit">Go</button>
        </layout-stack>
      </form>
    </section>

    <section aria-labelledby="stack-attr-heading">
      <h2 id="stack-attr-heading">Attribute form</h2>
      <form id="stack-attribute" class="demo-host" data-layout="stack" data-layout-gap="s" action="#" method="get">
        <label for="stack-attr-q">Search</label>
        <input type="search" id="stack-attr-q" name="q" />
        <button type="submit">Go</button>
      </form>
    </section>
  </layout-grid>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
