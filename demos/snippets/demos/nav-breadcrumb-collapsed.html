<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nav Breadcrumb Collapsed and Truncated</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <layout-stack data-layout-gap="m">
    <nav class="breadcrumb" data-collapsed aria-label="Collapsed breadcrumb">
      <ol>
        <li><a href="#">Home</a></li>
        <li><a href="#">Level 1</a></li>
        <li><a href="#">Level 2</a></li>
        <li><a href="#">Level 3</a></li>
        <li><a href="#">Level 4</a></li>
        <li><span aria-current="page">Current Page</span></li>
      </ol>
    </nav>
    <nav class="breadcrumb" aria-label="Truncated breadcrumb">
      <ol>
        <li><a href="#">Home</a></li>
        <li data-truncated><a href="#">A very long section title that will not fit</a></li>
        <li><span aria-current="page">Current Page</span></li>
      </ol>
    </nav>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
