<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>status-wc custom variant</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    status-wc[data-variant="deploying"] {
      --status-dot-color: var(--color-info);
      --status-animation: status-pulse var(--status-pulse-duration) ease-in-out infinite;
    }
  </style>
</head>
<body>
  <layout-cluster data-layout-gap="m" data-layout-align="center">
    <status-wc data-variant="deploying">Deploying</status-wc>
    <status-wc data-variant="deploying" data-position="only" data-label-deploying="Deploying"></status-wc>
  </layout-cluster>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
