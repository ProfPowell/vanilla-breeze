<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rating — JS enhancement</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <layout-cluster data-layout-gap="m" data-layout-align="center">
    <fieldset data-rating data-effect="rating" id="enhanced-rating">
      <legend>Rate this</legend>
      <label><input type="radio" name="demo-js" value="1" aria-label="1 star" />&#9733;</label>
      <label><input type="radio" name="demo-js" value="2" aria-label="2 stars" />&#9733;</label>
      <label><input type="radio" name="demo-js" value="3" aria-label="3 stars" />&#9733;</label>
      <label><input type="radio" name="demo-js" value="4" aria-label="4 stars" />&#9733;</label>
      <label><input type="radio" name="demo-js" value="5" aria-label="5 stars" />&#9733;</label>
    </fieldset>
    <output id="enhanced-output">No rating</output>
  </layout-cluster>

  <script type="module" src="/src/main.js"></script>
  <script type="module">
    document.getElementById('enhanced-rating').addEventListener('rating:change', (e) => {
      document.getElementById('enhanced-output').textContent =
        e.detail.value > 0 ? `Rating: ${e.detail.value}` : 'No rating';
    });
  </script>
</body>
</html>
