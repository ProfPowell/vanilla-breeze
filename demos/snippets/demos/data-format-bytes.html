<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Data Byte Formatting</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <h1>Byte formatting</h1>
  <table>
    <thead>
      <tr><th scope="col">Bytes (value)</th><th scope="col">Binary (default, ÷1024)</th><th scope="col">Decimal (data-unit="decimal", ÷1000)</th></tr>
    </thead>
    <tbody>
      <tr>
        <td><data value="1000000">1000000</data></td>
        <td><data value="1000000" data-format-bytes="1">977 KB</data></td>
        <td><data value="1000000" data-format-bytes="1" data-unit="decimal">1 MB</data></td>
      </tr>
      <tr>
        <td><data value="1536000">1536000</data></td>
        <td><data value="1536000" data-format-bytes="1">1.5 MB</data></td>
        <td><data value="1536000" data-format-bytes="1" data-unit="decimal">1.5 MB</data></td>
      </tr>
      <tr>
        <td><data value="5368709120">5368709120</data></td>
        <td><data value="5368709120" data-format-bytes>5 GB</data></td>
        <td><data value="5368709120" data-format-bytes data-unit="decimal">5 GB</data></td>
      </tr>
      <tr>
        <td><data value="2500000">2500000</data></td>
        <td><data value="2500000" data-format-bytes="2" data-locale="de-DE">2,38 MB</data></td>
        <td><data value="2500000" data-format-bytes="2" data-unit="decimal" data-locale="de-DE">2,50 MB</data></td>
      </tr>
    </tbody>
  </table>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
