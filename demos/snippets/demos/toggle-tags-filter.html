<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>data-toggle-tags filter form</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <form data-layout="stack" data-layout-gap="m">
    <fieldset data-toggle-tags>
      <legend>Filter by category</legend>
      <label><input type="checkbox" name="cat" value="design" /> Design</label>
      <label><input type="checkbox" name="cat" value="dev" /> Development</label>
      <label><input type="checkbox" name="cat" value="marketing" /> Marketing</label>
      <label><input type="checkbox" name="cat" value="product" /> Product</label>
    </fieldset>
    <p><button type="submit">Apply filters</button> <button type="reset">Clear</button></p>
  </form>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
