<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR Border Alternative</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    .bordered {
      border-block-end: var(--border-width-thin) solid var(--color-border);
      padding-block-end: var(--size-l);
      margin-block-end: var(--size-l);
    }
  </style>
</head>
<body>
  <p class="bordered">Content with a bottom border for visual separation only.</p>
  <p>More content below the border.</p>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
