<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Status Message With Dismiss</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <status-message data-variant="info">
    <section data-content>
      <strong data-title>Dismissable Alert</strong>
      <p data-description>Activate the &#x2715; button to dismiss this alert. Focus moves to the next control.</p>
    </section>
    <button data-dismiss type="button" aria-label="Dismiss">&#x2715;</button>
  </status-message>

  <p><button type="button" id="restore">Show the message again</button></p>

  <script type="module" src="/src/main.js"></script>
  <script type="module" src="/src/custom-elements/status-message/logic.js"></script>
  <script type="module">
    document.getElementById('restore').addEventListener('click', () => {
      document.querySelector('status-message').hidden = false;
    });
  </script>
</body>
</html>
