<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>data-show-when: radio group</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body {
      padding: var(--size-l);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <form data-layout="stack" data-layout-gap="m">
    <fieldset>
      <legend>Delivery</legend>
      <label><input type="radio" name="delivery" value="pickup" checked/> Pickup</label>
      <label><input type="radio" name="delivery" value="ship"/> Ship</label>
    </fieldset>
    <fieldset data-show-when="delivery=ship">
      <legend>Shipping address</legend>
      <form-field>
        <label for="address">Street address</label>
        <input type="text" id="address" name="address" autocomplete="address-line1" required/>
      </form-field>
    </fieldset>
    <button type="submit">Save</button>
  </form>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
