<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Figcaption in Context</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <section data-layout="grid" data-layout-min="m" data-layout-gap="l">
    <figure class="code">
      <pre><code>const sum = (a, b) =&gt; a + b;
console.log(sum(2, 3)); // 5</code></pre>
      <figcaption>utils/math.js</figcaption>
    </figure>
    <figure class="quote">
      <blockquote><p>Design is not just what it looks like and feels like. Design is how it works.</p></blockquote>
      <figcaption>Steve Jobs</figcaption>
    </figure>
    <figure>
      <video controls preload="none" poster="/src/assets/placeholders/photo-figcaption-13-500x280.svg">
        <p>Your browser does not support the video element.</p>
      </video>
      <figcaption><strong>Video:</strong> Product demo walkthrough (5:32). <a href="/docs/elements/native/track/">Transcript and captions</a></figcaption>
    </figure>
  </section>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
