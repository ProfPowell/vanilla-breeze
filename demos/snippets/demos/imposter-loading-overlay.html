<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Imposter Loading Overlay</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    .demo-container {
      position: relative;
      block-size: 150px;
      background: var(--color-surface-alt);
      border-radius: var(--radius-m);
    }
    .loading-text {
      color: var(--color-text-muted);
      font-size: var(--font-size-s);
    }
  </style>
</head>
<body>
  <section class="demo-container">
    <layout-imposter data-layout-contain data-layout-margin="s">
      <layout-stack data-layout-gap="s" data-layout-align="center" role="status">
        <loading-spinner aria-hidden="true"></loading-spinner>
        <span class="loading-text">Loading&hellip;</span>
      </layout-stack>
    </layout-imposter>
  </section>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
