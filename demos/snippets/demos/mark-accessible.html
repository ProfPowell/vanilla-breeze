<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Accessible Mark Usage</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <layout-stack data-layout-gap="m">
    <p>Reviewer notes on the draft: <mark class="error"><span class="visually-hidden">Problem: </span>the date range overlaps last quarter</mark>.</p>
    <p>The summary <mark class="success"><span class="visually-hidden">Agreed: </span>reads clearly</mark> and needs no change.</p>
    <p>The forecast <mark class="warning"><span class="visually-hidden">Query: </span>assumes a flat exchange rate</mark>; confirm with finance.</p>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
