<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Imposter Card Status</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    .status-card {
      position: relative;
      inline-size: 16rem;
    }
    .status-badge {
      background: var(--color-success);
      color: var(--color-text-on-success-auto, white);
      padding: var(--size-2xs) var(--size-xs);
      border-radius: var(--radius-s);
      font-size: var(--font-size-xs);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <layout-card data-variant="outlined" data-padding="l" class="status-card">
    <layout-stack data-layout-gap="s">
      <strong>Project Alpha</strong>
      <p>Last updated yesterday</p>
    </layout-stack>
    <layout-imposter data-layout-position="top-end" data-layout-margin="m">
      <span class="status-badge">Active</span>
    </layout-imposter>
  </layout-card>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
