<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Responsive Iframe Embeds</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <h1>Responsive Iframe Embeds</h1>
  <layout-stack data-layout-gap="xl">
    <section>
      <h2>data-ratio on the iframe</h2>
      <p>The block size follows the used width. <code>width</code> is the preferred (maximum) width; without it the iframe fills its container.</p>
      <layout-grid data-layout-gap="m" data-layout-min="s">
        <iframe src="/docs/snippets/demos/iframe-content.html" title="16:9 iframe" class="bordered" data-ratio="16:9"></iframe>
        <iframe src="/docs/snippets/demos/iframe-content.html" title="4:3 iframe" class="bordered" data-ratio="4:3"></iframe>
        <iframe src="/docs/snippets/demos/iframe-content.html" title="Square iframe" class="bordered" data-ratio="1:1"></iframe>
      </layout-grid>
    </section>
    <section>
      <h2>figure[data-media] with a caption</h2>
      <layout-center data-layout-max="narrow">
        <figure data-media data-ratio="16:9" data-radius="m">
          <iframe src="/docs/snippets/demos/iframe-content.html" title="16:9 embed in a captioned figure"></iframe>
          <figcaption>The ratio applies to the iframe; the caption flows below.</figcaption>
        </figure>
      </layout-center>
    </section>
    <section>
      <h2>.embed-responsive (legacy wrapper)</h2>
      <layout-grid data-layout-gap="m" data-layout-min="s">
        <figure class="embed-responsive ratio-4x3">
          <iframe src="/docs/snippets/demos/iframe-content.html" title="4:3 responsive embed" class="bordered"></iframe>
        </figure>
        <figure class="embed-responsive ratio-1x1">
          <iframe src="/docs/snippets/demos/iframe-content.html" title="Square responsive embed" class="bordered"></iframe>
        </figure>
      </layout-grid>
    </section>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
