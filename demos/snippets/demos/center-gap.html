<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Center Gap</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    .demo-box { background: var(--color-surface-raised); }
  </style>
</head>
<body>
  <h1>Center Gap</h1>
  <layout-stack data-layout-gap="l">
    <layout-center class="demo-box" data-layout-max="narrow" data-layout-gap>
      <h2>Default gap (m)</h2>
      <p>Children are spaced with --size-m.</p>
    </layout-center>

    <layout-center class="demo-box" data-layout-max="narrow" data-layout-gap="xl">
      <h2>Larger gap</h2>
      <p>Children are spaced with --size-xl.</p>
    </layout-center>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
