<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grid Identity: media objects</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    h1 { font-size: var(--font-size-xl); margin-block: 0 var(--size-m); }
    h2 { font-size: var(--font-size-s); margin: 0; color: var(--color-text-muted); }
    article p { margin: 0; }
    article img { border-radius: var(--radius-full); }
    article small { color: var(--color-text-muted); }
  </style>
</head>
<body>
  <h1>Activity</h1>

  <layout-stack data-layout-gap="l">
    <section aria-labelledby="default">
      <layout-stack data-layout-gap="xs">
        <h2 id="default">Default: figure first, content beside it</h2>
        <article data-layout="media" data-layout-gap="m">
          <img src="/src/assets/placeholders/photo-article-compact-1-80x80.svg" alt="" width="48" height="48" />
          <p><strong>Jane Doe</strong> published an article about page templates.</p>
          <p><small>Two hours ago</small></p>
        </article>
      </layout-stack>
    </section>

    <section aria-labelledby="centered">
      <layout-stack data-layout-gap="xs">
        <h2 id="centered">data-layout-align="center"</h2>
        <article data-layout="media" data-layout-gap="m" data-layout-align="center">
          <img src="/src/assets/placeholders/photo-article-compact-1-80x80.svg" alt="" width="48" height="48" />
          <p><strong>Sam Lee</strong> approved your change.</p>
        </article>
      </layout-stack>
    </section>

    <section aria-labelledby="reversed">
      <layout-stack data-layout-gap="xs">
        <h2 id="reversed">data-layout-reverse</h2>
        <article data-layout="media" data-layout-gap="m" data-layout-reverse>
          <img src="/src/assets/placeholders/photo-article-compact-1-80x80.svg" alt="" width="48" height="48" />
          <p><strong>Priya Shah</strong> left a comment on the release plan and asked for the date to move by a week.</p>
          <p><small>Yesterday</small></p>
        </article>
      </layout-stack>
    </section>
  </layout-stack>
</body>
</html>
