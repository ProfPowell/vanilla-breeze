<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Required masked input</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    body > * { max-inline-size: 30rem; }
  </style>
</head>
<body>
  <form>
    <layout-stack data-layout-gap="m">
      <form-field>
        <label for="phone-req">Phone number</label>
        <input type="tel" id="phone-req" name="phone" data-mask="phone" required placeholder="(555) 123-4567" />
        <output class="hint" for="phone-req">US numbers only.</output>
        <output class="error" for="phone-req" aria-live="polite">Enter all ten digits.</output>
      </form-field>
      <layout-cluster data-layout-gap="s">
        <button type="submit">Save</button>
        <button type="reset" class="secondary">Reset</button>
      </layout-cluster>
    </layout-stack>
  </form>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
