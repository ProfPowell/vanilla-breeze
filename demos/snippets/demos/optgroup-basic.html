<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Optgroup — Grouped Options</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <layout-center data-layout-max="narrow">
  <layout-stack data-layout-gap="l">
    <form-field>
      <label for="og-category">Category</label>
      <select id="og-category">
        <option value="">Select a category…</option>
        <optgroup label="Fruits">
          <option value="apple">Apple</option>
          <option value="banana">Banana</option>
          <option value="orange">Orange</option>
        </optgroup>
        <optgroup label="Vegetables">
          <option value="carrot">Carrot</option>
          <option value="broccoli">Broccoli</option>
          <option value="spinach">Spinach</option>
        </optgroup>
      </select>
    </form-field>
    <form-field>
      <label for="og-shipping">Shipping (one group disabled)</label>
      <select id="og-shipping">
        <optgroup label="Standard shipping">
          <option value="ground">Ground (5–7 days) — Free</option>
          <option value="priority">Priority (3–5 days) — $9.99</option>
        </optgroup>
        <optgroup label="Express shipping" disabled>
          <option value="express">Express (2 days) — $19.99</option>
          <option value="overnight">Overnight — $34.99</option>
        </optgroup>
      </select>
    </form-field>
    <form-field>
      <label for="og-listbox">Listbox (size="7")</label>
      <select id="og-listbox" size="7">
        <optgroup label="Frontend">
          <option>HTML</option>
          <option selected>CSS</option>
          <option>JavaScript</option>
        </optgroup>
        <optgroup label="Backend">
          <option>Node.js</option>
          <option>Go</option>
        </optgroup>
      </select>
    </form-field>
  </layout-stack>
  </layout-center>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
