<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Description list with div wrappers</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); max-inline-size: 65ch; }
  </style>
</head>
<body>
  <dl data-variant="horizontal" data-bordered>
    <div>
      <dt>Order</dt>
      <dd>#10482</dd>
    </div>
    <div>
      <dt>Ship to</dt>
      <dd>221B Baker Street, London NW1 6XE</dd>
    </div>
    <div>
      <dt>Items</dt>
      <dd>Field notebook</dd>
      <dd>Fountain pen</dd>
    </div>
  </dl>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
