<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Center: Element and Attribute Forms</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    .demo-host { outline: var(--border-width-thin) dashed var(--color-border); outline-offset: var(--size-3xs); }
    .demo-host { background: var(--color-surface-raised); }
  </style>
</head>
<body>
  <h1>Center: Element and Attribute Forms</h1>
  <layout-stack data-layout-gap="l">
    <section aria-labelledby="center-el-heading">
      <h2 id="center-el-heading">Element form</h2>
      <layout-center id="center-element" class="demo-host" data-layout-max="narrow" data-layout-text>
        <article>
          <h3>Release notes</h3>
          <p>Capped at 40rem and centred, with an m gutter on each side.</p>
        </article>
      </layout-center>
    </section>

    <section aria-labelledby="center-attr-heading">
      <h2 id="center-attr-heading">Attribute form</h2>
      <article id="center-attribute" class="demo-host" data-layout="center" data-layout-max="narrow" data-layout-text>
        <h3>Release notes</h3>
        <p>Capped at 40rem and centred, with an m gutter on each side.</p>
      </article>
    </section>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
