<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Input States and Validation</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <h1>Input States and Validation</h1>
  <layout-center data-layout-max="narrow" data-layout-gutter="none">
  <layout-stack data-layout-gap="l">
    <section>
      <h2>States</h2>
      <layout-stack data-layout-gap="m">
        <form-field>
          <label for="st-normal">Normal</label>
          <input type="text" id="st-normal" value="Editable text" />
        </form-field>
        <form-field>
          <label for="st-disabled">Disabled</label>
          <input type="text" id="st-disabled" disabled value="Cannot edit" />
        </form-field>
        <form-field>
          <label for="st-readonly">Read-only</label>
          <input type="text" id="st-readonly" readonly value="Select but not edit" />
        </form-field>
      </layout-stack>
    </section>
    <section>
      <h2>Validation</h2>
      <form>
        <layout-stack data-layout-gap="m">
          <form-field>
            <label for="v-required">Required *</label>
            <input type="text" id="v-required" required />
          </form-field>
          <form-field data-invalid>
            <label for="v-invalid">Email (invalid)</label>
            <input type="email" id="v-invalid" aria-invalid="true" aria-describedby="v-invalid-error" value="not-an-email" />
            <output id="v-invalid-error" class="error" for="v-invalid" aria-live="polite">Please enter a valid email</output>
          </form-field>
          <form-field>
            <label for="v-pattern">Username</label>
            <input type="text" id="v-pattern" pattern="[a-zA-Z0-9_]+" aria-describedby="v-pattern-hint" />
            <output id="v-pattern-hint" class="hint" for="v-pattern">Letters, numbers, underscores only</output>
          </form-field>
        </layout-stack>
        <button type="submit" hidden>Submit</button>
      </form>
    </section>
  </layout-stack>
  </layout-center>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
