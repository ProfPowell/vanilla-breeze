<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>data-toggle-tags max</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <form>
    <fieldset data-toggle-tags data-max="3">
      <legend>Pick up to 3 skills</legend>
      <label><input type="checkbox" name="skills" value="js" /> JavaScript</label>
      <label><input type="checkbox" name="skills" value="py" /> Python</label>
      <label><input type="checkbox" name="skills" value="go" /> Go</label>
      <label><input type="checkbox" name="skills" value="rust" /> Rust</label>
      <label><input type="checkbox" name="skills" value="ts" /> TypeScript</label>
      <label><input type="checkbox" name="skills" value="cobol" disabled /> COBOL (unavailable)</label>
    </fieldset>
    <p><button type="submit">Save</button> <button type="reset">Reset</button></p>
  </form>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
