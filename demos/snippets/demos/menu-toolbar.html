<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Menu — Toolbar</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <menu class="toolbar" role="toolbar" aria-label="Text formatting">
    <li role="none"><button type="button" class="ghost" aria-pressed="true">Bold</button></li>
    <li role="none"><button type="button" class="ghost" aria-pressed="false">Italic</button></li>
    <li role="none"><button type="button" class="ghost" aria-pressed="false">Underline</button></li>
    <li role="separator"></li>
    <li role="none"><button type="button" class="ghost">Link</button></li>
  </menu>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
