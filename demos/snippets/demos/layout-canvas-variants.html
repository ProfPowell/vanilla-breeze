<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Layout Canvas: variants</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    .demo-label { color: var(--color-text-muted); font-size: var(--font-size-s); }
  </style>
</head>
<body>
  <h1>Layout Canvas: variants</h1>
  <layout-stack data-layout-gap="xl">
    <section>
      <p class="demo-label"><strong>data-canvas="flush"</strong></p>
      <section data-canvas="flush">
        <h2>Flush canvas</h2>
        <p>No border radius or shadow. Edge-to-edge surface.</p>
      </section>
    </section>

    <section>
      <p class="demo-label"><strong>data-canvas="elevated"</strong> (37.5rem and wider)</p>
      <section data-canvas="elevated">
        <h2>Elevated canvas</h2>
        <p>Larger radius and stronger shadow for emphasis.</p>
      </section>
    </section>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
