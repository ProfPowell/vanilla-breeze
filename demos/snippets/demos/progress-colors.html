<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Progress Colors</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <layout-center data-layout-max="narrow">
  <layout-stack data-layout-gap="m">
    <form-field>
      <label for="progress-default">Default (interactive color)</label>
      <progress id="progress-default" value="70" max="100">70%</progress>
    </form-field>
    <form-field>
      <label for="progress-success">.success</label>
      <progress id="progress-success" class="success" value="100" max="100">100%</progress>
    </form-field>
    <form-field>
      <label for="progress-warning">.warning</label>
      <progress id="progress-warning" class="warning" value="60" max="100">60%</progress>
    </form-field>
    <form-field>
      <label for="progress-error">.error</label>
      <progress id="progress-error" class="error" value="30" max="100">30%</progress>
    </form-field>
  </layout-stack>
  </layout-center>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
