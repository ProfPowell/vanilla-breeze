<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Layout Canvas: multiple canvases</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    .demo-label { color: var(--color-text-muted); font-size: var(--font-size-s); }
  </style>
</head>
<body>
  <h1>Layout Canvas: multiple canvases</h1>
  <layout-stack data-layout-gap="xl">
    <section>
      <p class="demo-label"><strong>Two independent canvases in a grid</strong></p>
      <section data-layout="grid" data-layout-min="l">
        <article data-canvas>
          <h2>Canvas A</h2>
          <p>Independent canvas region.</p>
        </article>
        <aside data-canvas="elevated" aria-labelledby="canvas-b-heading">
          <h2 id="canvas-b-heading">Canvas B</h2>
          <p>Elevated variant alongside.</p>
        </aside>
      </section>
    </section>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
