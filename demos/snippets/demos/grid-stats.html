<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grid Stats Layout</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <layout-grid data-layout-min="s" data-layout-gap="m">
    <layout-card data-variant="outlined" data-padding="l">
      <layout-stack data-layout-gap="xs" data-layout-align="center">
        <strong>1,234</strong>
        <small>Total Users</small>
      </layout-stack>
    </layout-card>
    <layout-card data-variant="outlined" data-padding="l">
      <layout-stack data-layout-gap="xs" data-layout-align="center">
        <strong>567</strong>
        <small>Active Today</small>
      </layout-stack>
    </layout-card>
    <layout-card data-variant="outlined" data-padding="l">
      <layout-stack data-layout-gap="xs" data-layout-align="center">
        <strong>89%</strong>
        <small>Satisfaction</small>
      </layout-stack>
    </layout-card>
    <layout-card data-variant="outlined" data-padding="l">
      <layout-stack data-layout-gap="xs" data-layout-align="center">
        <strong>42</strong>
        <small>New Signups</small>
      </layout-stack>
    </layout-card>
  </layout-grid>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
