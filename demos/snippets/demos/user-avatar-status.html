<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>User Avatar Status Indicator</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <layout-cluster data-layout-gap="m" data-layout-align="center">
    <user-avatar data-size="lg">
      <img src="/src/assets/placeholders/photo-reel-team-members-4-100x100.svg" alt="Jane Doe" />
      <span data-status="online" role="img" aria-label="Online"></span>
    </user-avatar>
    <user-avatar data-size="lg" role="img" aria-label="Ada Wong, away">
      <span data-fallback aria-hidden="true">AW</span>
      <span data-status="away"></span>
    </user-avatar>
    <user-avatar data-size="lg">
      <span data-fallback aria-hidden="true">BY</span>
      <span data-status="busy">Ben Young, busy</span>
    </user-avatar>
    <user-avatar data-size="lg">
      <span data-fallback aria-hidden="true">OF</span>
      <span data-status="offline">Olu Fashola, offline</span>
    </user-avatar>
  </layout-cluster>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
