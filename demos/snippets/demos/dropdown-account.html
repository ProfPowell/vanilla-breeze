<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Account Dropdown Demo</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body {
      padding: var(--size-m);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <drop-down no-flip>
    <button type="button" data-trigger class="ghost">
      <layout-cluster data-layout-gap="s">
        <user-avatar data-size="xs" aria-hidden="true"><span data-fallback>JD</span></user-avatar>
        <span>John Doe</span>
        <icon-wc name="chevron-down" size="xs"></icon-wc>
      </layout-cluster>
    </button>
    <menu>
      <li>
        <button type="button">
          <icon-wc name="user" size="sm"></icon-wc>
          Profile
        </button>
      </li>
      <li>
        <button type="button">
          <icon-wc name="settings" size="sm"></icon-wc>
          Settings
        </button>
      </li>
      <li>
        <button type="button">
          <icon-wc name="help-circle" size="sm"></icon-wc>
          Help
        </button>
      </li>
      <li role="separator"></li>
      <li>
        <button type="button">
          <icon-wc name="log-out" size="sm"></icon-wc>
          Sign Out
        </button>
      </li>
    </menu>
  </drop-down>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
