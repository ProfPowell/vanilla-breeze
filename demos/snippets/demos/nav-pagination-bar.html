<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nav — Pagination bar</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <footer class="pagination-bar">
    <p class="pagination-info">Showing <strong>21</strong> to <strong>30</strong> of <strong>97</strong> results</p>
    <nav class="pagination" aria-label="Results pages">
      <ul>
        <li><a href="#" data-prev>Previous</a></li>
        <li><a href="#">2</a></li>
        <li><a href="#" aria-current="page">3</a></li>
        <li><a href="#">4</a></li>
        <li><span data-ellipsis>&hellip;</span></li>
        <li><a href="#">10</a></li>
        <li><a href="#" data-next>Next</a></li>
      </ul>
    </nav>
    <p class="page-size-selector">
      <label for="page-size">Show</label>
      <select id="page-size">
        <option value="10" selected>10</option>
        <option value="25">25</option>
        <option value="50">50</option>
      </select>
      <span>per page</span>
    </p>
  </footer>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
