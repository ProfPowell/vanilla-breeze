<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stack Alignment with Section Children</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    .panel { padding: var(--size-s); border: var(--border-width-thin) solid var(--color-border); border-radius: var(--radius-m); }
  </style>
</head>
<body>
  <h1>Stack Alignment with Section Children</h1>
  <layout-grid data-layout-min="m" data-layout-gap="l">
    <section aria-labelledby="el-form">
      <h2 id="el-form">Element form, center</h2>
      <layout-stack data-layout-gap="s" data-layout-align="center">
        <section class="panel"><p>A section sized to its content</p></section>
        <article class="panel"><p>An article too</p></article>
      </layout-stack>
    </section>

    <section aria-labelledby="attr-form" data-layout="stack" data-layout-gap="s" data-layout-align="end">
      <h2 id="attr-form">Attribute form, end</h2>
      <article class="panel"><p>End-aligned article</p></article>
      <aside class="panel"><p>End-aligned aside</p></aside>
    </section>
  </layout-grid>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
