<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Switcher - Form Actions</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <form data-layout="stack" data-layout-gap="m" action="#" method="post">
    <form-field>
      <label for="project-name">Project name</label>
      <input type="text" id="project-name" name="project-name" value="Project Alpha" />
    </form-field>
    <footer data-layout="switcher" data-layout-gap="s" data-layout-threshold="s">
      <button type="reset" class="secondary">Cancel</button>
      <button type="submit">Save Changes</button>
    </footer>
  </form>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
