<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Constrained and RTL Splitters</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    [data-splitter] { min-block-size: 9rem; }
    [data-splitter] > :not(.split-divider) {
      padding: var(--size-s);
      background: var(--color-surface-raised);
    }
  </style>
</head>
<body>
  <layout-stack data-layout-gap="xl">
    <h1>Splitter constraints and direction</h1>
    <section aria-labelledby="constrained-heading">
      <h2 id="constrained-heading">Constrained: 20% to 60%</h2>
      <section data-layout="sidebar" data-splitter data-label-resize="Resize navigation">
        <nav aria-label="Constrained example" data-min="20" data-max="60">
          <strong>Sidebar</strong>
          <p>Min 20%, max 60%.</p>
        </nav>
        <section data-layout="stack" data-layout-gap="s">
          <strong>Content</strong>
          <p>Any content child may shrink next to the splitter.</p>
        </section>
      </section>
    </section>

    <section aria-labelledby="rtl-heading">
      <h2 id="rtl-heading">Right to left</h2>
      <section data-layout="sidebar" data-splitter dir="rtl" lang="ar" data-label-resize="تغيير حجم اللوحات">
        <nav aria-label="مثال">
          <strong>الشريط الجانبي</strong>
          <p>اسحب الفاصل أو استخدم مفاتيح الأسهم.</p>
        </nav>
        <main>
          <strong>المحتوى</strong>
        </main>
      </section>
    </section>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
