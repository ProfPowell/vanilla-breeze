<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>data-upload with accept</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <form>
    <form-field>
      <label for="up-doc">Upload document</label>
      <input type="file" id="up-doc" name="document" data-upload accept=".pdf,.doc,.docx" />
    </form-field>
    <button type="submit">Upload</button>
  </form>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
