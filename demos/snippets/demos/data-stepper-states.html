<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stepper disabled and readonly</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    body > * { max-inline-size: 30rem; }
  </style>
</head>
<body>
  <layout-stack data-layout-gap="m">
    <form-field>
      <label for="ro">Included seats (read-only)</label>
      <input type="number" id="ro" name="included" value="2" readonly data-stepper />
    </form-field>
    <form-field>
      <label for="dis">Extra seats (disabled)</label>
      <input type="number" id="dis" name="extra" value="0" disabled data-stepper />
    </form-field>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
