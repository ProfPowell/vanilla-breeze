<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Layout Canvas: nested canvases</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    .demo-label { color: var(--color-text-muted); font-size: var(--font-size-s); }
  </style>
</head>
<body>
  <h1>Layout Canvas: nested canvases</h1>
  <layout-stack data-layout-gap="xl">
    <section>
      <p class="demo-label"><strong>Nested canvases</strong></p>
      <article data-canvas>
        <h2>Outer canvas</h2>
        <p>Primary surface background.</p>
        <aside data-canvas aria-labelledby="nested-canvas-heading">
          <h3 id="nested-canvas-heading">Nested canvas</h3>
          <p>Automatically uses the raised surface colour for hierarchy.</p>
        </aside>
      </article>
    </section>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
