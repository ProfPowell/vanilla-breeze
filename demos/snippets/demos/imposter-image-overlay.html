<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Imposter Image Overlay</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    .image-wrapper {
      position: relative;
      display: inline-block;
    }
    .image-wrapper > img { display: block; inline-size: 300px; block-size: auto; }
    .caption {
      background: oklch(0% 0 0 / 0.7);
      color: white;
      padding: var(--size-xs) var(--size-s);
      border-radius: var(--radius-s);
      font-size: var(--font-size-s);
    }
  </style>
</head>
<body>
  <figure class="image-wrapper">
    <img src="/src/assets/placeholders/photo-layout-card-content-1-400x225.svg" alt="Placeholder landscape" width="400" height="225" />
    <layout-imposter data-layout-position="bottom-start" data-layout-margin="m">
      <span class="caption">Photo caption</span>
    </layout-imposter>
  </figure>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
