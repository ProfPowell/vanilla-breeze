<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Data Locale Override</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <h1>Locale override</h1>
  <table>
    <thead>
      <tr><th scope="col">Locale</th><th scope="col">Number</th><th scope="col">Currency</th></tr>
    </thead>
    <tbody>
      <tr>
        <th scope="row">Page (en)</th>
        <td><data value="1234567.89" data-format-number>1,234,567.89</data></td>
        <td><data value="1234.5" data-format-number="currency" data-currency="USD">$1,234.50</data></td>
      </tr>
      <tr>
        <th scope="row">de-DE</th>
        <td><data value="1234567.89" data-format-number data-locale="de-DE">1.234.567,89</data></td>
        <td><data value="1234.5" data-format-number="currency" data-currency="EUR" data-locale="de-DE">1.234,50 €</data></td>
      </tr>
      <tr>
        <th scope="row">fr-FR</th>
        <td><data value="1234567.89" data-format-number data-locale="fr-FR">1 234 567,89</data></td>
        <td><data value="1234.5" data-format-number="currency" data-currency="EUR" data-locale="fr-FR">1 234,50 €</data></td>
      </tr>
      <tr>
        <th scope="row">ja-JP</th>
        <td><data value="1234567.89" data-format-number data-locale="ja-JP">1,234,567.89</data></td>
        <td><data value="1234.5" data-format-number="currency" data-currency="JPY" data-locale="ja-JP">￥1,235</data></td>
      </tr>
      <tr>
        <th scope="row">en-IN</th>
        <td><data value="1234567.89" data-format-number data-locale="en-IN">12,34,567.89</data></td>
        <td><data value="1234.5" data-format-number="currency" data-currency="INR" data-locale="en-IN">₹1,234.50</data></td>
      </tr>
    </tbody>
  </table>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
