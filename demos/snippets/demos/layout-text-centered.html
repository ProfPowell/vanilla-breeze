<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Layout Text - Centered Article</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-xl); background: var(--color-gray-100); }
  </style>
</head>
<body>
  <h1>Layout Text - Centered Article</h1>
  <layout-text data-layout-centered data-layout-measure="narrow">
    <h2>Centered Article</h2>
    <p>layout-text already limits its own line length (the measure). <code>data-layout-centered</code> adds <code>margin-inline: auto</code>, so no <code>layout-center</code> wrapper is needed.</p>
    <p>This pattern is common for blog posts, documentation, and any long-form content.</p>
  </layout-text>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
