<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Figcaption Alignment</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <section data-layout="grid" data-layout-min="s" data-layout-gap="l">
    <figure class="bordered">
      <img src="/src/assets/placeholders/photo-figcaption-3-500x280.svg" alt="Harbour at dawn" />
      <figcaption>Default caption is start-aligned.</figcaption>
    </figure>
    <figure class="bordered">
      <img src="/src/assets/placeholders/photo-figcaption-4-500x281.svg" alt="Forest trail" />
      <figcaption class="centered">Centered caption text.</figcaption>
    </figure>
    <figure class="bordered">
      <img src="/src/assets/placeholders/photo-figcaption-5-500x282.svg" alt="Desert dunes" />
      <figcaption class="end">End-aligned caption text.</figcaption>
    </figure>
  </section>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
