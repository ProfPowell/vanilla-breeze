  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }

<body>
  <h1>List Item Markers and Separators</h1>
  <layout-stack data-layout-gap="l">

          </ol>
        </li>
        <li>Deploy</li>
      </ul>

    <section>

        <li>Jane Smith</li>
        <li><time datetime="2024-01-15">Jan 15, 2024</time></li>
        <li>5 min read</li>
