<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Table Card Mode</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <table data-responsive="card">
    <caption>Open orders (cards below 500px; labels come from the column headers)</caption>
    <thead>
      <tr><th scope="col">Order</th><th scope="col">Customer</th><th scope="col">Status</th><th scope="col" data-numeric>Total</th></tr>
    </thead>
    <tbody>
      <tr><th scope="row">#1024</th><td>Alice Chen</td><td>Shipped</td><td data-numeric>$149.99</td></tr>
      <tr data-selected><th scope="row">#1025</th><td>Bob Martinez</td><td>Processing (selected)</td><td data-numeric>$89.50</td></tr>
      <tr><th scope="row">#1026</th><td>Carol Johnson</td><td>Delivered</td><td data-numeric>$212.00</td></tr>
    </tbody>
    <tfoot>
      <tr><th scope="row">Total</th><td></td><td></td><td data-numeric>$451.49</td></tr>
    </tfoot>
  </table>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
