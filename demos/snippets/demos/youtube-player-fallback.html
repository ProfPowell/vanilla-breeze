<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouTube Player — No-JS Fallback</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    youtube-player { max-inline-size: 640px; }
  </style>
</head>
<body>
  <h1>YouTube Player — No-JS Fallback</h1>
  <section data-layout="stack" data-layout-gap="m">
    <h2>Authored fallback link</h2>
    <p>Before the component upgrades (or without JavaScript) the link is shown. After upgrade the facade replaces it.</p>
    <youtube-player
      poster="/src/assets/placeholders/photo-kitchen-sink-13-640x360.svg"
      video-id="dQw4w9WgXcQ"
      title="Rick Astley — Never Gonna Give You Up">
      <a href="https://youtu.be/dQw4w9WgXcQ">Watch on YouTube: Rick Astley — Never Gonna Give You Up</a>
    </youtube-player>
  </section>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
