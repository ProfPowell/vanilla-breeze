<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>data-accept custom character class</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <form>
    <form-field>
      <label for="acc-hex">Hex colour</label>
      <input type="text" id="acc-hex" name="hex" data-accept="[0-9a-fA-F]" maxlength="6" pattern="[0-9a-fA-F]{6}" aria-describedby="acc-hex-hint" />
      <output id="acc-hex-hint" class="hint" for="acc-hex">Six characters, 0&ndash;9 and A&ndash;F.</output>
    </form-field>
    <button type="submit">Save</button>
  </form>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
