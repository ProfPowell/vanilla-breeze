<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>data-strength rule sets</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <form data-layout="stack" data-layout-gap="l">
    <form-field>
      <label for="str-secure">Password (12+ characters, all rules)</label>
      <input type="password" id="str-secure" name="secure" autocomplete="new-password" data-strength data-rules="length:12,uppercase,lowercase,number,special" />
    </form-field>
    <form-field>
      <label for="str-moderate">Password (6+ characters, uppercase, number)</label>
      <input type="password" id="str-moderate" name="moderate" autocomplete="new-password" data-strength data-rules="length:6,uppercase,number" />
    </form-field>
    <button type="submit">Save</button>
  </form>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
