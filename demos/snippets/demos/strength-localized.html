<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>data-strength localized</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <form lang="fr">
    <form-field
      data-label-strength="Robustesse du mot de passe"
      data-label-strength-empty="Aucun mot de passe"
      data-label-strength-weak="Faible"
      data-label-strength-fair="Moyen"
      data-label-strength-good="Bon"
      data-label-strength-strong="Fort"
      data-label-requirements="Exigences du mot de passe"
      data-label-rule-length="Au moins {n} caractères"
      data-label-rule-uppercase="Une majuscule"
      data-label-rule-number="Un chiffre"
      data-label-rule-met="respectée"
      data-label-rule-unmet="non respectée"
      data-label-show-password="Afficher le mot de passe"
      data-label-hide-password="Masquer le mot de passe">
      <label for="str-fr">Mot de passe</label>
      <input type="password" id="str-fr" name="mdp" autocomplete="new-password" data-strength data-rules="length:8,uppercase,number" value="Été2026" />
    </form-field>
    <button type="submit">Enregistrer</button>
  </form>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
