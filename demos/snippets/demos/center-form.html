<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Center Form Container</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <h1>Center Form Container</h1>
  <layout-center data-layout-max="narrow" data-layout-intrinsic>
    <layout-card data-variant="outlined">
      <form data-layout="stack" data-layout-gap="m" action="#" method="post">
        <h2>Sign In</h2>
        <layout-stack data-layout-gap="xs">
          <label for="center-email">Email</label>
          <input type="email" id="center-email" name="email" autocomplete="email" required placeholder="you@example.com" />
        </layout-stack>
        <layout-stack data-layout-gap="xs">
          <label for="center-password">Password</label>
          <input type="password" id="center-password" name="password" autocomplete="current-password" required placeholder="Enter password" />
        </layout-stack>
        <button type="submit" class="full-width">Sign In</button>
      </form>
    </layout-card>
  </layout-center>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
