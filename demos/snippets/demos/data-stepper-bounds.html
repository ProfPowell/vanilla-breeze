<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stepper bounds and step base</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    body > * { max-inline-size: 30rem; }
  </style>
</head>
<body>
  <layout-stack data-layout-gap="m">
    <form-field>
      <label for="temp-c">Temperature (°C)</label>
      <input type="number" id="temp-c" name="temp" min="-20" max="45" step="5" value="20" data-stepper />
    </form-field>
    <form-field>
      <label for="seats">Seats (blocks of 4 from 1)</label>
      <input type="number" id="seats" name="seats" min="1" step="4" value="5" data-stepper />
    </form-field>
    <form-field>
      <label for="offset">Offset (unbounded)</label>
      <input type="number" id="offset" name="offset" step="1" value="0" data-stepper />
    </form-field>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
