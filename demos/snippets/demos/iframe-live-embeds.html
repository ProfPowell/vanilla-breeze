<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Iframe Embeds</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <h1>Live Iframe Embeds</h1>
  <layout-stack data-layout-gap="xl">
    <section>
      <h2>YouTube Video (16:9)</h2>
      <iframe
        src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ"
        title="YouTube video player"
        width="560" height="315" data-ratio="16:9"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
        referrerpolicy="strict-origin-when-cross-origin"
        loading="lazy">
      </iframe>
    </section>
    <section>
      <h2>OpenStreetMap (4:3)</h2>
      <iframe
        src="https://www.openstreetmap.org/export/embed.html?bbox=-122.4194%2C37.7749%2C-122.3894%2C37.7949&amp;layer=mapnik"
        title="Map of San Francisco"
        width="500" height="375" data-ratio="4:3"
        loading="lazy">
      </iframe>
    </section>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
