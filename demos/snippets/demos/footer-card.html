<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Footer Card</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <h1>Footer Card</h1>
  <section data-layout="grid" data-layout-min="m" data-layout-gap="l">
    <article class="card">
      <h2>footer.card</h2>
      <p>For containers that don't style their own footer.</p>
      <footer class="card">
        <button type="button">Action</button>
      </footer>
    </article>
    <layout-card>
      <header><h2>layout-card</h2></header>
      <section><p>layout-card styles its own footer &mdash; no class needed.</p></section>
      <footer>
        <button type="button">Action</button>
      </footer>
    </layout-card>
  </section>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
