<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Range datalist labels</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    body > * { max-inline-size: 30rem; }
  </style>
</head>
<body>
  <form-field>
    <label for="rating">Rating</label>
    <input type="range" id="rating" name="rating" data-range data-bubble min="1" max="5" step="1" value="3" list="rating-labels" />
    <datalist id="rating-labels">
      <option value="1" label="Poor"></option>
      <option value="2" label="Fair"></option>
      <option value="3" label="Good"></option>
      <option value="4" label="Great"></option>
      <option value="5" label="Excellent"></option>
    </datalist>
  </form-field>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
