<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Site Legal List Form</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); }
    .demo-narrow { max-inline-size: 18rem; }
  </style>
</head>
<body>
  <main data-layout="stack" data-layout-gap="l">
    <section aria-label="List form, start aligned">
      <h1>List form, start aligned</h1>
      <site-legal data-justify="start">
        <ul>
          <li>&copy; <time datetime="2026">2026</time> Acme Incorporated</li>
          <li>MIT License</li>
          <li><a href="#">Privacy Policy</a></li>
          <li><a href="#">Terms of Service</a></li>
          <li><a href="#">Cookie Policy</a></li>
          <li><a href="#">Accessibility Statement</a></li>
        </ul>
      </site-legal>
    </section>
    <section aria-label="Narrow, wrapping">
      <h2>Narrow, wrapping</h2>
      <p>Wrapped rows start without a separator.</p>
      <site-legal data-justify="start" class="demo-narrow">
        <span>&copy; <time datetime="2026">2026</time> Acme Inc</span>
        <span>MIT License</span>
        <a href="#">Privacy Policy</a>
        <a href="#">Terms of Service</a>
        <a href="#">Cookie Policy</a>
      </site-legal>
    </section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
