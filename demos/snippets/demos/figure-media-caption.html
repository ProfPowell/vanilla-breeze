<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Figure data-media with Caption</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <section data-layout="grid" data-layout-min="m" data-layout-gap="l">
    <figure data-media data-ratio="16:9" data-radius="m">
      <img src="/src/assets/placeholders/photo-figure-1-600x400.svg" alt="Mountain landscape cropped to 16:9" />
      <figcaption>The 16:9 box applies to the image; the caption flows below it.</figcaption>
    </figure>
    <figure data-media data-ratio="1:1">
      <img src="/src/assets/placeholders/photo-figure-2-600x350.svg" alt="Landscape cropped to a square" />
    </figure>
  </section>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
