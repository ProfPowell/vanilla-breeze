<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Numbered Figures</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <h1>Survey report</h1>
  <article data-numbered>
    <h2>Results</h2>
    <figure>
      <img src="/src/assets/placeholders/photo-vb-fig-img-500x300.svg" alt="Survey response chart" />
      <figcaption>Survey responses by region.</figcaption>
    </figure>
    <figure class="code">
      <pre><code>const total = rows.reduce((n, r) =&gt; n + r.count, 0);</code></pre>
      <figcaption>Summing the responses.</figcaption>
    </figure>
    <figure class="quote">
      <blockquote><p>The data speaks for itself.</p></blockquote>
      <figcaption>Lead researcher</figcaption>
    </figure>
    <figure>
      <img src="/src/assets/placeholders/photo-figure-2-600x350.svg" alt="Follow-up response chart" />
      <figcaption>Follow-up responses, six months later.</figcaption>
    </figure>
  </article>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
