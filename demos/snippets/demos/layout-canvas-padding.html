<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Layout Canvas: padding</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    .demo-label { color: var(--color-text-muted); font-size: var(--font-size-s); }
  </style>
</head>
<body>
  <h1>Layout Canvas: padding</h1>
  <layout-stack data-layout-gap="xl">
    <section>
      <p class="demo-label"><strong>data-padding="s"</strong></p>
      <article data-canvas data-padding="s">
        <h2>Small padding</h2>
        <p>For dense surfaces such as toolbars or compact panels.</p>
      </article>
    </section>

    <section>
      <p class="demo-label"><strong>data-padding="xl"</strong></p>
      <article data-canvas data-padding="xl">
        <h2>Extra-large padding</h2>
        <p>For a spacious, featured surface. The value is kept on narrow screens too.</p>
      </article>
    </section>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
