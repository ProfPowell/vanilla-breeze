<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>data-autosave: checkboxes and radios</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body {
      padding: var(--size-l);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <form data-autosave="preferences-demo" method="dialog">
    <layout-stack data-layout-gap="m">
      <fieldset>
        <legend>Notify me by</legend>
        <label><input type="checkbox" name="notify" value="email"/> Email</label>
        <label><input type="checkbox" name="notify" value="sms"/> SMS</label>
        <label><input type="checkbox" name="notify" value="push"/> Push</label>
      </fieldset>
      <fieldset>
        <legend>Theme</legend>
        <label><input type="radio" name="theme" value="light"/> Light</label>
        <label><input type="radio" name="theme" value="dark"/> Dark</label>
      </fieldset>
      <layout-cluster data-layout-gap="s">
        <button type="submit">Save</button>
        <button type="reset">Clear draft</button>
      </layout-cluster>
    </layout-stack>
  </form>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
