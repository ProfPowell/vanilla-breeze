<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Section Contained</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: 0; background: var(--color-surface); } section.contained { background: var(--color-surface-raised); }
  </style>
</head>
<body>
  <h1>Section Contained</h1>
  <section class="contained">
    <h2>Contained Section</h2>
    <p>Content is capped at 1200px and centered, with inline padding so it never touches the viewport edge on narrow screens.</p>
  </section>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
