<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cluster No Wrap</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    .demo-narrow { max-inline-size: 18rem; padding: var(--size-xs); border: var(--border-width-thin) dashed var(--color-border); overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Cluster No Wrap</h1>
  <layout-stack data-layout-gap="l">
    <section aria-labelledby="wrap-heading">
      <h2 id="wrap-heading">Default: items wrap</h2>
      <layout-cluster class="demo-narrow" data-layout-gap="xs">
        <button type="button">Bold</button>
        <button type="button">Italic</button>
        <button type="button">Underline</button>
        <button type="button">Link</button>
        <button type="button">Quote</button>
      </layout-cluster>
    </section>

    <section aria-labelledby="nowrap-heading">
      <h2 id="nowrap-heading">data-layout-nowrap: one line, scrolls when it overflows</h2>
      <layout-cluster class="demo-narrow" data-layout-gap="xs" data-layout-nowrap>
        <button type="button">Bold</button>
        <button type="button">Italic</button>
        <button type="button">Underline</button>
        <button type="button">Link</button>
        <button type="button">Quote</button>
      </layout-cluster>
    </section>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
