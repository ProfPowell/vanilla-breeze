<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brand Mark Wordmark</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <h1>Image plus wordmark</h1>
  <layout-stack data-layout-gap="l">
    <section>
      <h2>Inline</h2>
      <brand-mark src="/docs/snippets/demos/assets/brand-mark-icon.svg" wordmark>Acme Inc</brand-mark>
    </section>
    <section>
      <h2>Stacked with a tagline</h2>
      <brand-mark src="/docs/snippets/demos/assets/brand-mark-icon.svg" wordmark data-stack height="48">
        Acme Inc
        <em>Making things better</em>
      </brand-mark>
    </section>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
