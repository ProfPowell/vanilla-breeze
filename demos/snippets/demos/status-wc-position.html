<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>status-wc position and pulse</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <layout-stack data-layout-gap="m">
    <layout-cluster data-layout-gap="m" data-layout-align="center">
      <status-wc data-variant="live" data-position="before">Live (before)</status-wc>
      <status-wc data-variant="live" data-position="after">Live (after)</status-wc>
      <status-wc data-variant="online" data-position="only"></status-wc>
    </layout-cluster>
    <layout-cluster data-layout-gap="m" data-layout-align="center">
      <status-wc data-variant="online" data-pulse="on">Online (forced pulse)</status-wc>
      <status-wc data-variant="live" data-pulse="off">Live (suppressed pulse)</status-wc>
    </layout-cluster>
  </layout-stack>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
