<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reel: element and attribute forms</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <h1>Reel: element and attribute forms</h1>
  <layout-stack data-layout-gap="l">
    <section>
      <p><strong>Element form</strong> &mdash; <code>&lt;layout-reel role="region"&gt;</code></p>
      <!-- [html-validate-disable-next prefer-native-element -- the element form of the reel takes role="region" itself; the attribute form below uses a native section] -->
      <layout-reel data-layout-item-width="s" role="region" aria-label="Element form reel" tabindex="0">
        <layout-card data-variant="outlined" data-padding="m"><strong>Item 1</strong></layout-card>
        <layout-card data-variant="outlined" data-padding="m"><strong>Item 2</strong></layout-card>
        <layout-card data-variant="outlined" data-padding="m"><strong>Item 3</strong></layout-card>
        <layout-card data-variant="outlined" data-padding="m"><strong>Item 4</strong></layout-card>
        <layout-card data-variant="outlined" data-padding="m"><strong>Item 5</strong></layout-card>
      </layout-reel>
    </section>

    <section>
      <p><strong>Attribute form</strong> &mdash; <code>&lt;section data-layout="reel"&gt;</code></p>
      <section data-layout="reel" data-layout-item-width="s" aria-label="Attribute form reel" tabindex="0">
        <layout-card data-variant="outlined" data-padding="m"><strong>Item 1</strong></layout-card>
        <layout-card data-variant="outlined" data-padding="m"><strong>Item 2</strong></layout-card>
        <layout-card data-variant="outlined" data-padding="m"><strong>Item 3</strong></layout-card>
        <layout-card data-variant="outlined" data-padding="m"><strong>Item 4</strong></layout-card>
        <layout-card data-variant="outlined" data-padding="m"><strong>Item 5</strong></layout-card>
      </section>
    </section>
  </layout-stack>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
