<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Full-width SVG</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    svg.full { border: var(--border-width-thin) solid var(--color-border); }
  </style>
</head>
<body>
  <h1>Full-width SVG</h1>
  <figure>
    <svg class="full" role="img" aria-labelledby="flow-title" viewBox="0 0 400 100">
      <title id="flow-title">Three-step flow: draft, review, publish</title>
      <g fill="none" stroke="currentColor" stroke-width="2">
        <rect x="10" y="30" width="100" height="40" rx="6" />
        <rect x="150" y="30" width="100" height="40" rx="6" />
        <rect x="290" y="30" width="100" height="40" rx="6" />
        <path d="M110 50h40M250 50h40" />
      </g>
      <g fill="currentColor" font-size="14" text-anchor="middle">
        <text x="60" y="55">Draft</text>
        <text x="200" y="55">Review</text>
        <text x="340" y="55">Publish</text>
      </g>
    </svg>
    <figcaption>The diagram fills the container width; the viewBox keeps its 4:1 aspect ratio.</figcaption>
  </figure>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
