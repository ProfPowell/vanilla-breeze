<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Progress Basic</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <layout-center data-layout-max="narrow">
  <layout-stack data-layout-gap="m">
    <form-field>
      <label for="progress-upload">Upload Progress</label>
      <progress id="progress-upload" value="70" max="100">70%</progress>
    </form-field>
    <form-field>
      <label for="progress-steps">Step 3 of 5</label>
      <progress id="progress-steps" value="3" max="5">60%</progress>
    </form-field>
  </layout-stack>
  </layout-center>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
