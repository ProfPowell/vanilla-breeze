<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>data-count: character count</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body {
      padding: var(--size-l);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <form-field>
    <label for="bio">Bio</label>
    <textarea id="bio" name="bio" maxlength="200" data-count rows="3"></textarea>
  </form-field>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
