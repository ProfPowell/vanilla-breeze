<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reel Scroll Hints</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <layout-stack data-layout-gap="l">
    <section>
      <p><strong>data-scroll-hint</strong> &mdash; each edge fades while there is more content that way</p>
      <section data-layout="reel" data-scroll-hint data-layout-item-width="s" aria-label="Both edges hint" tabindex="0">
        <layout-card data-variant="outlined" data-padding="m"><strong>Item 1</strong></layout-card>
        <layout-card data-variant="outlined" data-padding="m"><strong>Item 2</strong></layout-card>
        <layout-card data-variant="outlined" data-padding="m"><strong>Item 3</strong></layout-card>
        <layout-card data-variant="outlined" data-padding="m"><strong>Item 4</strong></layout-card>
        <layout-card data-variant="outlined" data-padding="m"><strong>Item 5</strong></layout-card>
        <layout-card data-variant="outlined" data-padding="m"><strong>Item 6</strong></layout-card>
      </section>
    </section>

    <section>
      <p><strong>data-scroll-hint="start"</strong> &mdash; only the end edge fades</p>
      <section data-layout="reel" data-scroll-hint="start" data-layout-item-width="s" aria-label="End edge hint" tabindex="0">
        <layout-card data-variant="outlined" data-padding="m"><strong>Item 1</strong></layout-card>
        <layout-card data-variant="outlined" data-padding="m"><strong>Item 2</strong></layout-card>
        <layout-card data-variant="outlined" data-padding="m"><strong>Item 3</strong></layout-card>
        <layout-card data-variant="outlined" data-padding="m"><strong>Item 4</strong></layout-card>
        <layout-card data-variant="outlined" data-padding="m"><strong>Item 5</strong></layout-card>
        <layout-card data-variant="outlined" data-padding="m"><strong>Item 6</strong></layout-card>
      </section>
    </section>

    <section>
      <p><strong>No overflow</strong> &mdash; nothing fades when everything fits</p>
      <section data-layout="reel" data-scroll-hint aria-label="No overflow" tabindex="0">
        <layout-card data-variant="outlined" data-padding="m"><strong>One</strong></layout-card>
        <layout-card data-variant="outlined" data-padding="m"><strong>Two</strong></layout-card>
      </section>
    </section>
  </layout-stack>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
