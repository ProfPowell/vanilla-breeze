<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Colour palette form</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    body > * { max-inline-size: 30rem; }
  </style>
</head>
<body>
  <form>
    <layout-stack data-layout-gap="m">
      <form-field>
        <label for="primary">Primary</label>
        <input type="color" id="primary" name="primary" value="#6366f1" data-color />
      </form-field>
      <form-field>
        <label for="secondary">Secondary</label>
        <input type="color" id="secondary" name="secondary" value="#ec4899" data-color />
      </form-field>
      <form-field>
        <label for="accent">Accent</label>
        <input type="color" id="accent" name="accent" value="#14b8a6" data-color />
      </form-field>
      <layout-cluster data-layout-gap="s">
        <button type="submit">Save palette</button>
        <button type="reset" class="secondary">Reset</button>
      </layout-cluster>
    </layout-stack>
  </form>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
