<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Steppers in a booking form</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    body > * { max-inline-size: 30rem; }
  </style>
</head>
<body>
  <form>
    <layout-stack data-layout-gap="m">
      <form-field>
        <label for="adults">Adults</label>
        <input type="number" id="adults" name="adults" min="1" max="10" step="1" value="2" data-stepper />
      </form-field>
      <form-field>
        <label for="children">Children</label>
        <input type="number" id="children" name="children" min="0" max="8" step="1" value="0" data-stepper />
      </form-field>
      <layout-cluster data-layout-gap="s">
        <button type="submit">Search</button>
        <button type="reset" class="secondary">Reset</button>
      </layout-cluster>
    </layout-stack>
  </form>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
