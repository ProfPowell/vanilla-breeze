<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Range in a form with reset</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    body > * { max-inline-size: 30rem; }
  </style>
</head>
<body>
  <form>
    <layout-stack data-layout-gap="l">
      <form-field>
        <label for="quality">Quality</label>
        <input type="range" id="quality" name="quality" data-range data-bubble data-suffix="%" min="0" max="100" value="60" />
        <output class="hint" for="quality">Higher quality makes larger files.</output>
      </form-field>
      <layout-cluster data-layout-gap="s">
        <button type="submit">Export</button>
        <button type="reset" class="secondary">Reset</button>
      </layout-cluster>
    </layout-stack>
  </form>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
