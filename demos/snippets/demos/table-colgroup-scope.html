<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Colgroup with Group Headers</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    /* Group tint on the column group; header cells keep their own background */
    colgroup.q2 { background: oklch(from var(--color-success) l c h / 0.12); }
    colgroup.q1,
    colgroup.q2 { border-inline-start: var(--border-width-medium) solid var(--color-border); }
  </style>
</head>
<body>
  <h1>Colgroup with Group Headers</h1>
  <table>
    <caption>Revenue and profit by region, first half 2025</caption>
    <colgroup span="1"></colgroup>
    <colgroup class="q1" span="2"></colgroup>
    <colgroup class="q2" span="2"></colgroup>
    <thead>
      <tr>
        <th scope="col" rowspan="2">Region</th>
        <th scope="colgroup" colspan="2">Q1</th>
        <th scope="colgroup" colspan="2">Q2</th>
      </tr>
      <tr>
        <th scope="col" data-numeric>Revenue</th>
        <th scope="col" data-numeric>Profit</th>
        <th scope="col" data-numeric>Revenue</th>
        <th scope="col" data-numeric>Profit</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th scope="row">North</th>
        <td data-numeric>$120k</td><td data-numeric>$18k</td>
        <td data-numeric>$134k</td><td data-numeric>$21k</td>
      </tr>
      <tr>
        <th scope="row">South</th>
        <td data-numeric>$98k</td><td data-numeric>$12k</td>
        <td data-numeric>$105k</td><td data-numeric>$15k</td>
      </tr>
      <tr>
        <th scope="row">West</th>
        <td data-numeric>$143k</td><td data-numeric>$24k</td>
        <td data-numeric>$151k</td><td data-numeric>$26k</td>
      </tr>
    </tbody>
  </table>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
