<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Time Relative Variant</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); max-inline-size: 65ch; }
  </style>
</head>
<body>
  <layout-stack data-layout-gap="s">
    <p>Posted <time class="relative" datetime="2026-02-23T09:00:00Z" data-relative>February 23, 2026</time></p>
    <p>Last edited <time class="relative" datetime="2026-06-30T16:45:00Z" data-relative>June 30, 2026</time></p>
    <p>Due <time class="relative" datetime="2027-01-15T12:00:00Z" data-format-date="relative">January 15, 2027</time></p>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
