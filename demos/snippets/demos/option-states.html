<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Option — States and Attributes</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <layout-center data-layout-max="narrow">
  <layout-stack data-layout-gap="l">
    <form-field>
      <label for="opt-placeholder">Placeholder option (required)</label>
      <select id="opt-placeholder" required>
        <option value="">Choose a category…</option>
        <option value="tech">Technology</option>
        <option value="design">Design</option>
      </select>
    </form-field>
    <form-field>
      <label for="opt-selected">Pre-selected option</label>
      <select id="opt-selected">
        <option value="en">English</option>
        <option value="es" selected>Spanish</option>
        <option value="fr">French</option>
      </select>
    </form-field>
    <form-field>
      <label for="opt-disabled">Disabled option</label>
      <select id="opt-disabled">
        <option value="free">Free plan</option>
        <option value="pro">Pro — $29/mo</option>
        <option value="enterprise" disabled>Enterprise — contact sales</option>
      </select>
    </form-field>
    <form-field>
      <label for="opt-label">label attribute (shown instead of the text)</label>
      <select id="opt-label">
        <option value="us" label="United States">US — United States of America</option>
        <option value="uk" label="United Kingdom">UK — United Kingdom of Great Britain and Northern Ireland</option>
      </select>
    </form-field>
    <form-field>
      <label for="opt-airport">Options in a datalist</label>
      <input type="text" id="opt-airport" list="opt-airports" />
      <datalist id="opt-airports">
        <option value="JFK" label="New York — John F. Kennedy"></option>
        <option value="LAX" label="Los Angeles International"></option>
        <option value="ORD" label="Chicago O’Hare"></option>
      </datalist>
    </form-field>
  </layout-stack>
  </layout-center>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
