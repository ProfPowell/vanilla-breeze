<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Body Landmark Skeleton</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    .skip-link {
      position: absolute;
      inset-block-start: 0;
      inset-inline-start: 0;
      padding: var(--size-s) var(--size-m);
      background: var(--color-surface);
      color: var(--color-text);
      border: var(--border-width-thin) solid var(--color-border);
      border-radius: var(--radius-s);
      z-index: 1000;
      transform: translateY(-120%);
    }

    .skip-link:focus-visible {
      transform: translateY(0);
    }

    body > :is(header, nav, main, footer) {
      padding: var(--size-m);
    }
  </style>
</head>
<body data-page-layout="sidebar-left">
  <a href="#main" class="skip-link">Skip to main content</a>

  <header>
    <h1>Site name</h1>
  </header>

  <nav aria-label="Primary">
    <ul>
      <li><a href="#main">Home</a></li>
      <li><a href="#main">Guides</a></li>
      <li><a href="#main">Reference</a></li>
    </ul>
  </nav>

  <main id="main">
    <h2>Page content</h2>
    <p>The body holds the landmarks. <code>data-page-layout="sidebar-left"</code> places each one in its grid area by element type: no classes needed. Press <kbd>Tab</kbd> to reveal the skip link.</p>
  </main>

  <footer>
    <p><small>Footer content</small></p>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
