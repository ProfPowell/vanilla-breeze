<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Layout Canvas: ghost card depth</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    .demo-label { color: var(--color-text-muted); font-size: var(--font-size-s); }
  </style>
</head>
<body>
  <h1>Layout Canvas: ghost card depth</h1>
  <layout-stack data-layout-gap="xl">
    <section>
      <p class="demo-label"><strong>data-canvas-depth="1"</strong></p>
      <article data-canvas data-canvas-depth="1">
        <h2>Single ghost card</h2>
        <p>One stacked paper sheet beneath the canvas.</p>
      </article>
    </section>

    <section>
      <p class="demo-label"><strong>data-canvas-depth="2"</strong></p>
      <article data-canvas data-canvas-depth="2">
        <h2>Double ghost cards</h2>
        <p>Two stacked paper sheets for extra depth.</p>
      </article>
    </section>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
