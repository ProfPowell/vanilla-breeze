<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>الموضع المنطقي في اتجاه من اليمين إلى اليسار</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    .demo-container {
      position: relative;
      block-size: 180px;
      background: var(--color-surface-alt);
      border-radius: var(--radius-m);
    }
    .position-label {
      background: var(--color-primary);
      color: var(--color-on-primary);
      padding: var(--size-xs) var(--size-s);
      border-radius: var(--radius-s);
      font-size: var(--font-size-s);
    }
  </style>
</head>
<body>
  <section class="demo-container">
    <layout-imposter>
      <span class="position-label">الوسط</span>
    </layout-imposter>
    <layout-imposter data-layout-position="top-start" data-layout-margin="s">
      <span class="position-label">أعلى البداية</span>
    </layout-imposter>
    <layout-imposter data-layout-position="bottom-end" data-layout-margin="s">
      <span class="position-label">أسفل النهاية</span>
    </layout-imposter>
  </section>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
