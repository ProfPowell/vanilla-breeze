<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Image variants and aspect ratios</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <h1>Image variants and aspect ratios</h1>
  <layout-stack data-layout-gap="l">
    <section>
      <h2>Variants</h2>
      <layout-grid data-layout-gap="m" data-layout-min="s">
        <figure>
          <img src="/src/assets/placeholders/photo-article-prose-1-300x200.svg" width="300" height="200" alt="Default image" />
          <figcaption>Default</figcaption>
        </figure>
        <figure>
          <img src="/src/assets/placeholders/photo-article-prose-1-300x200.svg" width="300" height="200" alt="Rounded" class="rounded" />
          <figcaption>.rounded</figcaption>
        </figure>
        <!-- figure > img fills the figure; a stack keeps these at their intrinsic size -->
        <layout-stack data-layout-gap="2xs" data-layout-align="start">
          <img src="/src/assets/placeholders/photo-reel-team-members-1-100x100.svg" width="96" height="96" alt="Circle avatar" class="circle" />
          <small>.circle</small>
        </layout-stack>
        <layout-stack data-layout-gap="2xs" data-layout-align="start">
          <img src="/src/assets/placeholders/photo-vb-float-e-200x150.svg" width="150" height="113" alt="Thumbnail" class="thumbnail" />
          <small>.thumbnail</small>
        </layout-stack>
      </layout-grid>
    </section>
    <section>
      <h2>Aspect ratios</h2>
      <p>The same 3:2 source cropped to each ratio class.</p>
      <layout-grid data-layout-gap="m" data-layout-min="s">
        <figure>
          <img src="/src/assets/placeholders/photo-figure-1-600x400.svg" width="600" height="400" alt="Source at its natural 3:2 ratio" />
          <figcaption>Original (3:2)</figcaption>
        </figure>
        <figure>
          <img src="/src/assets/placeholders/photo-figure-1-600x400.svg" width="600" height="400" alt="Square crop" class="ratio-square" />
          <figcaption>.ratio-square (1:1)</figcaption>
        </figure>
        <figure>
          <img src="/src/assets/placeholders/photo-figure-1-600x400.svg" width="600" height="400" alt="Widescreen crop" class="ratio-video" />
          <figcaption>.ratio-video (16:9)</figcaption>
        </figure>
        <figure>
          <img src="/src/assets/placeholders/photo-figure-1-600x400.svg" width="600" height="400" alt="Landscape crop" class="ratio-landscape" />
          <figcaption>.ratio-landscape (4:3)</figcaption>
        </figure>
        <figure>
          <img src="/src/assets/placeholders/photo-figure-1-600x400.svg" width="600" height="400" alt="Portrait crop" class="ratio-portrait" />
          <figcaption>.ratio-portrait (3:4)</figcaption>
        </figure>
      </layout-grid>
    </section>
    <section>
      <h2>Object fit</h2>
      <p>A square box around the 3:2 source: <code>.cover</code> crops, <code>.contain</code> letterboxes.</p>
      <layout-grid data-layout-gap="m" data-layout-min="s">
        <figure>
          <img src="/src/assets/placeholders/photo-figure-1-600x400.svg" width="600" height="400" alt="Cropped to fill a square" class="ratio-square cover" />
          <figcaption>.ratio-square.cover</figcaption>
        </figure>
        <figure>
          <img src="/src/assets/placeholders/photo-figure-1-600x400.svg" width="600" height="400" alt="Letterboxed inside a square" class="ratio-square contain thumbnail" />
          <figcaption>.ratio-square.contain</figcaption>
        </figure>
      </layout-grid>
    </section>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
