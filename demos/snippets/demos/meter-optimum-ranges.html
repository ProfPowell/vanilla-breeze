<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meter Optimum Ranges</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <h1>Meter Optimum Ranges</h1>
  <layout-grid data-layout-min="l" data-layout-gap="l">
    <section>
      <h2>Low Optimum (lower is better)</h2>
      <layout-stack data-layout-gap="m">
        <form-field>
          <label for="meter-cpu">CPU usage — 22% (good)</label>
          <meter id="meter-cpu" min="0" max="100" low="40" high="75" optimum="20" value="22">22%</meter>
        </form-field>
        <form-field>
          <label for="meter-memory">Memory — 61% (fair)</label>
          <meter id="meter-memory" min="0" max="100" low="40" high="75" optimum="20" value="61">61%</meter>
        </form-field>
        <form-field>
          <label for="meter-disk">Disk — 88% (poor)</label>
          <meter id="meter-disk" min="0" max="100" low="40" high="75" optimum="20" value="88">88%</meter>
        </form-field>
      </layout-stack>
    </section>

    <section>
      <h2>High Optimum (higher is better)</h2>
      <layout-stack data-layout-gap="m">
        <form-field>
          <label for="meter-html">HTML — 9/10 (good)</label>
          <meter id="meter-html" min="0" max="10" low="4" high="7" optimum="10" value="9">9/10</meter>
        </form-field>
        <form-field>
          <label for="meter-css">CSS — 7/10 (fair)</label>
          <meter id="meter-css" min="0" max="10" low="4" high="7" optimum="10" value="7">7/10</meter>
        </form-field>
        <form-field>
          <label for="meter-js">JavaScript — 3/10 (poor)</label>
          <meter id="meter-js" min="0" max="10" low="4" high="7" optimum="10" value="3">3/10</meter>
        </form-field>
      </layout-stack>
    </section>
  </layout-grid>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
