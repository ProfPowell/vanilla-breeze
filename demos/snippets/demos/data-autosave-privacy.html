<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>data-autosave: what is stored</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body {
      padding: var(--size-l);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <form data-autosave="privacy-demo" method="dialog">
    <layout-stack data-layout-gap="m">
      <input type="hidden" name="csrf" value="server-token-123"/>
      <form-field>
        <label for="pv-name">Name (saved)</label>
        <input type="text" id="pv-name" name="name" autocomplete="name"/>
      </form-field>
      <form-field>
        <label for="pv-card">Card number (never saved: autocomplete=cc-number)</label>
        <input type="text" id="pv-card" name="card" inputmode="numeric" autocomplete="cc-number"/>
      </form-field>
      <form-field>
        <label for="pv-pass">Password (never saved)</label>
        <input type="password" id="pv-pass" name="password" autocomplete="new-password"/>
      </form-field>
      <form-field>
        <label for="pv-note">Private note (never saved: data-autosave-ignore)</label>
        <textarea id="pv-note" name="note" rows="2" data-autosave-ignore></textarea>
      </form-field>
      <layout-cluster data-layout-gap="s">
        <button type="submit" name="action" value="send">Send</button>
        <button type="reset">Clear draft</button>
      </layout-cluster>
    </layout-stack>
  </form>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
