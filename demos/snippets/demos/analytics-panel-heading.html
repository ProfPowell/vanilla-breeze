<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Analytics Panel — Heading</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <main>
    <h1>Privacy policy</h1>
    <section aria-labelledby="data-we-collect">
      <h2 id="data-we-collect">Data we collect</h2>
      <p>The panel sits inside this section, so its heading is an <code>h3</code> (<code>heading-level="3"</code>) and its field-list subheading an <code>h4</code>.</p>
      <analytics-panel heading="What we send from this page" heading-level="3"></analytics-panel>
    </section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
