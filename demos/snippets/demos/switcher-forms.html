<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Switcher: element and attribute forms</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    .demo-box {
      background: var(--color-surface-raised);
      padding: var(--size-m);
      border-radius: var(--radius-s);
    }
  </style>
</head>
<body>
  <h1>Switcher: element and attribute forms</h1>
  <layout-stack data-layout-gap="l">
    <section>
      <p><strong>Element form</strong> &mdash; <code>&lt;layout-switcher&gt;</code></p>
      <layout-switcher data-layout-gap="s" data-layout-threshold="l">
        <article class="demo-box"><h2>One</h2><p>Side by side when the switcher is wider than 40rem.</p></article>
        <article class="demo-box"><h2>Two</h2><p>Stacked when it is narrower.</p></article>
      </layout-switcher>
    </section>

    <section>
      <p><strong>Attribute form</strong> &mdash; <code>&lt;section data-layout="switcher"&gt;</code></p>
      <section data-layout="switcher" data-layout-gap="s" data-layout-threshold="l">
        <article class="demo-box"><h2>One</h2><p>Same modifiers, no wrapper element.</p></article>
        <article class="demo-box"><h2>Two</h2><p>The section is the switcher.</p></article>
      </section>
    </section>
  </layout-stack>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
