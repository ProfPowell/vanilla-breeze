<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Switch settings group</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    body > * { max-inline-size: 30rem; }
  </style>
</head>
<body>
  <fieldset>
    <legend>Notification preferences</legend>
    <layout-stack data-layout-gap="s">
      <label><input type="checkbox" data-switch name="email" checked /> Email notifications</label>
      <label><input type="checkbox" data-switch name="sms" /> SMS notifications</label>
      <label><input type="checkbox" data-switch name="push" checked /> Push notifications</label>
    </layout-stack>
  </fieldset>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
