<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cluster: Element and Attribute Forms</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    .demo-host { outline: var(--border-width-thin) dashed var(--color-border); outline-offset: var(--size-3xs); }

  </style>
</head>
<body>
  <h1>Cluster: Element and Attribute Forms</h1>
  <layout-grid data-layout-min="l" data-layout-gap="l">
    <section aria-labelledby="cluster-el-heading">
      <h2 id="cluster-el-heading">Element form</h2>
      <layout-cluster id="cluster-element" class="demo-host" data-layout-gap="xs">
        <layout-badge>HTML</layout-badge>
        <layout-badge>CSS</layout-badge>
        <layout-badge>JavaScript</layout-badge>
        <layout-badge>Accessibility</layout-badge>
      </layout-cluster>
    </section>

    <section aria-labelledby="cluster-attr-heading">
      <h2 id="cluster-attr-heading">Attribute form</h2>
      <ul id="cluster-attribute" class="unstyled demo-host" data-layout="cluster" data-layout-gap="xs">
        <li><layout-badge>HTML</layout-badge></li>
        <li><layout-badge>CSS</layout-badge></li>
        <li><layout-badge>JavaScript</layout-badge></li>
        <li><layout-badge>Accessibility</layout-badge></li>
      </ul>
    </section>
  </layout-grid>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
