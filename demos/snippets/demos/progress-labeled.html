<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Progress Labeled</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <layout-center data-layout-max="narrow">
  <layout-stack data-layout-gap="l">
    <section class="labeled">
      <header>
        <label for="progress-upload">Uploading file.zip</label>
        <output id="progress-upload-value" for="progress-upload">45%</output>
      </header>
      <progress id="progress-upload" aria-describedby="progress-upload-value" value="45" max="100">45%</progress>
    </section>
    <section class="labeled">
      <header>
        <label for="progress-updates">Installing updates</label>
        <output id="progress-updates-value" for="progress-updates">78%</output>
      </header>
      <progress id="progress-updates" aria-describedby="progress-updates-value" value="78" max="100">78%</progress>
    </section>
  </layout-stack>
  </layout-center>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
