<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iframe Variants</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <h1>Iframe Variants</h1>
  <layout-stack data-layout-gap="xl">
    <section>
      <h2>Default (no border)</h2>
      <iframe src="/docs/snippets/demos/iframe-content.html" title="Default iframe" width="300" height="180"></iframe>
    </section>
    <section>
      <h2>.bordered</h2>
      <iframe src="/docs/snippets/demos/iframe-content.html" title="Bordered iframe" class="bordered" width="300" height="180"></iframe>
    </section>
    <section>
      <h2>.rounded</h2>
      <iframe src="/docs/snippets/demos/iframe-content.html" title="Rounded iframe" class="rounded" width="300" height="180"></iframe>
    </section>
    <section>
      <h2>.full (100% width, height attribute kept)</h2>
      <iframe src="/docs/snippets/demos/iframe-content.html" title="Full width iframe" class="full bordered" height="180"></iframe>
    </section>
    <section>
      <h2>.fixed (100% width, 400px tall)</h2>
      <iframe src="/docs/snippets/demos/iframe-content.html" title="Fixed height iframe" class="fixed bordered"></iframe>
    </section>
    <section>
      <h2>data-ratio="4:3" (height follows width)</h2>
      <iframe src="/docs/snippets/demos/iframe-content.html" title="4:3 iframe sized by data-ratio" class="bordered" width="400" height="300" data-ratio="4:3"></iframe>
    </section>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
