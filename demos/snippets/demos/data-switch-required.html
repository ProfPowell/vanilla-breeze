<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Required switch</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    body > * { max-inline-size: 30rem; }
  </style>
</head>
<body>
  <form>
    <layout-stack data-layout-gap="m">
      <form-field>
        <label><input type="checkbox" data-switch name="terms" id="terms" required /> Accept the terms</label>
        <output class="hint" for="terms">You must agree before continuing.</output>
        <output class="error" for="terms" aria-live="polite">Turn this on to continue.</output>
      </form-field>
      <button type="submit">Continue</button>
    </layout-stack>
  </form>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
