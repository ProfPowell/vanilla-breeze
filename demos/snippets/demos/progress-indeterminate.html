<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Progress Indeterminate</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <layout-center data-layout-max="narrow">
  <layout-stack data-layout-gap="m">
    <form-field>
      <label for="progress-loading">Loading...</label>
      <progress id="progress-loading">Loading...</progress>
    </form-field>
    <form-field>
      <label for="progress-connecting">Connecting to server...</label>
      <progress id="progress-connecting">Connecting...</progress>
    </form-field>
  </layout-stack>
  </layout-center>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
