<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Imposter Notification Badge</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    .badge-anchor {
      position: relative;
      inline-size: fit-content;
    }
    .badge {
      background: var(--color-error);
      color: var(--color-text-on-error-auto, white);
      font-size: var(--font-size-xs);
      padding: 0.125rem 0.375rem;
      border-radius: var(--radius-full);
      font-weight: 600;
      translate: 50% -50%;
    }
  </style>
</head>
<body>
  <layout-cluster class="badge-anchor">
    <button type="button" aria-label="Notifications, 3 unread">Notifications</button>
    <layout-imposter data-layout-position="top-end">
      <span class="badge" aria-hidden="true">3</span>
    </layout-imposter>
  </layout-cluster>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
