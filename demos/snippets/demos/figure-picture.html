<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Figure with Picture</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <figure>
    <picture>
      <source media="(min-width: 600px)" srcset="/src/assets/placeholders/photo-vb-fig-pic-w-600x300.svg" />
      <img src="/src/assets/placeholders/photo-vb-fig-pic-n-400x300.svg" alt="Responsive image in figure" />
    </picture>
    <figcaption>A responsive image using the picture element.</figcaption>
  </figure>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
