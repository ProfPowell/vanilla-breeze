<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>data-show-when: checkbox group and compound conditions</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body {
      padding: var(--size-l);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <form data-layout="stack" data-layout-gap="m">
    <fieldset>
      <legend>Topics</legend>
      <label><input type="checkbox" name="topics" value="news"/> News</label>
      <label><input type="checkbox" name="topics" value="sports"/> Sports</label>
      <label><input type="checkbox" name="topics" value="weather"/> Weather</label>
    </fieldset>
    <form-field data-show-when="topics=sports">
      <label for="team">Favourite team</label>
      <input type="text" id="team" name="team"/>
    </form-field>
    <form-field data-show-when="topics=news &amp;&amp; topics=weather">
      <label for="region">Region for news and weather</label>
      <input type="text" id="region" name="region"/>
    </form-field>
    <button type="submit">Save</button>
  </form>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
