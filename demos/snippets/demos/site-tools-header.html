<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Site Tools in a Header</title>
  <link rel="stylesheet" href="/src/main.css" />
</head>
<body>
  <header class="site">
    <a href="#"><brand-mark>Acme Inc</brand-mark></a>
    <nav class="horizontal pills" aria-label="Main navigation">
      <ul>
        <li><a href="#">About</a></li>
        <li><a href="#">Docs</a></li>
      </ul>
    </nav>
    <site-tools role="group" aria-label="Site tools">
      <site-search>
        <button type="button" data-trigger class="ghost">
          <icon-wc name="search" size="sm"></icon-wc>
          Search
        </button>
      </site-search>
      <theme-picker compact>
        <button type="button" data-trigger class="ghost">
          <icon-wc name="palette" size="sm"></icon-wc>
          Theme
        </button>
      </theme-picker>
    </site-tools>
    <mobile-menu breakpoint="40rem">
      <button type="button" data-trigger popovertarget="demo-menu" aria-label="Menu">
        <icon-wc name="menu"></icon-wc>
      </button>
      <nav popover id="demo-menu" class="mobile-menu-panel" aria-label="Site menu">
        <button type="button" class="mobile-menu-close" popovertarget="demo-menu" popovertargetaction="hide" aria-label="Close menu">
          <icon-wc name="x"></icon-wc>
        </button>
        <ul>
          <li><a href="#">About</a></li>
          <li><a href="#">Docs</a></li>
        </ul>
        <section class="mobile-menu-theme" aria-label="Site tools">
          <site-search>
            <button type="button" data-trigger class="ghost">Search</button>
          </site-search>
          <theme-picker variant="inline" compact></theme-picker>
        </section>
      </nav>
    </mobile-menu>
  </header>
  <main>
    <p>Below 40rem, <code>&lt;mobile-menu&gt;</code> hides <code>&lt;site-tools&gt;</code>, so the same tools are repeated inside the menu panel.</p>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
