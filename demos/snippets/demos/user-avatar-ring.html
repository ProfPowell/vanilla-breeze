<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>User Avatar With Ring</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <layout-stack data-layout-gap="l">
    <layout-cluster data-layout-gap="m" data-layout-align="center">
      <user-avatar data-size="lg" data-ring>
        <img src="/src/assets/placeholders/photo-reel-team-members-4-100x100.svg" alt="Riya Gupta" />
      </user-avatar>
      <user-avatar data-size="lg" data-ring role="img" aria-label="Ravi Ghosh">
        <span data-fallback aria-hidden="true">RG</span>
      </user-avatar>
    </layout-cluster>
    <ul class="unstyled" data-layout="cluster" data-layout-overlap>
      <li><user-avatar data-ring><img src="/src/assets/placeholders/photo-reel-team-members-1-100x100.svg" alt="Jane Doe" /></user-avatar></li>
      <li><user-avatar data-ring><img src="/src/assets/placeholders/photo-reel-team-members-2-100x100.svg" alt="John Smith" /></user-avatar></li>
      <li><user-avatar data-ring role="img" aria-label="3 more reviewers"><span data-fallback aria-hidden="true">+3</span></user-avatar></li>
    </ul>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
