<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reel Image Gallery</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <section data-layout="reel" data-layout-gap="m" data-layout-item-width="m" data-layout-scrollbar aria-label="Gallery" tabindex="0">
    <figure data-media data-ratio="4:3" data-radius="m">
      <img src="/src/assets/placeholders/photo-reel-image-gallery-1-400x300.svg" alt="Gallery image 1" loading="lazy" />
    </figure>
    <figure data-media data-ratio="4:3" data-radius="m">
      <img src="/src/assets/placeholders/photo-reel-image-gallery-2-400x300.svg" alt="Gallery image 2" loading="lazy" />
    </figure>
    <figure data-media data-ratio="4:3" data-radius="m">
      <img src="/src/assets/placeholders/photo-reel-image-gallery-3-400x300.svg" alt="Gallery image 3" loading="lazy" />
    </figure>
    <figure data-media data-ratio="4:3" data-radius="m">
      <img src="/src/assets/placeholders/photo-reel-image-gallery-4-400x300.svg" alt="Gallery image 4" loading="lazy" />
    </figure>
    <figure data-media data-ratio="4:3" data-radius="m">
      <img src="/src/assets/placeholders/photo-reel-image-gallery-5-400x300.svg" alt="Gallery image 5" loading="lazy" />
    </figure>
  </section>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
