<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Loading Spinner - Overlay</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body {
      padding: var(--size-l);
      background: var(--color-surface);
    }
    .loading-region {
      position: relative;
      padding: var(--size-m);
      border: var(--border-width-thin) solid var(--color-border);
      border-radius: var(--radius-m);
    }
  </style>
</head>
<body>
  <h1>Loading Spinner Overlay</h1>
  <section class="loading-region" aria-busy="true">
    <h2>Quarterly report</h2>
    <p>Revenue grew across every region this quarter, led by the new subscription tiers.</p>
    <p>Support volume fell after the onboarding redesign shipped.</p>
    <loading-spinner data-overlay data-size="l" data-variant="primary" role="status" aria-label="Loading report"></loading-spinner>
  </section>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
