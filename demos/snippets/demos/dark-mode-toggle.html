<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Dark Mode Toggle Demo</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body {
      padding: var(--size-m);
      background: var(--color-surface);
      font-family: var(--font-sans), sans-serif;
    }

    h3 {
      font-size: var(--font-size-s);
      color: var(--color-text-muted);
      margin-block: var(--size-l) var(--size-s);
    }

    h3:first-of-type {
      margin-block-start: 0;
    }

    /* Toggle button */
    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: var(--size-xs);
      padding: var(--size-xs) var(--size-s);
      background: var(--color-surface-raised);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-m);
      cursor: pointer;
      color: var(--color-text);
      font-size: var(--font-size-s);
      transition: background var(--duration-fast) var(--ease-out);
    }

    .theme-toggle:hover {
      background: var(--color-border);
    }

    .theme-toggle .icon-sun,
    .theme-toggle .icon-moon {
      inline-size: 20px;
      block-size: 20px;
    }

    .theme-toggle .icon-sun { display: none; }
    .theme-toggle .icon-moon { display: block; }

    :root[data-mode="dark"] .theme-toggle .icon-sun { display: block; }
    :root[data-mode="dark"] .theme-toggle .icon-moon { display: none; }

    @media (prefers-color-scheme: dark) {
      :root:not([data-mode]) .theme-toggle .icon-sun { display: block; }
      :root:not([data-mode]) .theme-toggle .icon-moon { display: none; }
    }

  </style>
</head>
<body>
  <h1>Dark Mode Toggle Demo</h1>
  <h2>Toggle Button</h2>
  <button type="button" class="theme-toggle" aria-label="Toggle theme">
    <icon-wc name="moon" class="icon-moon"></icon-wc>
    <icon-wc name="sun" class="icon-sun"></icon-wc>
    <span>Toggle Theme</span>
  </button>

  <h2>Three-Way Selector</h2>
  <fieldset data-segmented>
    <legend class="visually-hidden">Theme</legend>
    <label><input type="radio" name="mode" value="light" /> Light</label>
    <label><input type="radio" name="mode" value="system" checked /> System</label>
    <label><input type="radio" name="mode" value="dark" /> Dark</label>
  </fieldset>

  <layout-card>
    <h3>Preview Card</h3>
    <p>This card shows how colors adapt to the current theme.</p>
    <p><layout-badge data-color="primary" id="mode-label">System</layout-badge></p>
  </layout-card>

  <script type="module" src="/src/main.js"></script>
  <script>
    const root = document.documentElement;
    const toggle = document.querySelector('.theme-toggle');
    const switcher = document.querySelector('[data-segmented]');
    const modeLabel = document.getElementById('mode-label');

    function updateLabel() {
      const mode = root.dataset.mode;
      if (mode === 'light') {
        modeLabel.textContent = 'Light Mode';
      } else if (mode === 'dark') {
        modeLabel.textContent = 'Dark Mode';
      } else {
        modeLabel.textContent = 'System';
      }
    }

    function updateSwitcher() {
      const mode = root.dataset.mode || 'system';
      switcher.querySelector(`input[value="${mode}"]`).checked = true;
    }

    toggle.addEventListener('click', () => {
      const isDark = root.dataset.mode === 'dark' ||
        (!root.dataset.mode && window.matchMedia('(prefers-color-scheme: dark)').matches);

      root.dataset.mode = isDark ? 'light' : 'dark';
      updateLabel();
      updateSwitcher();
    });

    switcher.addEventListener('change', (e) => {
      const { value } = e.target;
      if (value === 'system') {
        delete root.dataset.mode;
      } else {
        root.dataset.mode = value;
      }

      updateLabel();
    });

    updateLabel();
  </script>
</body>
</html>
