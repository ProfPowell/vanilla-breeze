<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cover Error Page</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: 0; background: var(--color-surface); }
  </style>
</head>
<body>
  <main data-layout="cover" data-layout-padding="l" data-layout-centered>
    <section data-layout-principal>
      <layout-stack data-layout-gap="m" data-layout-align="center">
        <p class="display-heading">404</p>
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist.</p>
        <a href="/" class="button">Go Home</a>
      </layout-stack>
    </section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
