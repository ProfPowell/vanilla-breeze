<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>data-wizard driving a progress-tracker</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body {
      padding: var(--size-l);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <layout-stack data-layout-gap="l">
    <progress-tracker id="signup-progress" data-clickable data-label-list="Sign-up progress">
      <ol>
        <li data-step="account">Account</li>
        <li data-step="profile">Profile</li>
        <li data-step="review">Review</li>
      </ol>
    </progress-tracker>
    <form data-wizard data-wizard-steps="#signup-progress">
      <fieldset data-wizard-step>
        <legend>Account</legend>
        <form-field>
          <label for="pt-email">Email</label>
          <input type="email" id="pt-email" name="email" autocomplete="email" required/>
        </form-field>
      </fieldset>
      <fieldset data-wizard-step>
        <legend>Profile</legend>
        <form-field>
          <label for="pt-name">Full name</label>
          <input type="text" id="pt-name" name="fullname" autocomplete="name" required/>
        </form-field>
      </fieldset>
      <fieldset data-wizard-step data-wizard-summary>
        <legend>Review</legend>
      </fieldset>
      <nav data-wizard-nav aria-label="Sign-up steps">
        <button type="button" data-wizard-prev>Back</button>
        <button type="button" data-wizard-next>Next</button>
        <button type="submit">Create account</button>
      </nav>
    </form>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
