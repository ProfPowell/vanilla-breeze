<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fixed Imposter</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <layout-stack data-layout-gap="m">
    <h1>Fixed to the viewport</h1>
    <p>With <code>data-layout-fixed</code> the imposter is placed against the viewport instead of a positioned ancestor, and it stays put while the page scrolls.</p>
    <p>The status card sits in the bottom-end corner: bottom right in left-to-right pages, bottom left in right-to-left pages.</p>
  </layout-stack>

  <layout-imposter data-layout-fixed data-layout-position="bottom-end" data-layout-margin="m">
    <layout-card data-variant="elevated" data-padding="m" role="status">
      <p>Draft saved</p>
    </layout-card>
  </layout-imposter>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
