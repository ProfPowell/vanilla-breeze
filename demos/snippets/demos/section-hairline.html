<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Section hairline rules</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: 0; background: var(--color-surface); }
  </style>
</head>
<body>
  <h1>Section hairline rules</h1>
  <section data-padding>
    <hr data-position="top" />
    <h2>Top hairline</h2>
    <p>An <code>&lt;hr data-position="top"&gt;</code> becomes an edge-to-edge rule pinned to the top of the section, outside the content flow.</p>
  </section>
  <section data-padding>
    <h2>Bottom hairline</h2>
    <p>Use <code>data-position="bottom"</code> to pin it to the bottom edge instead.</p>
    <hr data-position="bottom" />
  </section>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
