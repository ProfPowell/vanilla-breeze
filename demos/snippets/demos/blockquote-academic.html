<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Academic Citation Patterns</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <h1>Academic Citation Patterns</h1>
  <layout-stack data-layout-gap="l">
    <section>
      <h2>Academic citation with cite attribute</h2>
      <figure class="quote">
        <blockquote cite="https://doi.org/10.1000/example">
          <p>The results demonstrate a statistically significant correlation between design simplicity and user satisfaction scores (p &lt; 0.01).</p>
        </blockquote>
        <figcaption>Smith &amp; Jones (2025), <cite>Journal of Web Usability</cite>, Vol. 12, pp. 45&ndash;62</figcaption>
      </figure>
    </section>
    <section>
      <h2>Multiple sources</h2>
      <p>Sources in this demo are fictional.</p>
      <figure class="quote">
        <blockquote cite="https://example.com/paper1">
          <p>Progressive enhancement is not a technology choice; it is a design philosophy rooted in resilience.</p>
        </blockquote>
        <figcaption>Okafor (2024), <cite>Proceedings of the Example Web Symposium</cite></figcaption>
      </figure>
      <figure class="quote">
        <blockquote cite="https://example.com/paper2">
          <p>The accessibility benefits of semantic HTML are well-documented and measurable.</p>
        </blockquote>
        <figcaption>Chen et al. (2025), <cite>Journal of Example Accessibility Studies</cite></figcaption>
      </figure>
    </section>
    <section>
      <h2>Epigraph pattern</h2>
      <figure class="quote">
        <blockquote>
          <p>The Analytical Engine weaves algebraical patterns just as the Jacquard-loom weaves flowers and leaves.</p>
        </blockquote>
        <figcaption>Ada Lovelace, <cite>Notes on the Analytical Engine</cite> (1843)</figcaption>
      </figure>
    </section>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
