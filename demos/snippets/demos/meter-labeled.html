<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meter Labeled</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <layout-center data-layout-max="narrow">
  <layout-stack data-layout-gap="l">
    <section class="labeled">
      <header>
        <label for="meter-quota">Storage</label>
        <output id="meter-quota-value" for="meter-quota">14.3 GB / 20 GB</output>
      </header>
      <meter id="meter-quota" aria-describedby="meter-quota-value" value="14.3" min="0" max="20" low="5" high="17" optimum="0">71.5%</meter>
    </section>
    <section class="labeled">
      <header>
        <label for="meter-strength">Password strength</label>
        <output id="meter-strength-value" for="meter-strength">Strong</output>
      </header>
      <meter id="meter-strength" aria-describedby="meter-strength-value" value="0.85" min="0" max="1" low="0.3" high="0.6" optimum="1">85%</meter>
    </section>
  </layout-stack>
  </layout-center>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
