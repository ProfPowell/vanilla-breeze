<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resizable Sidebar</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    .panel { padding: var(--size-s); border: var(--border-width-thin) solid var(--color-border); border-radius: var(--radius-m); }
  </style>
</head>
<body>
  <h1>Resizable Sidebar</h1>
  <section data-layout="sidebar" data-splitter aria-label="Resizable file browser">
    <nav class="panel" aria-label="Files">
      <ul class="unstyled">
        <li><a href="#">index.html</a></li>
        <li><a href="#">styles.css</a></li>
        <li><a href="#">main.js</a></li>
      </ul>
    </nav>
    <main class="panel">
      <p>Drag the divider, or focus it and use the arrow keys, to resize the navigation.</p>
    </main>
  </section>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
