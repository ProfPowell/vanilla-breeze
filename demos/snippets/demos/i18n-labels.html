<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Translated component strings</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <h1 class="visually-hidden">Component strings in two languages</h1>
  <layout-grid data-layout-min="m" data-layout-gap="l">

    <section lang="en" data-layout="stack" data-layout-gap="m">
      <h2>English defaults</h2>
      <form-field>
        <label for="when-en">Travel date</label>
        <date-picker>
          <input type="date" id="when-en" name="when-en" />
        </date-picker>
      </form-field>
      <star-rating name="trip-en" value="4" label="Rate the journey"></star-rating>
      <p>Open search with <kbd data-hotkey="ctrl+k">Ctrl+K</kbd></p>
    </section>

    <section lang="de" data-layout="stack" data-layout-gap="m" data-label-ctrl="Strg">
      <h2>Deutsch</h2>
      <form-field>
        <label for="when-de">Reisedatum</label>
        <date-picker
          data-label-toggle="Kalender öffnen"
          data-label-dialog="Datum wählen"
          data-label-prev="Vorheriger Monat"
          data-label-next="Nächster Monat"
          data-label-year="Jahr"
          data-label-placeholder="Datum eingeben…">
          <input type="date" id="when-de" name="when-de" />
        </date-picker>
      </form-field>
      <star-rating name="trip-de" value="4" label="Reise bewerten"
        data-label-one="{n} Stern" data-label-other="{n} Sterne"></star-rating>
      <p>Suche öffnen mit <kbd data-hotkey="ctrl+k">Strg+K</kbd></p>
    </section>

  </layout-grid>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
