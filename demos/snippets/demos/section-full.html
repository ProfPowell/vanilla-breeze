<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Section Full</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: 0; background: var(--color-surface); } section.full { background: var(--color-surface-raised); }
  </style>

  <h1>Section Full</h1>
  <section class="full">
    <h2>Spacious Section</h2>

  </section>
  <script type="module" src="/src/main.js"></script>
