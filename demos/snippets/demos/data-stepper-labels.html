<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stepper with translated button names</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    body > * { max-inline-size: 30rem; }
  </style>
</head>
<body>
  <form-field lang="fr">
    <label for="invites">Invités</label>
    <input type="number" id="invites" name="invites" min="1" max="12" value="2" data-stepper
      data-label-decrease="Moins d’invités" data-label-increase="Plus d’invités" />
  </form-field>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
