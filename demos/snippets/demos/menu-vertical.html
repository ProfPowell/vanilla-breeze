<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Menu — Vertical</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <main data-layout="sidebar" data-layout-sidebar-width="narrow" data-layout-gap="l">
    <aside aria-label="Workspace">
      <menu class="vertical">
        <li><button type="button" class="ghost">Dashboard</button></li>
        <li><button type="button" class="ghost">Projects</button></li>
        <li><button type="button" class="ghost">Tasks</button></li>
        <li role="separator"></li>
        <li><button type="button" class="ghost">Settings</button></li>
      </menu>
    </aside>
    <section>
      <h1>Dashboard</h1>
      <p>The vertical menu fills its sidebar column and stacks its commands.</p>
    </section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
