<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Range tick markers</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    body > * { max-inline-size: 30rem; }
  </style>
</head>
<body>
  <form-field>
    <label for="temp">Temperature</label>
    <input type="range" id="temp" name="temp" data-range data-bubble data-markers data-suffix="°F" min="60" max="90" step="5" value="70" />
  </form-field>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
