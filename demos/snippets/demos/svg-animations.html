<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SVG animations</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <h1>SVG animations</h1>
  <layout-cluster data-layout-gap="l">
    <figure>
      <svg class="l currentcolor spin" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg>
      <figcaption>.spin</figcaption>
    </figure>
    <figure>
      <svg class="l currentcolor pulse" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10" /><path d="M12 16v-4M12 8h.01" /></svg>
      <figcaption>.pulse</figcaption>
    </figure>
  </layout-cluster>
  <p>Both animations stop when the OS asks for reduced motion or the page sets <code>data-motion-reduced</code> on the root element.</p>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
