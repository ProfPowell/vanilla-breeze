<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visually Hidden Figcaption</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <figure>
    <img src="/src/assets/placeholders/photo-figcaption-6-500x283.svg" alt="Bar chart of monthly sign-ups, rising from 40 in January to 120 in June" />
    <figcaption class="hidden">Figure 4: Sign-ups tripled in the first half of the year.</figcaption>
  </figure>
  <p><small>The figure above has a visually hidden caption that still names it for assistive technology.</small></p>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
