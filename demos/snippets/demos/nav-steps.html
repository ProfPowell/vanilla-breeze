<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nav Steps</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <h1>Nav Steps</h1>
  <layout-stack data-layout-gap="xl">
    <nav class="steps" aria-label="Checkout progress">
      <ol>
        <li data-completed><a href="#">Cart</a></li>
        <li aria-current="step">Shipping</li>
        <li>Payment</li>
        <li>Review</li>
      </ol>
    </nav>
    <nav class="steps" data-labels="below" aria-label="Account setup progress">
      <ol>
        <li data-completed>Account</li>
        <li aria-current="step">Details</li>
        <li>Preferences</li>
        <li>Review</li>
      </ol>
    </nav>
    <nav class="steps" data-direction="vertical" aria-label="Onboarding progress">
      <ol>
        <li data-completed>Create workspace</li>
        <li aria-current="step">Invite team</li>
        <li>Connect tools</li>
      </ol>
    </nav>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
