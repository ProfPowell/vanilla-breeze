<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>data-count: no limit</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body {
      padding: var(--size-l);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <layout-stack data-layout-gap="l">
    <form-field>
      <label for="notes">Notes</label>
      <textarea id="notes" name="notes" data-count rows="3"></textarea>
    </form-field>
    <form-field>
      <label for="freeform">Freeform</label>
      <textarea id="freeform" name="freeform" data-count="words" rows="3"></textarea>
    </form-field>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
