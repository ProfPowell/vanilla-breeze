<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>track: captions and chapters</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    /* Speaker voices: ::cue(v[voice]) styles a <v Narrator> span */
    video::cue(v[voice="Narrator"]) {
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1>Captions and chapters from local WebVTT files</h1>
  <layout-stack data-layout-gap="s">
    <video controls preload="metadata" poster="/docs/examples/demos/assets/poster.jpg">
      <source src="/docs/examples/demos/assets/sample.mp4" type="video/mp4" />
      <track kind="captions" src="assets/track-captions-en.vtt" srclang="en" label="English captions" default />
      <track kind="chapters" src="assets/track-chapters-en.vtt" srclang="en" label="Chapters" default data-chapter-list />
      <p><a href="/docs/examples/demos/assets/sample.mp4" download>Download the video</a></p>
    </video>
    <p><small>Captions use VB's token-based <code>::cue</code> defaults. The chapter list below the video comes from the <code>chapters</code> track via <code>data-chapter-list</code>; browsers do not show chapter tracks on their own.</small></p>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
