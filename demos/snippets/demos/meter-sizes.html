<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meter Sizes</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <layout-center data-layout-max="narrow">
  <layout-stack data-layout-gap="m">
    <form-field>
      <label for="meter-size-xs">.xs (decorative hairline)</label>
      <meter id="meter-size-xs" class="xs" value="0.6" min="0" max="1">60%</meter>
    </form-field>
    <form-field>
      <label for="meter-size-s">.s (small)</label>
      <meter id="meter-size-s" class="s" value="0.6" min="0" max="1">60%</meter>
    </form-field>
    <form-field>
      <label for="meter-size-m">Default — 60%</label>
      <meter id="meter-size-m" value="0.6" min="0" max="1">60%</meter>
    </form-field>
    <form-field>
      <label for="meter-size-l">.l (large)</label>
      <meter id="meter-size-l" class="l" value="0.6" min="0" max="1">60%</meter>
    </form-field>
  </layout-stack>
  </layout-center>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
