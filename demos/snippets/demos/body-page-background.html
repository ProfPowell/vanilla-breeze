<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Body Page Background Hooks</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    :root {
      --page-bg-color: color-mix(in oklch, var(--color-surface) 85%, var(--color-primary));
      --page-bg-gradient: linear-gradient(160deg,
        color-mix(in oklch, var(--color-surface) 80%, var(--color-primary)),
        color-mix(in oklch, var(--color-surface) 90%, var(--color-accent)));
      --page-bg-attachment: fixed;
    }

    main {
      padding: var(--size-l);
    }
  </style>
</head>
<body>
  <main>
    <h1>Page background hooks</h1>
    <p>This page sets <code>--page-bg-color</code>, <code>--page-bg-gradient</code> and <code>--page-bg-attachment</code> on <code>:root</code>. The reset paints them on <code>&lt;body&gt;</code>; no rule targets <code>body</code> directly.</p>
    <p>The gradient follows the theme because it mixes theme tokens rather than fixed colors.</p>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
