<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video Chapter Markers</title>
  <link rel="stylesheet" href="/src/main.css" />
  <script type="module" src="/src/main.js"></script>
  <style>
    body { padding: var(--size-m); background: var(--color-surface); }
  </style>
</head>
<body>
  <h1>Video Chapter Markers</h1>
  <layout-stack>
    <article>
      <h2>Tutorial with Chapters</h2>
      <p>Click any chapter below the video to jump to that section. The current chapter highlights during playback and is exposed to assistive technology with <code>aria-current</code>.</p>
      <video controls preload="metadata" poster="/docs/examples/demos/assets/poster.jpg">
        <source src="/docs/examples/demos/assets/sample.mp4" type="video/mp4" />
        <track kind="captions" src="assets/track-captions-en.vtt" srclang="en" label="English captions" />
        <track kind="chapters" src="assets/track-chapters-en.vtt" srclang="en" default data-chapter-list data-label="Tutorial chapters" />
        <p><a href="/docs/examples/demos/assets/sample.mp4" download>Download the video</a></p>
      </video>
    </article>
  </layout-stack>
</body>
</html>
