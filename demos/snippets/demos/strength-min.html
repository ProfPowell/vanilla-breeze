<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>data-strength-min</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <form data-layout="stack" data-layout-gap="m">
    <form-field>
      <label for="str-min">New password</label>
      <input type="password" id="str-min" name="password" autocomplete="new-password" required
        data-strength data-strength-min="good"
        data-rules="length:10,uppercase,lowercase,number" />
    </form-field>
    <p><button type="submit">Create account</button> <button type="reset">Reset</button></p>
  </form>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
