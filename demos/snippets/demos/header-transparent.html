<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Header Transparent</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: 0; background: var(--color-surface); }
    .hero-band {
      min-block-size: 22rem;
      padding: calc(3rem + 4 * var(--size-m)) var(--size-l) var(--size-xl);
      background: linear-gradient(135deg, var(--color-primary), var(--color-accent, var(--color-primary)));
      color: var(--color-text-on-primary);
    }
    .hero-band :is(h1, p) { color: inherit; }
    header.transparent { --_link-color: currentColor; color: var(--color-text-on-primary); }
  </style>
</head>
<body>
  <header class="site transparent">
    <strong>Brand</strong>
    <nav class="horizontal pills" aria-label="Main">
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Work</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section class="hero-band">
      <h1>Header over a hero</h1>
      <p>The transparent header is positioned over the band; the band's top padding keeps the heading clear of it.</p>
    </section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
