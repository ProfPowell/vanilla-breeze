<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sidebar No-Wrap</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
  </style>
</head>
<body>
  <layout-stack data-layout-gap="xl">
    <section>
      <p><strong>Default</strong> &mdash; wraps below the sidebar when the container is narrow</p>
      <layout-sidebar data-layout-sidebar-width="narrow">
        <nav aria-label="Default example"><layout-card data-variant="outlined" data-padding="s"><p>Sidebar</p></layout-card></nav>
        <section><layout-card data-variant="outlined" data-padding="s"><p>Content</p></layout-card></section>
      </layout-sidebar>
    </section>
    <section>
      <p><strong>data-layout-nowrap</strong> &mdash; the sidebar always stays beside the content</p>
      <layout-sidebar data-layout-sidebar-width="narrow" data-layout-nowrap>
        <nav aria-label="No-wrap example"><layout-card data-variant="outlined" data-padding="s"><p>Sidebar</p></layout-card></nav>
        <section><layout-card data-variant="outlined" data-padding="s"><p>Content</p></layout-card></section>
      </layout-sidebar>
    </section>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
