<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Datalist Range with Tick Labels</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    body > layout-stack { max-inline-size: 30rem; }
  </style>
</head>
<body>
  <layout-stack data-layout-gap="m">
    <label for="budget-range">Budget range</label>
    <input
      type="range"
      id="budget-range"
      min="0"
      max="5000"
      step="500"
      value="2500"
      list="budget-ticks"
      data-range
      data-markers
    />
    <datalist id="budget-ticks">
      <option value="0" label="$0"></option>
      <option value="1000" label="$1k"></option>
      <option value="2000" label="$2k"></option>
      <option value="3000" label="$3k"></option>
      <option value="4000" label="$4k"></option>
      <option value="5000" label="$5k"></option>
    </datalist>
    <output id="budget-value" for="budget-range" aria-live="polite">Budget: $2,500</output>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
  <script>
    const range = document.getElementById('budget-range');
    const output = document.getElementById('budget-value');
    const fmt = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
    function update() { output.textContent = `Budget: ${fmt.format(range.value)}`; }
    range.addEventListener('input', update);
  </script>
</body>
</html>
