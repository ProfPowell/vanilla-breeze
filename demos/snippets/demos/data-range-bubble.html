<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Range bubble with prefix and suffix</title>
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    body > * { max-inline-size: 30rem; }
  </style>
</head>
<body>
  <layout-stack data-layout-gap="l">
    <form-field>
      <label for="price">Price</label>
      <input type="range" id="price" name="price" data-range data-bubble data-prefix="$" min="0" max="5000" step="50" value="1500" />
    </form-field>
    <form-field>
      <label for="opacity">Opacity</label>
      <input type="range" id="opacity" name="opacity" data-range data-bubble data-suffix="%" min="0" max="100" value="80" />
    </form-field>
  </layout-stack>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
