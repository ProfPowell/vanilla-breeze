<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>data-count with data-grow</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body {
      padding: var(--size-l);

  <form-field>
    <label for="msg">Message</label>
    <textarea id="msg" name="msg" data-count data-grow maxlength="500" rows="2"></textarea>
  </form-field>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
