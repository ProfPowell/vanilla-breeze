<!doctype html>
<html lang="en">
<!-- [html-validate-disable heading-level: skeleton placeholders mirror headings inside a larger page] -->
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Skeleton - Text Placeholder</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body {
      padding: var(--size-l);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <layout-card data-max="narrow" aria-busy="true" aria-label="Loading content" role="status">
    <layout-stack data-loading="skeleton" data-layout-gap="xs" data-layout-align="start" aria-hidden="true">
      <h2>Placeholder article heading</h2>
      <p>Placeholder text that stands in for the first line of the paragraph while it loads</p>
      <p>Placeholder text that stands in for the second line of the paragraph as well</p>
      <p>A shorter placeholder for the closing line</p>
    </layout-stack>
  </layout-card>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
