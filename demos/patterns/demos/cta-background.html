<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>CTA - Background Image</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body {
      margin: 0;
    }
    section.hero .lead {
      font-size: var(--font-size-l);
    }
    .cta-with-bg {
      background-image: linear-gradient(135deg, #1e3a5f 0%, #0d1b2a 100%);
      background-size: cover;
      background-position: center;
      position: relative;
    }
    .cta-with-bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--color-overlay-strong);
    }
    .cta-with-bg > * {
      position: relative;
      color: var(--color-white);
    }
    .cta-with-bg :is(h2, .lead) {
      color: var(--color-white);
    }
    .cta-with-bg .button.ghost {
      color: var(--color-white);
      border-color: var(--color-white);
    }
    .cta-with-bg .button.ghost:hover {
      background: oklch(100% 0 0 / 0.1);
    }
  </style>
</head>
<body>
  <h1>CTA - Background Image</h1>
  <section class="hero cta-with-bg" data-padding>
    <layout-center data-layout-max="normal">
      <layout-stack data-layout-gap="l">
        <h2>Transform your workflow today</h2>
        <p class="lead">
          Stop struggling with complex toolchains. Vanilla Breeze gives you
          everything you need to build beautiful, responsive interfaces.
        </p>
        <nav>
          <ul data-layout="cluster" data-layout-justify="center" data-layout-gap="m">
            <li><a href="#" class="button large">Get Started Free</a></li>
            <li><a href="#" class="button large ghost">See Pricing</a></li>
          </ul>
        </nav>
      </layout-stack>
    </layout-center>
  </section>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
