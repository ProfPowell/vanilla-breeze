<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Navbar - Mobile</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body {
      margin: 0;
      background: var(--color-surface);
      min-height: 350px;
    }

    .page-content {
      padding: var(--size-xl);
      color: var(--color-text-muted);
    }
  </style>
</head>
<body>
  <header aria-label="Navbar Mobile header" class="site">
    <a href="/"><brand-mark>Acme Co</brand-mark></a>
    <nav class="horizontal" aria-label="Main navigation">
      <ul>
        <li><a href="#">Products</a></li>
        <li><a href="#">Pricing</a></li>
        <li><a href="#" aria-current="page">About</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
    <mobile-menu breakpoint="48rem">
      <button type="button" data-trigger popovertarget="site-menu" aria-label="Menu">
        <icon-wc name="menu"></icon-wc>
      </button>
      <nav popover id="site-menu" class="mobile-menu-panel" aria-label="Site menu">
        <button type="button" class="mobile-menu-close" popovertarget="site-menu" popovertargetaction="hide" aria-label="Close menu">
          <icon-wc name="x"></icon-wc>
        </button>
        <ul>
          <li><a href="#">Products</a></li>
          <li><a href="#">Pricing</a></li>
          <li><a href="#" aria-current="page">About</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
    </mobile-menu>
  </header>

  <main class="page-content">
    <p>At 48rem and below, the main navigation hides and the menu button appears. The button opens a native popover panel: <kbd>Esc</kbd> or an outside click closes it, with no script of your own.</p>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
