<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Testimonials - With Avatars</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body {
      margin: 0;
      padding-block: var(--size-2xl);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <h1>Testimonials - With Avatars</h1>
  <section data-layout="center" data-layout-max="wide" data-layout-gap="2xl">
    <hgroup data-layout="center" data-layout-max="narrow" data-layout-text data-layout-gap="s">
      <h2>Trusted by developers worldwide</h2>
      <p class="lead">Join thousands of teams building better products with our framework.</p>
    </hgroup>
    <layout-grid data-layout-min="l" data-layout-gap="l">
      <layout-card data-variant="outlined" data-padding="l">
        <figure data-layout="stack" data-layout-gap="m">
          <star-rating value="5" readonly label="Rating"></star-rating>
          <blockquote>
            <p>"The layout primitives are incredibly powerful. We've built complex dashboards with minimal custom CSS."</p>
          </blockquote>
          <figcaption data-layout="cluster" data-layout-gap="s" data-layout-align="center">
            <user-avatar data-size="lg">
              <img src="/src/assets/placeholders/photo-reel-team-members-1-100x100.svg" alt="" />
            </user-avatar>
            <span><strong>Alex Thompson</strong><br/><small>Lead Developer, DataFlow</small></span>
          </figcaption>
        </figure>
      </layout-card>
      <layout-card data-variant="outlined" data-padding="l">
        <figure data-layout="stack" data-layout-gap="m">
          <star-rating value="5" readonly label="Rating"></star-rating>
          <blockquote>
            <p>"Finally, a CSS framework that embraces modern standards without the bloat. Our bundle size dropped by 60%."</p>
          </blockquote>
          <figcaption data-layout="cluster" data-layout-gap="s" data-layout-align="center">
            <user-avatar data-size="lg">
              <img src="/src/assets/placeholders/photo-reel-team-members-1-100x100.svg" alt="" />
            </user-avatar>
            <span><strong>Maria Santos</strong><br/><small>Frontend Architect, ScaleUp</small></span>
          </figcaption>
        </figure>
      </layout-card>
      <layout-card data-variant="outlined" data-padding="l">
        <figure data-layout="stack" data-layout-gap="m">
          <star-rating value="5" readonly label="Rating"></star-rating>
          <blockquote>
            <p>"The documentation is exceptional. New team members are productive within hours, not days."</p>
          </blockquote>
          <figcaption data-layout="cluster" data-layout-gap="s" data-layout-align="center">
            <user-avatar data-size="lg">
              <img src="/src/assets/placeholders/photo-reel-team-members-3-100x100.svg" alt="" />
            </user-avatar>
            <span><strong>James Wilson</strong><br/><small>VP Engineering, CloudBase</small></span>
          </figcaption>
        </figure>
      </layout-card>
      <layout-card data-variant="outlined" data-padding="l">
        <figure data-layout="stack" data-layout-gap="m">
          <star-rating value="5" readonly label="Rating"></star-rating>
          <blockquote>
            <p>"We migrated from a heavy framework and saw immediate performance improvements. Users noticed the difference."</p>
          </blockquote>
          <figcaption data-layout="cluster" data-layout-gap="s" data-layout-align="center">
            <user-avatar data-size="lg">
              <img src="/src/assets/placeholders/photo-reel-team-members-4-100x100.svg" alt="" />
            </user-avatar>
            <span><strong>Priya Patel</strong><br/><small>Tech Lead, AppWorks</small></span>
          </figcaption>
        </figure>
      </layout-card>
    </layout-grid>
  </section>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
