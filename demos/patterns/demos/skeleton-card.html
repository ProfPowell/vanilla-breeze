<!doctype html>
<html lang="en">
<!-- [html-validate-disable heading-level: skeleton placeholders mirror headings inside a larger page] -->
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Skeleton - Card Placeholder</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body {
      padding: var(--size-l);
      background: var(--color-surface-alt);
    }
  </style>
</head>
<body>
  <layout-grid data-layout-min="l" data-layout-gap="l">
    <layout-card data-padding="m" aria-busy="true" aria-label="Loading card" role="status">
      <layout-stack data-loading="skeleton" data-layout-gap="xs" data-layout-align="start" aria-hidden="true">
        <img src="/src/assets/placeholders/photo-figure-1-600x400.svg" alt="" width="600" height="400"/>
        <h3>Placeholder card title</h3>
        <p>Placeholder summary line for the card</p>
        <p>A shorter second line</p>
        <button type="button" disabled>Read more</button>
      </layout-stack>
    </layout-card>

    <layout-card data-padding="m" aria-busy="true" aria-label="Loading card" role="status">
      <layout-stack data-loading="skeleton" data-layout-gap="xs" data-layout-align="start" aria-hidden="true">
        <img src="/src/assets/placeholders/photo-figure-1-600x400.svg" alt="" width="600" height="400"/>
        <h3>Placeholder card title</h3>
        <p>Placeholder summary line for the card</p>
        <p>A shorter second line</p>
        <button type="button" disabled>Read more</button>
      </layout-stack>
    </layout-card>

    <layout-card data-padding="m" aria-busy="true" aria-label="Loading card" role="status">
      <layout-stack data-loading="skeleton" data-layout-gap="xs" data-layout-align="start" aria-hidden="true">
        <img src="/src/assets/placeholders/photo-figure-1-600x400.svg" alt="" width="600" height="400"/>
        <h3>Placeholder card title</h3>
        <p>Placeholder summary line for the card</p>
        <p>A shorter second line</p>
        <button type="button" disabled>Read more</button>
      </layout-stack>
    </layout-card>
  </layout-grid>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
