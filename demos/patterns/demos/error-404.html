<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Error 404 - Page Not Found</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body {
      margin: 0;
    }
    /* The oversized status number is this recipe's own look */
    .error-code {
      font-size: clamp(4rem, 15vw, 8rem);
      font-weight: var(--font-weight-bold);
      color: var(--color-text-muted);
      line-height: 1;
      letter-spacing: -0.02em;
    }
  </style>
</head>
<body data-layout="cover" data-layout-min="xl" data-layout-padding="l">
  <main data-layout="center" data-layout-max="narrow" data-layout-principal data-layout-intrinsic data-layout-text data-layout-gap="xl">
    <span class="error-code">404</span>
    <hgroup class="spaced" data-align="center">
      <h1>Page not found</h1>
      <p>Sorry, we couldn't find the page you're looking for. It may have been moved or deleted.</p>
    </hgroup>
    <footer data-layout="stack" data-layout-gap="m" data-layout-align="center">
      <a href="/" class="button">
        <icon-wc name="home"></icon-wc>
        Go back home
      </a>
      <nav class="horizontal" aria-label="Additional navigation">
        <ul>
          <li><a href="/search">Search</a></li>
          <li><a href="/sitemap">Sitemap</a></li>
          <li><a href="/contact">Contact support</a></li>
        </ul>
      </nav>
    </footer>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
