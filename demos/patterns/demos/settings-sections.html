<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Settings - Grouped Sections</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body {
      background: var(--color-surface-alt);
      padding: var(--size-xl);
    }
    fieldset {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-l);
      padding: var(--size-l);
    }
    fieldset legend {
      font-size: var(--font-size-l);
      font-weight: var(--font-weight-semibold);
      padding: 0 var(--size-xs);
    }
  </style>
</head>
<body>
  <main data-layout="center" data-layout-max="normal">
    <form action="/settings" method="POST" data-layout="stack" data-layout-gap="xl">
      <hgroup>
        <h1>Settings</h1>
        <p>Manage your account settings and preferences.</p>
      </hgroup>

      <!-- Profile Section -->
      <fieldset>
        <legend>Profile</legend>
        <layout-stack data-layout-gap="l">
          <form-field>
            <label for="name">Full name</label>
            <input type="text" id="name" name="name" value="John Doe"
                   autocomplete="name" aria-describedby="name-hint"/>
            <output id="name-hint" for="name">
              This is how your name will appear across the platform.
            </output>
          </form-field>

          <form-field>
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" value="john@example.com"
                   autocomplete="email" aria-describedby="email-hint"/>
            <output id="email-hint" for="email">
              Used for account notifications and sign-in.
            </output>
          </form-field>

          <form-field>
            <label for="bio">Bio</label>
            <textarea id="bio" name="bio" rows="4"
                      placeholder="Tell us about yourself..."
                      aria-describedby="bio-hint"></textarea>
            <output id="bio-hint" for="bio">
              Brief description for your profile. Maximum 200 characters.
            </output>
          </form-field>
        </layout-stack>
      </fieldset>

      <!-- Notifications Section -->
      <fieldset>
        <legend>Notifications</legend>
        <layout-stack data-layout-gap="m">
          <label>
            <input type="checkbox" name="notify_comments" checked/>
            <span>
              Comments<br/>
              <small>Get notified when someone comments on your posts.</small>
            </span>
          </label>
          <label>
            <input type="checkbox" name="notify_mentions" checked/>
            <span>
              Mentions<br/>
              <small>Get notified when someone mentions you.</small>
            </span>
          </label>
          <label>
            <input type="checkbox" name="notify_followers"/>
            <span>
              New followers<br/>
              <small>Get notified when someone follows you.</small>
            </span>
          </label>
          <label>
            <input type="checkbox" name="notify_digest" checked/>
            <span>
              Weekly digest<br/>
              <small>Receive a weekly summary of activity.</small>
            </span>
          </label>
          <label>
            <input type="checkbox" name="notify_marketing"/>
            <span>
              Marketing emails<br/>
              <small>Receive updates about new features and promotions.</small>
            </span>
          </label>
        </layout-stack>
      </fieldset>

      <!-- Privacy Section -->
      <fieldset>
        <legend>Privacy</legend>
        <layout-stack data-layout-gap="m">
          <p><small>Control who can see your profile and activity.</small></p>
          <label>
            <input type="radio" name="visibility" value="public"/>
            <span>
              Public<br/>
              <small>Anyone can view your profile and activity.</small>
            </span>
          </label>
          <label>
            <input type="radio" name="visibility" value="private" checked/>
            <span>
              Private<br/>
              <small>Only approved followers can see your activity.</small>
            </span>
          </label>
          <label>
            <input type="radio" name="visibility" value="hidden"/>
            <span>
              Hidden<br/>
              <small>Your profile is not visible in search or discovery.</small>
            </span>
          </label>
        </layout-stack>
      </fieldset>

      <!-- Save Button -->
      <footer data-layout="cluster" data-layout-justify="end" data-layout-gap="m">
        <button type="button" class="secondary">Cancel</button>
        <button type="submit">Save changes</button>
      </footer>
    </form>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
