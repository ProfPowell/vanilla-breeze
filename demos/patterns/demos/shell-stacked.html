<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>App Shell - Stacked (Refactored)</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    /* Surface & border styling only - layout handled by VB attributes */
    header {
      background: var(--color-surface);
      border-block-end: 1px solid var(--color-border);
      padding: var(--size-m) var(--size-l);
    }
    main {
      background: var(--color-surface-alt);
      padding: var(--size-xl) var(--size-l);
    }
    footer {
      background: var(--color-surface);
      border-block-start: 1px solid var(--color-border);
      padding: var(--size-m) var(--size-l);
      text-align: center;
      font-size: var(--font-size-s);
      color: var(--color-text-muted);
    }
  </style>
</head>
<body data-page-layout="stack" data-layout-gap="none">
  <header data-layout="cluster" data-layout-justify="between">
    <a href="#"><brand-mark>AppName</brand-mark></a>
    <nav class="horizontal pills" aria-label="Main navigation">
      <ul>
        <li><a href="#" aria-current="page">Dashboard</a></li>
        <li><a href="#">Projects</a></li>
        <li><a href="#">Reports</a></li>
        <li><a href="#">Settings</a></li>
      </ul>
    </nav>
    <layout-cluster data-layout-gap="s">
      <button type="button" class="button small" aria-label="Notifications">
        <icon-wc name="bell"></icon-wc>
      </button>
      <button type="button" class="button small" aria-label="User menu">
        <icon-wc name="user"></icon-wc>
      </button>
    </layout-cluster>
  </header>

  <main>
    <layout-center data-layout-max="wide" data-layout-gap="l">
      <h1>Dashboard</h1>
      <layout-grid data-layout-min="s" data-layout-gap="m">
        <score-card>
          <span slot="title">Total Users</span>
          <data slot="value" value="12543">12,543</data>
        </score-card>
        <score-card>
          <span slot="title">Active Projects</span>
          <data slot="value" value="48">48</data>
        </score-card>
        <score-card>
          <span slot="title">Revenue</span>
          <data slot="value" value="84230">$84,230</data>
        </score-card>
        <score-card>
          <span slot="title">Conversion Rate</span>
          <data slot="value" value="0.032">3.2%</data>
        </score-card>
      </layout-grid>
      <layout-card data-variant="outlined" data-padding="l">
        <h2>Recent Activity</h2>
        <p>Your recent activity will appear here.</p>
      </layout-card>
    </layout-center>
  </main>

  <footer>
    <p>&copy; 2026 AppName. All rights reserved.</p>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
