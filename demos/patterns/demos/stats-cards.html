<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Stats - Card-Based</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body {
      padding: var(--size-l);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <section data-layout="grid" data-layout-min="m" data-layout-gap="l" aria-label="Key metrics">
    <score-card trend="up">
      <span slot="title">Total Users</span>
      <data slot="value" value="24521">24,521</data>
      <small slot="change"><data value="0.125">+12.5%</data> from last month</small>
      <icon-wc slot="icon" name="users" size="md"></icon-wc>
    </score-card>

    <score-card trend="up">
      <span slot="title">Revenue</span>
      <data slot="value" value="48352">$48,352</data>
      <small slot="change"><data value="0.082">+8.2%</data> from last month</small>
      <icon-wc slot="icon" name="dollar-sign" size="md"></icon-wc>
    </score-card>

    <score-card trend="down">
      <span slot="title">Active Sessions</span>
      <data slot="value" value="1893">1,893</data>
      <small slot="change"><data value="-0.024">-2.4%</data> from last month</small>
      <icon-wc slot="icon" name="activity" size="md"></icon-wc>
    </score-card>

    <score-card trend="up">
      <span slot="title">Conversion Rate</span>
      <data slot="value" value="0.032">3.2%</data>
      <small slot="change"><data value="0.004">+0.4%</data> from last month</small>
      <icon-wc slot="icon" name="percent" size="md"></icon-wc>
    </score-card>
  </section>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
