<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Dashboard - Charts Layout</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <link rel="stylesheet" href="/cdn/vanilla-breeze-charts.css"/>
  <style>
    body {
      margin: 0;
      padding: var(--size-xl);
      background: var(--color-surface-alt);
    }
    layout-cluster select {
      inline-size: auto;
    }

    /* Sparkline themed by trend color */
    svg[slot="sparkline"]        { display: block; inline-size: 100%; block-size: 100%; }
    svg[slot="sparkline"] path   { fill: none; stroke: currentColor; stroke-width: 2; vector-effect: non-scaling-stroke; }
    svg[slot="sparkline"] circle { fill: currentColor; }
    score-card[trend="up"]   [slot="sparkline"] { color: var(--color-success); }
    score-card[trend="down"] [slot="sparkline"] { color: var(--color-error); }
    score-card[trend="flat"] [slot="sparkline"] { color: var(--color-text-muted); }
  </style>
</head>
<body>
  <main data-layout="center" data-layout-max="wide" data-layout-gap="l">
    <!-- Page Header -->
    <header data-layout="cluster" data-layout-justify="between" data-layout-align="center">
      <h1>Analytics</h1>
      <layout-cluster data-layout-gap="s">
        <select aria-label="Time period">
          <option>Last 7 days</option>
          <option selected>Last 30 days</option>
          <option>Last 90 days</option>
          <option>Last year</option>
        </select>
        <button type="button" class="button">
          <icon-wc name="refresh-cw" size="sm"></icon-wc>
          Refresh
        </button>
      </layout-cluster>
    </header>

    <!-- Top Stats Row -->
    <layout-grid data-layout-gap="l" data-layout-min="m">
      <score-card trend="up" tone="info">
        <span slot="title">Total Visitors</span>
        <data slot="value" value="24521">24,521</data>
        <small slot="change"><data value="0.125">+12.5%</data></small>
        <svg slot="sparkline" viewBox="0 0 100 30" preserveAspectRatio="none" role="img" aria-label="Visitors trend, increasing">
          <path d="M 0 22 L 20 19 L 40 17 L 60 12 L 80 8 L 100 4"/>
          <circle cx="100" cy="4" r="2"/>
        </svg>
        <icon-wc slot="icon" name="users" size="md"></icon-wc>
      </score-card>

      <score-card trend="up" tone="info">
        <span slot="title">Page Views</span>
        <data slot="value" value="89432">89,432</data>
        <small slot="change"><data value="0.083">+8.3%</data></small>
        <svg slot="sparkline" viewBox="0 0 100 30" preserveAspectRatio="none" role="img" aria-label="Page views trend, increasing">
          <path d="M 0 20 L 20 18 L 40 15 L 60 13 L 80 10 L 100 7"/>
          <circle cx="100" cy="7" r="2"/>
        </svg>
        <icon-wc slot="icon" name="eye" size="md"></icon-wc>
      </score-card>

      <score-card trend="down" tone="warning">
        <span slot="title">Bounce Rate</span>
        <data slot="value" value="0.423">42.3%</data>
        <small slot="change"><data value="-0.021">-2.1%</data></small>
        <svg slot="sparkline" viewBox="0 0 100 30" preserveAspectRatio="none" role="img" aria-label="Bounce rate trend, decreasing">
          <path d="M 0 8 L 20 10 L 40 11 L 60 13 L 80 15 L 100 18"/>
          <circle cx="100" cy="18" r="2"/>
        </svg>
        <icon-wc slot="icon" name="alert-circle" size="md"></icon-wc>
      </score-card>

      <score-card trend="up" tone="success">
        <span slot="title">Avg. Session</span>
        <data slot="value" value="272">4m 32s</data>
        <small slot="change"><data value="0.187">+18.7%</data></small>
        <svg slot="sparkline" viewBox="0 0 100 30" preserveAspectRatio="none" role="img" aria-label="Avg session trend, increasing">
          <path d="M 0 24 L 20 20 L 40 17 L 60 14 L 80 10 L 100 6"/>
          <circle cx="100" cy="6" r="2"/>
        </svg>
        <icon-wc slot="icon" name="clock" size="md"></icon-wc>
      </score-card>
    </layout-grid>

    <!-- Charts Row -->
    <layout-grid data-layout-gap="l" data-layout-min="xl">
      <!-- Main Chart -->
      <layout-card data-padding="l">
        <layout-stack data-layout-gap="m">
          <header data-layout="cluster" data-layout-justify="between" data-layout-align="center">
            <h2>Traffic Overview</h2>
            <layout-cluster data-layout-gap="s">
              <button type="button" class="button small ghost">Daily</button>
              <button type="button" class="button small secondary" aria-pressed="true">Weekly</button>
              <button type="button" class="button small ghost">Monthly</button>
            </layout-cluster>
          </header>
          <chart-wc
            data-type="area"
            data-label-y="Visitors"
            data-legend
            data-tooltip
            data-values='[
              {"name": "Visitors",   "values": {"Wk 1": 4200, "Wk 2": 5100, "Wk 3": 4800, "Wk 4": 6100, "Wk 5": 5900, "Wk 6": 7200}},
              {"name": "Page views", "values": {"Wk 1": 2900, "Wk 2": 3400, "Wk 3": 3100, "Wk 4": 4200, "Wk 5": 4400, "Wk 6": 5000}}
            ]'>
          </chart-wc>
        </layout-stack>
      </layout-card>

      <!-- Secondary Chart -->
      <layout-card data-padding="l">
        <layout-stack data-layout-gap="m">
          <h2>Traffic Sources</h2>
          <chart-wc
            data-type="pie"
            data-legend
            data-tooltip
            data-values='{"Organic": 42, "Direct": 26, "Referral": 18, "Social": 14}'>
          </chart-wc>
        </layout-stack>
      </layout-card>
    </layout-grid>

    <!-- Additional Charts Row -->
    <layout-grid data-layout-gap="l" data-layout-min="l">
      <layout-card data-padding="l">
        <layout-stack data-layout-gap="m">
          <h2>Top Pages</h2>
          <chart-wc
            data-type="bar"
            data-tooltip
            data-values='[
              {"name": "Views", "values": {"/home": 18200, "/pricing": 9400, "/docs": 7600, "/blog": 5100}}
            ]'>
          </chart-wc>
        </layout-stack>
      </layout-card>

      <layout-card data-padding="l">
        <layout-stack data-layout-gap="m">
          <h2>Device Types</h2>
          <chart-wc
            data-type="column"
            data-tooltip
            data-values='[
              {"name": "Share (%)", "values": {"Desktop": 58, "Mobile": 36, "Tablet": 6}}
            ]'>
          </chart-wc>
        </layout-stack>
      </layout-card>

      <layout-card data-padding="l">
        <layout-stack data-layout-gap="m">
          <h2>Top Countries</h2>
          <chart-wc
            data-type="column"
            data-tooltip
            data-values='[
              {"name": "Visitors", "values": {"US": 9800, "UK": 4100, "DE": 3300, "IN": 2900, "BR": 1700}}
            ]'>
          </chart-wc>
        </layout-stack>
      </layout-card>
    </layout-grid>
  </main>

  <script type="module" src="/src/main.js"></script>
  <script type="module" src="/cdn/vanilla-breeze-charts.js"></script>
</body>
</html>
