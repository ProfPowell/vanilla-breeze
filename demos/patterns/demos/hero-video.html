<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Hero - With Video</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body {
      margin: 0;
    }
    .hero .lead {
      font-size: var(--font-size-xl);
    }
    .hero-video-bg {
      position: relative;
      overflow: hidden;
    }
    .hero-video-bg video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hero-video-bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--color-overlay-strong);
      z-index: 1;
    }
    .hero-video-bg > *:not(video) {
      position: relative;
      z-index: 2;
      color: var(--color-white);
    }
    .hero-video-bg :is(h1, .lead) {
      color: var(--color-white);
    }
    .hero-video-bg .button.ghost {
      color: var(--color-white);
      border-color: var(--color-white);
    }
    .hero-video-bg .button.ghost:hover {
      background: oklch(100% 0 0 / 0.1);
    }
  </style>
</head>
<body>
  <section class="hero hero-video-bg">
    <!-- Demo shows the poster frame only; in production add autoplay loop and a <source> -->
    <video muted playsinline aria-hidden="true" poster="/src/assets/placeholders/photo-id-1036-1920x1080.svg"></video>
    <layout-cover data-layout-min="l" data-layout-padding="xl">
      <layout-center data-layout-max="normal">
        <layout-stack data-layout-gap="l">
          <h1>See it in action</h1>
          <p class="lead">
            Watch how teams are building faster with modern CSS.
            No frameworks, no complexity, just clean code.
          </p>
          <nav>
            <ul data-layout="cluster" data-layout-justify="center" data-layout-gap="m">
              <li><a href="#" class="button large">Play Full Video</a></li>
              <li><a href="#" class="button large ghost">Get Started</a></li>
            </ul>
          </nav>
        </layout-stack>
      </layout-center>
    </layout-cover>
  </section>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
