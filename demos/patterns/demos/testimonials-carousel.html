<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Testimonials - Carousel</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body {
      margin: 0;
      padding-block: var(--size-2xl);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <h1>Testimonials - Carousel</h1>
  <section data-layout="center" data-layout-max="wide" data-layout-gap="l">
    <hgroup data-layout="center" data-layout-max="narrow" data-layout-text data-layout-gap="s">
      <h2>Loved by teams everywhere</h2>
      <p class="lead">See what developers and designers are saying about their experience.</p>
    </hgroup>
    <carousel-wc item-width="min(500px, 85vw)" gap="l">
      <layout-card data-variant="outlined" data-padding="l">
        <figure data-layout="stack" data-layout-gap="m">
          <blockquote>
            <p class="lead">"The shift to semantic HTML has made our codebase so much cleaner. Junior developers can understand and contribute immediately. It's been a game-changer for our team velocity."</p>
          </blockquote>
          <figcaption data-layout="cluster" data-layout-gap="s" data-layout-align="center">
            <user-avatar data-size="xl">
              <img src="/src/assets/placeholders/photo-reel-team-members-2-100x100.svg" alt="" />
            </user-avatar>
            <span><strong>David Park</strong><br/><small>Engineering Manager, TechVenture</small></span>
          </figcaption>
        </figure>
      </layout-card>
      <layout-card data-variant="outlined" data-padding="l">
        <figure data-layout="stack" data-layout-gap="m">
          <blockquote>
            <p class="lead">"We've tried many CSS frameworks over the years. This is the first one that truly feels like it was built for modern browsers. No hacks, no workarounds, just clean CSS."</p>
          </blockquote>
          <figcaption data-layout="cluster" data-layout-gap="s" data-layout-align="center">
            <user-avatar data-size="xl">
              <img src="/src/assets/placeholders/photo-reel-team-members-4-100x100.svg" alt="" />
            </user-avatar>
            <span><strong>Sophie Laurent</strong><br/><small>Senior Frontend Developer, DesignStudio</small></span>
          </figcaption>
        </figure>
      </layout-card>
      <layout-card data-variant="outlined" data-padding="l">
        <figure data-layout="stack" data-layout-gap="m">
          <blockquote>
            <p class="lead">"The accessibility built into every component saved us weeks of remediation work. We passed our WCAG audit on the first try for the first time ever."</p>
          </blockquote>
          <figcaption data-layout="cluster" data-layout-gap="s" data-layout-align="center">
            <user-avatar data-size="xl">
              <img src="/src/assets/placeholders/photo-reel-team-members-3-100x100.svg" alt="" />
            </user-avatar>
            <span><strong>Michael Torres</strong><br/><small>Product Director, AccessibleApps</small></span>
          </figcaption>
        </figure>
      </layout-card>
      <layout-card data-variant="outlined" data-padding="l">
        <figure data-layout="stack" data-layout-gap="m">
          <blockquote>
            <p class="lead">"I was skeptical about another CSS framework, but the custom elements approach is brilliant. It reads like documentation and works beautifully. Highly recommended."</p>
          </blockquote>
          <figcaption data-layout="cluster" data-layout-gap="s" data-layout-align="center">
            <user-avatar data-size="xl">
              <img src="/src/assets/placeholders/photo-reel-team-members-2-100x100.svg" alt="" />
            </user-avatar>
            <span><strong>Rachel Kim</strong><br/><small>CTO, LaunchPad</small></span>
          </figcaption>
        </figure>
      </layout-card>
    </carousel-wc>
  </section>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
