<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Description List - Horizontal</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body {
      margin: 0;
      padding: var(--size-xl);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <h1>Description List - Horizontal</h1>
  <main data-layout="center" data-layout-max="narrow">
    <layout-card data-padding="l">
      <header>
        <h2>Account Information</h2>
      </header>

      <dl data-variant="horizontal" data-bordered>
        <dl-item>
          <dt>Full Name</dt>
          <dd>Alexandra Chen</dd>
        </dl-item>

        <dl-item>
          <dt>Email</dt>
          <dd>alexandra.chen@example.com</dd>
        </dl-item>

        <dl-item>
          <dt>Phone</dt>
          <dd>+1 (555) 123-4567</dd>
        </dl-item>

        <dl-item>
          <dt>Location</dt>
          <dd>San Francisco, California</dd>
        </dl-item>

        <dl-item>
          <dt>Status</dt>
          <dd>
            <layout-badge data-color="success" data-variant="subtle" data-size="l">Active</layout-badge>
          </dd>
        </dl-item>

        <dl-item>
          <dt>Member Since</dt>
          <dd>January 15, 2023</dd>
        </dl-item>
      </dl>
    </layout-card>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
