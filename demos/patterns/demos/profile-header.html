<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Profile - Header</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body {
      margin: 0;
      padding: var(--size-xl);
      background: var(--color-surface-alt);
    }
  </style>
</head>
<body>
  <main data-layout="center" data-layout-max="normal">
    <layout-card data-padding="xl">
      <header data-layout="media" data-layout-gap="xl">
        <!-- Avatar -->
        <user-avatar data-size="2xl" slot="figure">
          <span data-fallback>JD</span>
        </user-avatar>

        <!-- Name and Role -->
        <hgroup>
          <h1>Jane Doe</h1>
          <p>Senior Product Designer</p>
        </hgroup>

        <!-- Bio -->
        <p>
          Passionate about creating intuitive user experiences. Previously at Figma and Stripe.
          I love turning complex problems into simple, beautiful designs.
        </p>

        <!-- Stats -->
        <dl data-layout="cluster" data-layout-gap="xl" data-variant="stacked">
          <dl-item>
            <dt>Posts</dt>
            <dd><strong>142</strong></dd>
          </dl-item>
          <dl-item>
            <dt>Followers</dt>
            <dd><strong>12.4K</strong></dd>
          </dl-item>
          <dl-item>
            <dt>Following</dt>
            <dd><strong>891</strong></dd>
          </dl-item>
        </dl>

        <!-- Edit Button -->
        <p>
          <button type="button" class="button secondary">
            <icon-wc name="edit" size="sm"></icon-wc>
            Edit Profile
          </button>
        </p>
      </header>
    </layout-card>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
