<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>CTA - Centered</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <style>
    body {
      margin: 0;
    }
    section.hero .lead {
      font-size: var(--font-size-l);
      color: var(--color-text-muted);
    }
  </style>
</head>
<body>
  <h1>CTA - Centered</h1>
  <section class="hero alt" data-padding>
    <layout-center data-layout-max="normal">
      <layout-stack data-layout-gap="l">
        <h2>Ready to get started?</h2>
        <p class="lead">
          Join thousands of developers building better interfaces with Vanilla Breeze.
          Start your free trial today, no credit card required.
        </p>
        <nav>
          <ul data-layout="cluster" data-layout-justify="center" data-layout-gap="m">
            <li><a href="#" class="button large">Start Free Trial</a></li>
            <li><a href="#" class="button large secondary">Talk to Sales</a></li>
          </ul>
        </nav>
      </layout-stack>
    </layout-center>
  </section>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
