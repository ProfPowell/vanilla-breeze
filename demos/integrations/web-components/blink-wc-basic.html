<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>blink-wc with Vanilla Breeze: six modes</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <script type="module" src="/src/main.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/@profpowell/blink-wc@1.5.2/dist/blink-wc.css"/>
  <script type="module" src="https://unpkg.com/@profpowell/blink-wc@1.5.2/dist/blink-wc.js"></script>
  <style>
    body { margin: 0; background: var(--color-background); }
    main { padding: var(--size-l) var(--size-m); }
    h1 { margin: 0; font-size: var(--font-size-l); }
    h2 { margin: 0 0 var(--size-xs); font-size: var(--font-size-s); color: var(--color-text-muted); }
    section { font-size: var(--font-size-l); }
  </style>
</head>
<body>
  <main>
    <layout-stack data-layout-gap="l">
      <h1>blink-wc modes, themed by Vanilla Breeze</h1>

      <layout-grid data-layout-min="s" data-layout-gap="l">
        <section>
          <h2><code>mode="neon"</code></h2>
          <blink-wc mode="neon">Open late</blink-wc>
        </section>

        <section>
          <h2><code>mode="terminal"</code></h2>
          <blink-wc mode="terminal">npm run build</blink-wc>
        </section>

        <section>
          <h2><code>mode="warning"</code> with <code>behavior="pulse"</code></h2>
          <blink-wc mode="warning" behavior="pulse" rate="2s">Unsaved changes</blink-wc>
        </section>

        <section>
          <h2><code>mode="wave"</code></h2>
          <blink-wc mode="wave">Now boarding</blink-wc>
        </section>

        <section>
          <h2><code>mode="typewriter"</code></h2>
          <blink-wc mode="typewriter">Typed one letter at a time</blink-wc>
        </section>

        <section>
          <h2><code>mode="cascade"</code> with <code>unit="word"</code></h2>
          <blink-wc mode="cascade" unit="word">One word at a time</blink-wc>
        </section>
      </layout-grid>
    </layout-stack>
  </main>
</body>
</html>
