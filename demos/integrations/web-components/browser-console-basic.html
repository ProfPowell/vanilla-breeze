<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>browser-console on a Vanilla Breeze page</title>
  <link rel="stylesheet" href="/src/main.css" />
  <script type="module" src="/src/main.js"></script>
  <script type="module" src="https://unpkg.com/@profpowell/browser-console@1.1.1/dist/browser-console.js"></script>
  <style>
    body {
      padding: var(--size-m);
      background: var(--color-surface);
      color: var(--color-text);
    }
    main {
      max-inline-size: 80ch;
      margin-inline: auto;
    }
    h1 { font-size: var(--font-size-xl); }
    section {
      display: flex;
      flex-wrap: wrap;
      gap: var(--size-xs);
    }
    browser-console {
      block-size: 24rem;
      border: var(--border-width-thin) solid var(--color-border);
      border-radius: var(--radius-m);
      overflow: hidden;
    }
  </style>
</head>
<body>
  <main>
    <layout-stack data-layout-gap="m">
      <header>
        <h1>Checkout debug panel</h1>
        <p>Each button runs a <code>console</code> call in this page. The panel below shows it, colored from the Vanilla Breeze theme.</p>
      </header>

      <section aria-label="Console calls">
        <button type="button" id="log">log an order</button>
        <button type="button" id="info">info</button>
        <button type="button" id="warn">warn</button>
        <button type="button" id="error">error</button>
        <button type="button" id="table">table</button>
        <button type="button" id="group">group and timer</button>
      </section>

      <browser-console max-logs="200"></browser-console>
    </layout-stack>
  </main>

  <script type="module">
    const order = {
      id: 'A-1042',
      placed: new Date('2026-06-14T09:30:00'),
      paid: false,
      total: 86.5,
      items: ['Trail map', 'Stove fuel', 'Headlamp'],
      coupon: null,
    };

    const actions = {
      log: () => console.log('Order loaded', order),
      info: () => console.info('Shipping rates refreshed', 3, 'carriers'),
      warn: () => console.warn('Stock is low for', 'Headlamp'),
      error: () => console.error(new Error('Card was declined')),
      table: () => console.table([
        { item: 'Trail map', qty: 1, price: 12.5 },
        { item: 'Stove fuel', qty: 2, price: 9 },
        { item: 'Headlamp', qty: 1, price: 56 },
      ]),
      group: () => {
        console.group('Price check');
        console.time('lookup');
        console.log('Subtotal', 86.5);
        console.log('Tax', 6.92);
        console.timeEnd('lookup');
        console.groupEnd();
      },
    };

    for (const [id, run] of Object.entries(actions)) {
      document.getElementById(id).addEventListener('click', run);
    }

    // Show a few entries on load so the panel is not empty.
    await customElements.whenDefined('browser-console');
    actions.log();
    actions.info();
    actions.warn();
    actions.table();
  </script>
</body>
</html>
