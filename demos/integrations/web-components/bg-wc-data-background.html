<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>bg-wc with Vanilla Breeze: data-background binder</title>
  <link rel="stylesheet" href="/src/main.css"/>
  <script type="module" src="/src/main.js"></script>
  <script type="module" src="https://unpkg.com/@profpowell/bg-wc@0.5.1/dist/data-background.js"></script>
  <style>
    html, body { block-size: 100%; }
    body {
      margin: 0;
      font-family: var(--font-sans);
      color: var(--color-text);
      background: var(--color-background);
    }
    /* The binder positions its own <bg-wc> behind the content.
       The page only lays out the section. */
    section[data-background] {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-content: center;
      min-block-size: 100%;
      padding: var(--size-l) var(--size-m);
      text-align: center;
    }
    section[data-background] > article {
      /* Definite width: VB sets container-type:inline-size on <article>,
         which otherwise collapses it to 0 as a centered grid item. */
      inline-size: min(48ch, 90%);
      margin-inline: auto;
    }
    h1 { margin-block: 0 var(--size-s); }
  </style>
</head>
<body>
  <section
    data-background="mosaic"
    data-background-mode="blocks"
    data-background-intensity="0.7"
    data-background-density="0.55">
    <article>
      <h1>data-background binder</h1>
      <p>There is no <code>&lt;bg-wc&gt;</code> in this markup. A plain <code>&lt;section&gt;</code> carries <code>data-background="mosaic"</code> and three <code>data-background-*</code> settings, and the binder script draws the tiles behind the text.</p>
    </article>
  </section>
</body>
</html>
