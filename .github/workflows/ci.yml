# CI quality gate. Production deploys are Cloudflare Pages, connected
# directly to this repo (see admin/reference/build-and-deploy.md) — this
# workflow deploys nothing, it only decides whether main is healthy.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GATES — a red run here means main is unhealthy
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # pa11y tests skip in CI (they need puppeteer's Chromium, which we
      # don't install here — a11y coverage lives in quality-report's
      # Playwright integration tests instead).
      - name: Run validator tests
        env:
          CI: 'true'
        run: npm test

      - name: Type check (tsc --noEmit)
        run: npm run typecheck

      - name: Lint JS (ESLint + JSDoc)
        run: npm run lint:js

      - name: Lint HTML
        run: npm run lint:html

      - name: VB conformance check
        run: npm run conformance

      # The html-validate registry is generated from the api.json manifests, so
      # a manifest that claims an attribute the code never reads (or vice versa)
      # silently weakens lint:html. Validate the manifests and check for drift.
      - name: API manifests validate + drift check
        run: npm run validate:api && npm run check:api-drift

      - name: Theme token coverage
        run: npm run lint:theme-tokens

      - name: Build CDN bundles (for budget check)
        run: npm run build:cdn

      - name: Bundle size budget check
        run: npm run budget

  # REPORTS — informational, never fail the run
  quality-report:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The doc site has its own package (Cook SSG, pagefind); `npm run build`
      # shells into it, so it needs its own install or `cook` is not found.
      - name: Install site dependencies
        run: cd site && npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build site (test server serves site/dist/pages)
        run: npm run build

      - name: Visual regression tests
        run: npm run test:visual || true
        continue-on-error: true

      - name: Component behavior tests
        run: npm run test:components || true
        continue-on-error: true

      - name: Health dashboard
        run: npm run health || true
        continue-on-error: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
