# CI quality gate and production promotion.
# Cloudflare Pages builds production from the `production` branch and every
# other branch (including main) as a preview deployment. A push to main runs
# quality-gate; only if it passes does the promote job fast-forward
# `production` to that commit, which triggers the production deploy.
# See admin/reference/build-and-deploy.md (vanilla-breeze-d7v8).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GATES — a red run here means main is unhealthy
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # pa11y tests skip in CI (they need puppeteer's Chromium, which we
      # don't install here — a11y coverage lives in quality-report's
      # Playwright integration tests instead).
      - name: Run validator tests
        env:
          CI: 'true'
        run: npm test

      - name: Type check (tsc --noEmit)
        run: npm run typecheck

      - name: Lint JS (ESLint + JSDoc)
        run: npm run lint:js

      - name: Lint HTML
        run: npm run lint:html

      - name: VB conformance check
        run: npm run conformance

      # The html-validate registry is generated from the api.json manifests, so
      # a manifest that claims an attribute the code never reads (or vice versa)
      # silently weakens lint:html. Validate the manifests and check for drift.
      - name: API manifests validate + drift check
        run: npm run validate:api && npm run check:api-drift

      - name: Theme token coverage
        run: npm run lint:theme-tokens

      # Full site build (includes build:cdn for the budget check). The doc
      # site has its own package, so it needs its own install.
      - name: Install site dependencies
        run: cd site && npm ci

      - name: Build site
        run: npm run build

      - name: Bundle size budget check
        run: npm run budget

      # Internal links, asset refs, #fragments and code-block integrity on
      # the built site (scripts/check-links.mjs). External URLs are not
      # checked here; run `npm run check:links -- --external` locally.
      - name: Site link and content check
        run: npm run check:links

      # Component behavior suite (tests/components) against the built site,
      # served by scripts/test-server.mjs via playwright.config.js. ~4 min.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Component behavior tests
        run: npm run test:components

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: component-test-failures
          path: tests/visual/results/
          retention-days: 7

  # PROMOTE — the only thing that moves production. Fast-forward only:
  # an older run finishing after a newer one was promoted skips; a
  # `production` that no longer lines up with main fails loudly instead of
  # being overwritten.
  promote:
    needs: quality-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward production to this commit
        run: |
          git fetch origin production
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/production; then
            echo "::notice::production already contains $GITHUB_SHA (a newer commit was promoted); nothing to do."
          elif git merge-base --is-ancestor origin/production "$GITHUB_SHA"; then
            git push origin "$GITHUB_SHA:refs/heads/production"
            echo "::notice::Promoted $GITHUB_SHA to production."
          else
            echo "::error::origin/production has diverged from main; refusing to overwrite it. Reset production to a main commit by hand."
            exit 1
          fi

  # REPORTS — informational, never fail the run
  quality-report:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The visual suite (tests/visual) is not run in CI: its baselines are
      # rendered on macOS and ~700 of ~950 screenshots differ on Ubuntu from
      # font rasterization alone. Run `npm run test:visual` locally before a
      # release and when changing CSS (vanilla-breeze-zf9j).
      - name: Health dashboard
        run: npm run health || true
        continue-on-error: true
