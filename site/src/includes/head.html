<meta charset="UTF-8">
<title>${title} | ${siteTitle}</title>

<!-- Global Metadata -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#080d16">
<meta name="generator" content="Cook">
<!-- Opt in to the device-local <recently-visited> history tracker on every docs page. -->
<meta name="vb:track-history" content="on">

<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

<!-- Sitemap -->
<link rel="sitemap" type="application/xml" href="/sitemap.xml">

<!-- Primary Meta Tags -->

<meta name="title" content="${title} | ${siteTitle}">
<meta name="description" content="${description}">

<!-- Canonical URL -->
<link rel="canonical" href="${siteUrl}${currentPath}">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website">
<meta property="og:url" content="${siteUrl}${currentPath}">
<meta property="og:title" content="${title} | ${siteTitle}">
<meta property="og:description" content="${description}">
<meta property="og:image" content="${siteUrl}/og-image.png">

<!-- Twitter -->
<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:url" content="${siteUrl}${currentPath}">
<meta property="twitter:title" content="${title} | ${siteTitle}">
<meta property="twitter:description" content="${description}">
<meta property="twitter:image" content="${siteUrl}/og-image.png">

<!-- Theme: prevent flash of the wrong theme -->
<!-- FOUC guard: hide body while a non-core brand theme is still loading.
     The inline boot script below may document.write a <link rel="stylesheet"
     data-vb-theme-state="loading"> for the user's saved theme. With
     cross-document View Transitions enabled (@view-transition in
     view-transitions.css), the new page's first paint can happen before
     that stylesheet arrives, producing a one-frame flash in default theme
     before the user's real theme repaints. Hiding the body via :has()
     on the loading attribute keeps paint suppressed until the onload
     handler flips state → "ready" (or onerror → "error"), at which point
     this selector no longer matches and body becomes visible. -->
<style>
  html:has(link[data-vb-theme-state="loading"]) body {
    visibility: hidden;
  }

  /* Skip link (the layouts put it first in <body>, targeting <main id="main">).
     Same recipe as /docs/accessibility-utilities/#skip-link: off-screen until
     focused. */
  .skip-link {
    position: absolute;
    inset-block-start: var(--size-xs, 0.5rem);
    inset-inline-start: var(--size-xs, 0.5rem);
    z-index: 1000;
    padding: var(--size-s, 0.75rem) var(--size-m, 1rem);
    background: var(--color-surface, Canvas);
    color: var(--color-text, CanvasText);
    border: var(--border-width-thin, 1px) solid var(--color-border, CanvasText);
    border-radius: var(--radius-s, 0.25rem);
    transform: translateY(calc(-100% - 2rem));
    transition: transform var(--duration-fast, 150ms) ease-out;
  }

  .skip-link:focus-visible {
    transform: none;
    outline: var(--focus-ring-width, 2px) solid var(--focus-ring-color, Highlight);
    outline-offset: var(--focus-ring-offset, 2px);
  }

  @media (prefers-reduced-motion: reduce) {
    .skip-link { transition-duration: 0s; }
  }
</style>

<script data-vb-is-dev="${site.isDev}">
  try {
    // Read VBStore-format keys: `vb:{namespace}:{key}` with an envelope
    // { data, timestamp }. The boot used to read simple keys like
    // 'vb-theme' — those were never written by any code (theme-picker
    // and settings-panel both persist through VBStore), so every
    // localStorage.getItem returned null, the boot fell through to
    // the default theme, and ThemeManager.init() belatedly applied
    // the real brand — producing the visible flash from default →
    // stored theme on every page load.
    const vbRead = (ns, key) => {
      try {
        const raw = localStorage.getItem(`vb:${ns}:${key}`);
        if (!raw) return null;
        const env = JSON.parse(raw);
        return env && typeof env === 'object' && 'data' in env ? env.data : null;
      } catch { return null; }
    };

    const root = document.documentElement;
    // Snapshot the page's authored root attributes before writing stored
    // prefs over them: ThemeManager treats these as the page defaults
    // (reset() restores them; no preference never strips them).
    const ROOT_ATTRS = ['data-theme', 'data-accent', 'data-border-style', 'data-icon-set', 'data-fluid', 'data-backdrop', 'data-backdrop-chrome', 'data-mode', 'data-theme-source'];
    window.__vbAuthoredRoot = Object.fromEntries(ROOT_ATTRS.map((a) => [a, root.getAttribute(a)]));

    const stored = vbRead('theme', 'current') || {};
    // Root-attribute prefs: null/absent = page default. Schema v1 saved ''
    // (and accent 'default') for untouched keys, so those mean "no choice".
    const pref = (key) => {
      const v = stored[key];
      if (v == null) return null;
      if (!(stored.v >= 2) && (v === '' || (key === 'accent' && v === 'default'))) return null;
      return typeof v === 'string' && /^[a-z0-9 -]*$/.test(v) ? v : null;
    };
    const setRoot = (attr, value, off) => {
      if (value == null) return; // no choice: keep the authored attribute
      if (value === '' || value === off) root.removeAttribute(attr);
      else root.setAttribute(attr, value);
    };
    const mode = stored.mode || 'auto';
    const pinned = (root.getAttribute('data-theme') || '').split(/\s+/).find((t) => t && !t.startsWith('a11y-')) || '';
    const siteOwned = root.dataset.themeSource === 'site' && pinned;
    const brand = siteOwned ? pinned : (stored.brand && stored.brand !== 'default' ? stored.brand : (pinned || 'default'));
    const authoredMode = window.__vbAuthoredRoot['data-mode'];
    const pageMode = authoredMode === 'light' || authoredMode === 'dark';
    const isDev = document.currentScript?.dataset.vbIsDev === 'true';
    const coreThemes = new Set([
      'default',
      'a11y-high-contrast',
      'a11y-large-text',
      'a11y-dyslexia',
      'modern',
      'minimal',
      'classic'
    ]);
    const packThemes = new Set(['kawaii', 'memphis']);
    if (pageMode) {
      // The page forces its scheme; leave its authored data-mode alone.
    } else if (mode !== 'auto') {
      root.dataset.mode = mode;
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      root.dataset.mode = 'dark';
    }
    const a11y = vbRead('settings', 'a11y') || [];
    const parts = [];
    if (brand && brand !== 'default') parts.push(brand);
    parts.push(...(Array.isArray(a11y) ? a11y : []));
    if (parts.length) root.dataset.theme = parts.join(' ');
    const safeBrand = /^[a-z0-9-]+$/.test(brand) ? brand : 'default';
    // Only a stored brand needs fetching here; a pinned brand ships its CSS.
    if (!isDev && safeBrand !== pinned && safeBrand && !coreThemes.has(safeBrand) && !document.querySelector(`link[data-vb-theme="${safeBrand}"]`)) {
      const href = `/cdn/themes/${safeBrand}.css`;
      const packAttr = packThemes.has(safeBrand) ? ` data-vb-pack="${safeBrand}"` : '';
      document.write(
        `<link rel="stylesheet" href="${href}" data-vb-theme="${safeBrand}" data-vb-theme-state="loading" data-vb-theme-boot=""${packAttr} onload="this.setAttribute('data-vb-theme-state','ready')" onerror="this.setAttribute('data-vb-theme-state','error')">`
      );
      // Safety fallback: if neither onload nor onerror fires within 1.5s
      // (slow network, broken cache, …), flip the state anyway so the
      // :has(loading) FOUC guard above doesn't leave the page invisible.
      setTimeout(() => {
        const link = document.querySelector('link[data-vb-theme-boot]');
        if (link && link.getAttribute('data-vb-theme-state') === 'loading') {
          link.setAttribute('data-vb-theme-state', 'timeout');
        }
      }, 1500);
    }
    // Returning visitors: apply every stored root preference now, so nothing
    // repaints when ThemeManager.init() runs (same rules as apply()).
    setRoot('data-fluid', pref('fluid'));
    setRoot('data-backdrop', pref('backdrop'));
    setRoot('data-backdrop-chrome', pref('backdropChrome'), 'card');
    setRoot('data-border-style', pref('borderStyle'), 'clean');
    setRoot('data-icon-set', pref('iconSet'), 'lucide');
    setRoot('data-accent', pref('accent'), 'default');
    // Seed the browser chrome colour for the known mode. ThemeManager.apply()
    // replaces it with the computed --color-background once CSS is in.
    const effectiveMode = mode !== 'auto' ? mode
      : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    const themeColor = effectiveMode === 'dark' ? '#080d16' : '#ffffff';
    document.querySelectorAll('meta[name="theme-color"]').forEach((m) => {
      m.removeAttribute('media');
      m.content = themeColor;
    });
    const ext = vbRead('settings', 'extensions') || {};
    if (ext.motionFx === false) root.dataset.motionReduced = '';
    // WCAG 2.1.4 single-key shortcuts (src/lib/char-shortcuts.js re-applies on import)
    if (ext.charShortcuts === false) root.dataset.charShortcuts = 'off';
    else if (ext.charShortcuts === true) delete root.dataset.charShortcuts;
    if (vbRead('settings', 'sticky') === 'on') root.dataset.sticky = '';
  } catch(e) {}
</script>

${serviceWorkerMeta}

<!-- Analytics config (read by src/lib/analytics.js when vanilla-breeze-core.js boots).
     Transport 'beacon' POSTs to /api/analytics/*. Use 'console' to log events to
     devtools instead, or 'disabled' to turn analytics off entirely.

     Local dev (*.test, localhost, 127.0.0.1) has no analytics Worker, so the
     transport drops to 'disabled' to avoid 404 spam. Flip to 'console' in
     devtools via `vbAnalyticsConfig.transport = 'console'` before reload to
     inspect events locally.

     urlMasks collapses the /stats/?site=…&window=… query-string variants into
     a single canonical /stats/ path so the Top Pages panel doesn't fragment
     across every filter combination. See /docs/analytics/#url-masking. -->
<script>
  (function () {
    const host = location.hostname;
    const isLocal =
      host === 'localhost' || host === '127.0.0.1' || host.endsWith('.test');
    window.vbAnalyticsConfig = {
      siteId: 'vb-docs',
      transport: isLocal ? 'disabled' : 'beacon',
      endpoint: '/api/analytics',
      urlMasks: [
        { pattern: /^\/stats\/\?.*$/, replace: '/stats/' },
      ],
    };
  })();
</script>

<!-- Main CSS -->
<link rel="stylesheet" href="${site.css}">
<link rel="stylesheet" href="${site.fontsCss}">
<link rel="stylesheet" href="${site.uiCss}">

<!-- Glossary popover (definition-popover.js / .css are emitted by
     site/plugins/generate-definitions-json.js into dist/pages/{js,css}/) -->

<!-- Topic index sort + shared topic styles (emitted by
     site/plugins/generate-topic-assets.js). topic-sort.js early-exits when
     the page has no [data-topic-index]. -->
<link rel="stylesheet" href="/css/topic-index.css">
<script src="/js/topic-sort.js" defer></script>
